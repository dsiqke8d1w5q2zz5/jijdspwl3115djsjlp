// ══════════════════════════════════════════
//   觀察清單（只追蹤、不含成本/股數）
// ══════════════════════════════════════════
var _watchlist = (function(){
    try { return JSON.parse(localStorage.getItem('watchlist') || '[]') || []; } catch(e) { return []; }
})();
function _saveWatchlist() {
    try { localStorage.setItem('watchlist', JSON.stringify(_watchlist)); } catch(e) {}
}
function isWatched(id) { return _watchlist.some(function(w){ return w.id === id; }); }
// 加入觀察：id 必填、name 可選（沒給就用 id；之後抓到名稱會補）
function addToWatch(id, name) {
    id = String(id || '').trim().toUpperCase();
    if (!id) return;
    if (isWatched(id)) { toast('「' + id + '」已在觀察清單'); return; }
    var entry = { id: id, name: name || ((window._searchedNames && _searchedNames[id]) || '') };
    _watchlist.push(entry);
    _saveWatchlist();
    // 背景抓現價（沿用 Yahoo 報價，填入 stockData.prices）
    if (typeof fetchYahooQuotes === 'function') {
        fetchYahooQuotes([{ id: id }], function(){ if (stockSubTab === 'watch') renderStock(); });
    }
    // 沒名稱 → 背景查股名補上（與搜尋個股同一套 lookupStockName）
    if (!entry.name && typeof lookupStockName === 'function') {
        lookupStockName(id, function(err, nm){
            if (!err && nm) {
                entry.name = nm;
                if (!window._searchedNames) window._searchedNames = {};
                _searchedNames[id] = nm;
                _saveWatchlist();
                if (stockSubTab === 'watch') renderStock();
            }
        });
    }
    if (stockSubTab === 'watch') renderStock();
    toast('已加入觀察：' + id);
}
function removeFromWatch(id) {
    _watchlist = _watchlist.filter(function(w){ return w.id !== id; });
    _saveWatchlist();
    if (stockSubTab === 'watch') renderStock();
}

var _watchPricesFetched = false; // 進觀察分頁時背景抓一次現價
function renderWatchlist() {
    var html = '';
    // 工具列：加入觀察 + 更新現價
    html += '<div class="stock-refresh-bar">';
    html += '<button class="btn-refresh" style="background:var(--lux-navy)" onclick="openAddWatchModal()"><i class="ti ti-plus"></i> <span class="lbl-full">加入觀察</span><span class="lbl-short">加入</span></button>';
    html += '<button class="btn-refresh" onclick="refreshWatchPrices()"><i class="ti ti-antenna-bars-5"></i> <span class="lbl-full">更新現價</span><span class="lbl-short">更新</span></button>';
    html += '<span class="last-update" style="color:var(--muted);font-size:12px">點代號看漲跌日曆／走勢／基本面…</span>';
    html += '</div>';

    if (_watchlist.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:var(--muted)">觀察清單是空的。<br>點「＋ 加入觀察」輸入想追蹤的股票代號（不必填成本/股數）。</div>';
        return html;
    }

    // 進分頁首次自動抓一次現價（背景，抓到再重畫）
    if (!_watchPricesFetched) {
        _watchPricesFetched = true;
        var needPrice = _watchlist.filter(function(w){ return !stockData.prices[w.id]; });
        if (needPrice.length && typeof fetchYahooQuotes === 'function') {
            fetchYahooQuotes(needPrice.map(function(w){ return { id: w.id }; }), function(){ if (stockSubTab === 'watch') renderStock(); });
        }
    }
    // 名稱補抓：早期加入或抓不到名稱的(name 空或等於代號)→ 背景查股名補上,只查一次
    if (typeof lookupStockName === 'function') {
        _watchlist.forEach(function(w){
            var hasName = w.name && w.name !== w.id;
            if (!hasName && !w._nameLooking) {
                w._nameLooking = true;
                lookupStockName(w.id, function(err, nm){
                    if (!err && nm && nm !== w.id) {
                        w.name = nm;
                        if (!window._searchedNames) window._searchedNames = {};
                        _searchedNames[w.id] = nm;
                        _saveWatchlist();
                        if (stockSubTab === 'watch') renderStock();
                    }
                });
            }
        });
    }

    html += '<div class="table-wrap holdings-scroll"><table class="stock-table holdings-table"><thead><tr>';
    html += '<th class="col-holdings-name">代號／名稱</th>';
    html += '<th style="text-align:right">現價<br><span class="stock-sub-label" style="font-size:11px;color:var(--muted);font-weight:400">漲跌幅</span></th>';
    html += '<th class="col-price-chg" style="text-align:right">週</th>';
    html += '<th class="col-price-chg" style="text-align:right">月</th>';
    html += '<th class="col-price-chg" style="text-align:right">季</th>';
    html += '<th class="col-price-chg" style="text-align:right">半年</th>';
    html += '<th class="col-price-chg" style="text-align:right">一年</th>';
    html += '<th class="col-del" style="width:36px"></th>';
    html += '</tr></thead><tbody>';
    _watchlist.forEach(function(w) {
        var p = stockData.prices[w.id];
        var curPrice = p ? p.price : null;
        var change = (p && typeof p.change === 'number') ? p.change : null;
        var changePct = (change !== null && curPrice !== null && curPrice - change !== 0) ? (change / (curPrice - change)) * 100 : null;
        var nm = w.name || (window._searchedNames && _searchedNames[w.id]) || '';
        if (nm === w.id) nm = ''; // 名稱等於代號→當作無名稱、不重複顯示
        // 名稱列：有名稱顯示股名；還沒查到顯示淡色「查詢中…」而非重複代號
        var nameSubHtml = nm
            ? '<span class="stock-name-sub" style="font-size:12px;color:var(--muted);font-weight:400">' + esc(nm) + '</span>'
            : '<span class="stock-name-sub" style="font-size:11px;color:var(--muted-2);font-weight:400">查詢中…</span>';
        html += '<tr>';
        html += '<td class="stock-name-cell"><span style="cursor:pointer" onclick="showStockCalendarModal(' + escJs(w.id) + ')" title="點看漲跌日曆／走勢／基本面">' +
            '<b style="text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;color:var(--lux-navy)">' + esc(w.id) + '</b>' +
            '<br>' + nameSubHtml + '</span></td>';
        // 現價 / 漲跌幅
        var priceTxt = curPrice !== null ? curPrice.toFixed(2) : '<span style="color:var(--muted)">—</span>';
        var pctTxt = (changePct !== null && !isNaN(changePct))
            ? '<br><span class="stock-sub-val ' + (changePct>=0?'pos':'neg') + '" style="font-size:11px">' + (changePct>=0?'+':'') + changePct.toFixed(2) + '%</span>'
            : '';
        html += '<td style="text-align:right;font-weight:600">' + priceTxt + pctTxt + '</td>';
        html += '<td class="col-price-chg" style="text-align:right">' + fmtPriceChange(getStockPriceChange(w.id, 7)) + '</td>';
        html += '<td class="col-price-chg" style="text-align:right">' + fmtPriceChange(getStockPriceChange(w.id, 30)) + '</td>';
        html += '<td class="col-price-chg" style="text-align:right">' + fmtPriceChange(getStockPriceChange(w.id, 90)) + '</td>';
        html += '<td class="col-price-chg" style="text-align:right">' + fmtPriceChange(getStockPriceChange(w.id, 180)) + '</td>';
        html += '<td class="col-price-chg" style="text-align:right">' + fmtPriceChange(getStockPriceChange(w.id, 365)) + '</td>';
        html += '<td class="col-del" style="text-align:center"><button onclick="event.stopPropagation();removeFromWatch(' + escJs(w.id) + ')" title="移除觀察" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;font-size:15px;line-height:1"><i class="ti ti-x"></i></button></td>';
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
}

function refreshWatchPrices() {
    if (_watchlist.length === 0) { toast('觀察清單是空的'); return; }
    toast('更新現價中…');
    fetchYahooQuotes(_watchlist.map(function(w){ return { id: w.id }; }), function(){
        if (stockSubTab === 'watch') renderStock();
        toast('已更新觀察清單現價');
    });
}

// 加入觀察 modal：輸入代號「或股名」（名稱沿用個股搜尋的反查 _searchStockByName）
function openAddWatchModal() {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" style="max-width:420px"><h3><i class="ti ti-eye"></i> 加入觀察</h3>' +
        '<p style="font-size:13px;color:var(--muted);margin-bottom:8px">輸入股票代號或名稱（例：2330 或 台積電）：</p>' +
        '<input type="text" id="watch-add-input" placeholder="代號或名稱" autocomplete="off" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px">' +
        '<div id="watch-add-progress" style="font-size:12px;color:var(--muted);margin-top:8px;min-height:16px"></div>' +
        '<div id="watch-add-result" style="margin-top:4px"></div>' +
        '<div class="modal-btns" style="margin-top:12px"><button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
        '<button class="btn-primary" id="watch-add-ok">加入</button></div></div>';
    document.body.appendChild(ov);
    var input = document.getElementById('watch-add-input');
    input.focus();
    var prog = document.getElementById('watch-add-result');
    var progMsg = document.getElementById('watch-add-progress');
    var okBtn = document.getElementById('watch-add-ok');

    function _doAdd() {
        var raw = (input.value || '').trim();
        if (!raw) { toast('請輸入代號或名稱', true); return; }
        // 純代號（2~6位數字，可帶1英文字母，如 2330、00937B）→ 直接加
        var asId = raw.toUpperCase();
        if (/^[0-9]{2,6}[A-Z]?$/.test(asId)) {
            ov.remove();
            addToWatch(asId);
            return;
        }
        // 否則視為名稱 → 反查代號
        progMsg.textContent = '以名稱「' + esc(raw) + '」搜尋…';
        okBtn.disabled = true;
        _searchStockByName(raw, function(matches) {
            okBtn.disabled = false;
            progMsg.textContent = '';
            if (!matches || matches.length === 0) {
                progMsg.innerHTML = '<span style="color:var(--red)">查無「' + esc(raw) + '」，請改用代號</span>';
                return;
            }
            if (matches.length === 1) {
                var m = matches[0];
                ov.remove();
                addToWatch(m.id, m.name);
                return;
            }

// 是否為台股盤中（台灣時間 週一~五 9:00~13:30）
function _isMarketHours() {
    var tw = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var wd = tw.getDay();
    if (wd === 0 || wd === 6) return false; // 週末
    var hh = tw.getHours(), mm = tw.getMinutes();
    var minutes = hh * 60 + mm;
    return minutes >= 9 * 60 && minutes <= 13 * 60 + 30;
}

function startStockAutoRefresh() {
    stopStockAutoRefresh();
    // 啟動時立即更新一次（不論盤中盤外，至少給個初值）
    if (stockData.holdings.length > 0) refreshPrices(true);
    // 之後每 5 分鐘檢查：盤中才打 Yahoo（省 Apps Script 配額）
    _stockAutoTimer = setInterval(function() {
        if (!_isMarketHours()) return;
        if (stockData.holdings.length > 0) refreshPrices(true);
        // 觀察股：只在「目前正看著觀察分頁」時才順帶抓現價（省配額，沒在看就不抓）
        if (currentTab === 'stock' && stockSubTab === 'watch' && typeof _watchlist !== 'undefined' && _watchlist.length > 0) {
            fetchYahooQuotes(_watchlist.map(function(w){ return { id: w.id }; }), function(){
                if (currentTab === 'stock' && stockSubTab === 'watch') renderStock();
            });
        }
    }, 5 * 60 * 1000);
}

function stopStockAutoRefresh() {
    if (_stockAutoTimer) { clearInterval(_stockAutoTimer); _stockAutoTimer = null; }
}

// 排定下一個「台灣時間 15:00」執行：先抓一次盤後最終價，再寫當日快照
// 用 15:00 是等盤後撮合（14:30 結束）+ Yahoo 更新到最終價的緩衝
function scheduleDailySnapshot() {
    var tw = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var next = new Date(tw.getFullYear(), tw.getMonth(), tw.getDate(), 15, 0, 0);
    if (next <= tw) next.setDate(next.getDate() + 1); // 今天 15:00 已過 → 明天 15:00
    var delay = next.getTime() - tw.getTime();
    setTimeout(function() {
        try {
            // 先抓一次盤後最終價（不論是不是工作日，maybeAutoSnapshot 自己會擋週末）
            if (stockData && stockData.holdings && stockData.holdings.length > 0) {
                refreshPrices(true);
                // 抓完再寫快照（refreshPrices 是非同步，等 1.5 秒讓它跑完）
                setTimeout(function(){
                    try { maybeAutoSnapshot(); } catch(e) { console.error('[scheduleDailySnapshot snapshot]', e); }
                }, 1500);
            } else {
                maybeAutoSnapshot();
            }
        } catch(e) { console.error('[scheduleDailySnapshot]', e); }
        scheduleDailySnapshot(); // 排下一次
    }, delay);
}

var ASSET_SECTIONS = [
    { key: 'liquid',     label: '流動資金', sign: +1, color: '#22C55E', bg: '#F0FDF4' },
    { key: 'invest',     label: '投資',     sign: +1, color: '#6366F1', bg: '#EEF2FF' },

    { key: 'debt',       label: '負債',     sign: -1, color: '#EF4444', bg: '#FEF2F2' }
];
// 淨資產特殊條目（不在 section 卡片內，但 showSectionTrend 可以用同樣邏輯）
var NETWORTH_SECTION = { key: 'netWorth', label: '淨資產', sign: +1, color: '#0F2847', bg: '#F8F9FA' };
var _assetFxFetching = false;
// 右側常駐歷史面板目前顯示的分類 key（'netWorth' 或 ASSET_SECTIONS 的某 key）
var _pinnedHistoryKey = 'netWorth';

function _assetUid() { return 'a_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
function _todayStr() { return _localDateStr(new Date()); }

function getFxRate(currency) {
    if (currency === 'TWD' || !currency) return 1;
    var r = DATA.assets.rates[currency];
    return (typeof r === 'number' && r > 0) ? r : null; // 缺匯率回 null，不要悄悄當 1
}

var _fxMissingWarned = {};
function accountTWD(acc) {
    if (!acc) return 0;
    var amt = Number(acc.amount) || 0;
    if (acc.currency && acc.currency !== 'TWD') {
        var rate = (typeof acc.rate === 'number' && acc.rate > 0) ? acc.rate : getFxRate(acc.currency);
        if (rate === null || !(rate > 0)) {
            // 沒匯率且帳戶沒鎖定 rate，視為 0（避免外幣被當 TWD 1:1 灌水）
            if (amt !== 0 && !_fxMissingWarned[acc.currency]) {
                _fxMissingWarned[acc.currency] = true;
                setTimeout(function(){ if (typeof toast === 'function') toast(acc.currency + ' 匯率未載入，該幣別帳戶暫以 0 計入'); }, 500);
            }
            return 0;
        }
        return amt * rate;
    }
    return amt;
}

// 台股自動連動：持股市值總和
function calcStockHoldingsTWD() {
    if (!stockData || !Array.isArray(stockData.holdings)) return 0;
    var total = 0;
    stockData.holdings.forEach(function(h) {
        var p = stockData.prices && stockData.prices[h.id];
        var price = p ? p.price : (h.cost || 0);
        total += price * (h.shares || 0);
    });
    return total;
}
// 台股自動連動：質押借款總和
function calcStockPledgeDebtTWD() {
    if (!stockData || !Array.isArray(stockData.pledges)) return 0;
    return stockData.pledges.reduce(function(a, p){
        if (_pledgeType(p) === 'lend') return a;
        return a + (Number(p.amount) || 0);
    }, 0);
}

function sectionTotal(key) {
    if (key === 'invest') {
        var manual = (DATA.assets.invest || []).reduce(function(a,x){ return a + accountTWD(x); }, 0);
        return manual + calcStockHoldingsTWD();
    }
    if (key === 'debt') {
        var manual2 = (DATA.assets.debt || []).reduce(function(a,x){ return a + accountTWD(x); }, 0);
        return manual2 + calcStockPledgeDebtTWD();
    }
    return (DATA.assets[key] || []).reduce(function(a,x){ return a + accountTWD(x); }, 0);
}

function calcNetWorth() {
    var total = 0;
    ASSET_SECTIONS.forEach(function(s) { total += s.sign * sectionTotal(s.key); });
    return Math.round(total);
}

function calcBreakdown() {
    var b = {};
    ASSET_SECTIONS.forEach(function(s) { b[s.key] = Math.round(sectionTotal(s.key)); });
    return b;
}

// ── 自動快照 ──
function maybeAutoSnapshot() {
    try {
        var today = _todayStr();
        if (!Array.isArray(DATA.assets.history)) DATA.assets.history = [];
        var hist = DATA.assets.history;
        var nw = calcNetWorth();
        var br = calcBreakdown();
        var last = hist[hist.length - 1];
        if (last && last.date === today) {
            last.netWorth = nw;
            last.breakdown = br;
        } else {
            hist.push({ date: today, netWorth: nw, breakdown: br });
            if (hist.length > 3000) hist.splice(0, hist.length - 3000);
        }
        // 順便快照當日股價（若有現價則記錄，方便日後算「N 日價格漲跌」）
        try { snapshotStockPrices(today); } catch(_){}
        // 快照整體持倉市值（給報酬日曆用）
        try { snapshotPortfolioMarket(); } catch(_){}
        saveData(true);
        // 如果使用者剛好開著報酬日曆，自動刷新（讓今日那格立刻反映新快照）
        try {
            var calSlot = document.getElementById('return-calendar-slot');
            if (calSlot) calSlot.innerHTML = renderReturnCalendar();
        } catch(_){}
    } catch(e) { console.error('[maybeAutoSnapshot]', e); }
}

// 推算 TWSE 回傳的價格實際對應的交易日（考慮收盤時間 + 週末）
// 規則：台灣時間 14:00 後 → 今天；之前 / 週末 → 上一個交易日（往前找最近的工作日）
function _inferTradeDate() {
    // 用台灣時區
    var now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var hour = now.getHours();
    var afterClose = hour >= 14;
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (!afterClose) d.setDate(d.getDate() - 1);
    // 倒退到最近的工作日（跳過週末）
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return y + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

// 將當日「整體持倉市值」寫入 stockData.marketHistory = [{date, market}, ...]
// 規則：只在「台灣時間 14:00 後」且當天是工作日才寫入；同日多次開頁面以最後一次為主。
// 盤前/盤中/週末打開不寫；14:00 才寫是為了等 Yahoo 把當日收盤價清算完，避免拿到延遲價誤覆蓋。
function snapshotPortfolioMarket() {
    if (!stockData) return;
    if (!Array.isArray(stockData.holdings) || stockData.holdings.length === 0) return;
    if (!stockData.prices) return;
    // 收盤後判斷：台灣時間 15:00 之後才寫（給盤後撮合 14:30 結束 + Yahoo 更新到最終價的緩衝）
    var tw = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var weekday = tw.getDay(); // 0=日, 6=六
    if (weekday === 0 || weekday === 6) return; // 週末不寫
    var afterClose = tw.getHours() >= 15;
    if (!afterClose) return;
    var tradeDate = _localDateStr(tw);

    var total = 0;
    var hasAny = false;
    stockData.holdings.forEach(function(h){
        var p = stockData.prices[h.id];
        if (p && typeof p.price === 'number') {
            total += (h.shares || 0) * p.price;
            hasAny = true;
        }
    });
    if (!hasAny) return; // 沒任何現價就不記，避免寫入 0 造成日曆出現假的 -100% 跌幅
    if (!Array.isArray(stockData.marketHistory)) stockData.marketHistory = [];
    var arr = stockData.marketHistory;
    var last = arr[arr.length - 1];
    var dirty = false;
    if (last && last.date === tradeDate) {
        // 同日再開頁面 → 覆蓋為最新值（以最後一次為主）
        if (last.market !== total) { last.market = total; dirty = true; }
    } else {
        arr.push({ date: tradeDate, market: total });
        if (arr.length > 1500) arr.splice(0, arr.length - 1500);
        dirty = true;
    }
    if (dirty && typeof saveStockData === 'function') saveStockData();
}

// 清除價格歷史：清空各檔每日收盤價歷史與整體市值快照（報酬日曆／漲跌日曆／走勢圖歸零），
// 保留持股、股利、質押、已實現損益。清除前先推一份快照可救回。
function clearStockPriceHistory() {

// 將當日股價寫入 stockData.priceHistory[id] = [{date,price}, ...]
// 注意：date 是「資料實際對應的交易日」，不是「執行 snapshot 的今日」
function snapshotStockPrices(today) {
    if (!stockData) return;
    if (!stockData.priceHistory) stockData.priceHistory = {};
    if (!stockData.holdings || !stockData.prices) return;
    // 只在「台灣時間 15:00 後」且工作日寫入；之前不寫，避免拿 Yahoo 還未清算完的暫定價誤覆蓋
    // （台股 14:30 才完成盤後撮合，Yahoo 通常 14:35~15:00 才把最終價更新進 API）
    var tw = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var weekday = tw.getDay();
    if (weekday === 0 || weekday === 6) return;
    var afterClose = tw.getHours() >= 15;
    if (!afterClose) return;
    var tradeDate = _localDateStr(tw);
    var dirty = false;
    stockData.holdings.forEach(function(h) {
        var p = stockData.prices[h.id];
        if (!p || !p.price) return;
        if (!stockData.priceHistory[h.id]) stockData.priceHistory[h.id] = [];
        var arr = stockData.priceHistory[h.id];
        var lastEntry = arr[arr.length - 1];
        if (lastEntry && lastEntry.date === tradeDate) {
            if (lastEntry.price !== p.price) { lastEntry.price = p.price; dirty = true; }
        } else {
            arr.push({ date: tradeDate, price: p.price });
            if (arr.length > 1500) arr.splice(0, arr.length - 1500); // 約 4 年上限
            dirty = true;
        }
    });
    if (dirty && typeof saveStockData === 'function') saveStockData();
}

// 用全市場清單（上市 + 上櫃）以「名稱關鍵字」反查代號
// 完整上市個股名稱清單（TWSE OpenAPI，含公司簡稱，不依當日行情；快取 1 天）
var _twseNameDictCache = null, _twseNameDictTime = 0;
function fetchTwseNameDict(callback) {
    if (_twseNameDictCache && (Date.now() - _twseNameDictTime < 86400000)) { callback(_twseNameDictCache); return; }
    fetchWithTimeout('https://openapi.twse.com.tw/v1/opendata/t187ap03_L', {}, 15000)
        .then(function(r){ return r.json(); })
        .then(function(arr){
            var map = {};
            if (Array.isArray(arr)) arr.forEach(function(x){
                var id = String(x['公司代號'] || '').trim();
                var name = String(x['公司簡稱'] || '').trim();
                if (id && name) map[id] = name;
            });
            if (Object.keys(map).length) { _twseNameDictCache = map; _twseNameDictTime = Date.now(); }
            callback(map);
        })
        .catch(function(){ callback({}); });
}

function _searchStockByName(kw, callback) {
    var key = kw.toLowerCase();
    fetchTWSEAll(function(e1, twse) {
        fetchTPEXAll(function(e2, tpex) {
            fetchTwseNameDict(function(nameDict) {
                var matches = [];
                var seen = {};
                function add(id, name, market) {
                    if (!name || seen[id]) return;
                    if (name.toLowerCase().indexOf(key) >= 0) { matches.push({ id: id, name: name, market: market }); seen[id] = true; }
                }
                function scan(map, market) {
                    if (!map) return;
                    Object.keys(map).forEach(function(id){ add(id, (map[id] && map[id].name) || '', market); });
                }
                scan(twse, '上市');
                scan(tpex, '上櫃');
                // 補：完整上市個股名稱清單（涵蓋當日行情清單沒有的，如未開盤日/這環境未來日期）
                if (nameDict) Object.keys(nameDict).forEach(function(id){ add(id, nameDict[id], '上市'); });
                // 名稱完全相同的排前面，其次依代號
                matches.sort(function(a, b){
                    var aExact = a.name === kw ? 0 : 1;
                    var bExact = b.name === kw ? 0 : 1;
                    if (aExact !== bExact) return aExact - bExact;
                    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
                });
                callback(matches);
            });
        });
    });
}

// 用代號實際向 Yahoo 抓歷史收盤、寫入 priceHistory、畫日曆
function _doStockSearchFetch(id, from, to) {
    id = String(id).toUpperCase();
    var prog = document.getElementById('ss-progress');
    var go = document.getElementById('ss-go');
    if (go) { go.disabled = true; }
    document.getElementById('ss-result').innerHTML = '';
    if (prog) prog.textContent = '向 Yahoo 股市查詢 ' + id + '（' + from + ' ~ ' + to + '）…可能需數十秒';
    var url = CLOUD_URL + '?action=history&format=json&ids=' + encodeURIComponent(id) +
        '&from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to) + '&t=' + Date.now();
    fetchWithTimeout(url, {}, 120000)
        .then(function(r){ return r.json(); })
        .then(function(hist){
            if (!hist || typeof hist !== 'object') throw new Error('回傳格式錯誤');
            var rows = hist[id] || [];
            if (!stockData.priceHistory) stockData.priceHistory = {};
            if (!Array.isArray(stockData.priceHistory[id])) stockData.priceHistory[id] = [];
            var byDate = {};
            stockData.priceHistory[id].forEach(function(e){ if (e && e.date) byDate[e.date] = e.price; });
            rows.forEach(function(rw){
                if (!rw || !rw.date || typeof rw.price !== 'number') return;
                byDate[rw.date] = rw.price;
            });
            stockData.priceHistory[id] = Object.keys(byDate).sort().map(function(d){ return { date: d, price: byDate[d] }; });
            saveStockData();
            if (go) go.disabled = false;
            if (stockData.priceHistory[id].length < 2) {
                if (prog) prog.innerHTML = '<b style="color:var(--red)">查無資料</b>：找不到 ' + esc(id) + ' 在此區間的收盤價，請確認代號。';
                document.getElementById('ss-result').innerHTML = '';
                return;
            }
            if (prog) prog.textContent = '';
            // 補抓完成後：關掉搜尋 modal，直接開個股 modal（完整分頁：漲跌日曆/走勢/歷史配息/基本面/籌碼面）
            // 先查名稱寫進臨時暫存，讓 modal 標題能顯示股名（非持股無 holding.name）
            lookupStockName(id, function(err, name){
                if (!err && name) { if (!window._searchedNames) window._searchedNames = {}; _searchedNames[id] = name; }
                closeStockSearchModal();
                showStockCalendarModal(id, 'calendar');
            });
        })
        .catch(function(err){
            console.error('[stock-search] failed', err);
            if (go) go.disabled = false;
            if (prog) prog.innerHTML = '<b style="color:var(--red)">失敗：</b>' + esc(String(err && err.message || err));
        });
}

function runBackfillHistory(from, to, ids, ov) {
    var btn = document.getElementById('bf-go');
    var prog = document.getElementById('bf-progress');
    if (btn) { btn.disabled = true; btn.textContent = '抓取中…'; }
    ids = (ids || []).filter(Boolean);
    if (prog) prog.textContent = '向 Yahoo 股市查詢 ' + ids.length + ' 檔（' + from + ' ~ ' + to + '）…可能需數十秒';
    var url = CLOUD_URL + '?action=history&format=json&ids=' + encodeURIComponent(ids.join(',')) +
        '&from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to) + '&t=' + Date.now();
    // Apps Script 逐月逐檔抓會比較久，給長一點 timeout
    fetchWithTimeout(url, {}, 120000)
        .then(function(r){ return r.json(); })
        .then(function(hist){
            if (!hist || typeof hist !== 'object') { throw new Error('回傳格式錯誤'); }
            if (!stockData.priceHistory) stockData.priceHistory = {};
            var totalAdded = 0, perStock = [];
            Object.keys(hist).forEach(function(sid){
                var rows = hist[sid] || [];
                if (!rows.length) { perStock.push(sid + '：無資料'); return; }
                if (!Array.isArray(stockData.priceHistory[sid])) stockData.priceHistory[sid] = [];
                var arr = stockData.priceHistory[sid];
                var byDate = {};
                arr.forEach(function(e){ if (e && e.date) byDate[e.date] = e.price; });
                var added = 0;
                rows.forEach(function(r){
                    if (!r || !r.date || typeof r.price !== 'number') return;
                    if (byDate[r.date] === undefined) added++;
                    byDate[r.date] = r.price; // 覆蓋為 Yahoo 收盤
                });
                stockData.priceHistory[sid] = Object.keys(byDate).sort().map(function(d){ return { date: d, price: byDate[d] }; });
                totalAdded += added;
                perStock.push(sid + '：' + rows.length + ' 筆（新增 ' + added + '）');
            });
            saveStockData();
            if (prog) prog.innerHTML = '<b style="color:var(--green)">完成</b>，共補 ' + totalAdded + ' 筆。記得按「雲端上傳」同步。';
            // 抓完後按鈕改為「關閉」，避免再按又抓一次
            if (btn) {
                btn.disabled = false;
                btn.textContent = '完成 ✓';
                btn.onclick = function() { if (ov) ov.remove(); };
            }
            if (typeof renderStock === 'function') renderStock();
            // 若個股 modal 開著且補的是這檔，重畫日曆／走勢分頁
            if (document.querySelector('.stock-cal-modal-overlay') &&
                ids.indexOf(_stockCalModalState.stockId) >= 0 &&
                typeof _renderStockCalModalBody === 'function') {
                _renderStockCalModalBody();
            }
            console.log('[backfill] ' + perStock.join('\n'));
            toast('歷史價補抓完成，共 ' + totalAdded + ' 筆');
        })
        .catch(function(err){
            console.error('[backfill] failed', err);
            if (prog) prog.innerHTML = '<b style="color:var(--red)">失敗：</b>' + esc(String(err && err.message || err));
            if (btn) { btn.disabled = false; btn.textContent = '重試'; }
        });
}

// ── 匯率自動抓（open.er-api.com） ──
function fetchFxRates(onDone) {
    if (_assetFxFetching) { if (onDone) onDone(false); return; }
    _assetFxFetching = true;
    var url = 'https://open.er-api.com/v6/latest/TWD';
    fetchWithTimeout(url).then(function(r){ return r.json(); }).then(function(data){
        _assetFxFetching = false;
        if (!data || data.result !== 'success' || !data.rates) {
            if (onDone) onDone(false);
            return;
        }
        // 回傳是 1 TWD = X foreign → 我們要 1 foreign = 1/X TWD
        var rates = DATA.assets.rates || {};
        ['USD','JPY','KRW'].forEach(function(c) {
            var v = data.rates[c];
            if (typeof v === 'number' && v > 0) rates[c] = 1 / v;
        });
        rates.updatedAt = _todayStr();
        DATA.assets.rates = rates;
        saveData(true);
        if (onDone) onDone(true);
    }).catch(function(err){
        _assetFxFetching = false;
        console.warn('[fetchFxRates] failed', err);
        if (onDone) onDone(false);

function fetchGoldPrice(onDone) {

// 取得某分類在指定回顧期的變化（金額與百分比）
// period: 'week' | 'month' | 'quarter' | 'ytd'
// 邏輯：找出 baseline 日期 → 找 history 中 date <= baseline 的最後一筆作為起點 → 與最新一筆比較
function getSectionChange(key, period) {
    var hist = (DATA.assets && DATA.assets.history) || [];
    if (hist.length === 0) return null;
    // netWorth 取 h.netWorth；其他 section 取 h.breakdown[key]
    function _valOf(h) {
        if (!h) return 0;
        if (key === 'netWorth') return h.netWorth || 0;
        return (h.breakdown && h.breakdown[key]) || 0;
    }
    var latest = hist[hist.length - 1];
    var latestVal = _valOf(latest);
    var today = new Date();
    var baseline;
    if (period === 'week')        { baseline = new Date(today); baseline.setDate(baseline.getDate() - 7); }
    else if (period === 'month')  { baseline = new Date(today); baseline.setMonth(baseline.getMonth() - 1); }
    else if (period === 'quarter'){ baseline = new Date(today); baseline.setMonth(baseline.getMonth() - 3); }
    else if (period === 'ytd')    { baseline = new Date(today.getFullYear(), 0, 1); baseline.setDate(baseline.getDate() - 1); }
    else return null;
    var bStr = _localDateStr(baseline);
    // 找 date <= bStr 的最後一筆
    var startVal = null;
    for (var i = hist.length - 1; i >= 0; i--) {
        if (hist[i].date <= bStr) { startVal = _valOf(hist[i]); break; }
    }
    if (startVal === null) return null; // 該期間之前沒有快照，無法比較
    var delta = latestVal - startVal;
    var pct = startVal !== 0 ? (delta / Math.abs(startVal) * 100) : null;
    return { delta: delta, pct: pct, startVal: startVal, latestVal: latestVal };
}

// 將變化渲染成「↗ +1.8%」的小標籤；isDebt=true 時，金額減少（資產角度好）顯示綠↘
function formatSectionChange(change, isDebt) {
    if (!change) return '<span style="color:var(--muted);font-size:11px">—</span>';
    var delta = change.delta;
    if (delta === 0) return '<span style="color:var(--muted);font-size:11px"><span class="chg-arrow">→</span><span class="chg-text"> 持平</span></span>';
    // 資產：上漲=好=綠；負債：上漲=壞=紅
    var isPositive = isDebt ? delta < 0 : delta > 0;
    var color = isPositive ? '#059669' : '#DC2626';
    var arrow = delta > 0 ? '↗' : '↘';
    var pctStr = change.pct !== null ? (change.pct > 0 ? '+' : '') + change.pct.toFixed(1) + '%' : (delta > 0 ? '+' : '') + fmt(delta);
    return '<span style="color:' + color + ';font-size:11px;font-weight:600">' + arrow + ' ' + pctStr + '</span>';
}

// 淨資產 / section 日曆：每格顯示當日 vs 前日的變化
function _buildSectionCalendarHtml(key) {
    var sec = ASSET_SECTIONS.find(function(s){ return s.key === key; });
    var isDebt = key === 'debt';
    var hist = (DATA.assets.history || []).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    if (hist.length === 0) {
        return '<div style="padding:30px;text-align:center;color:var(--muted);font-size:13px">尚無快照紀錄</div>';
    }
    // 計算每日變化
    var valueByDate = {};
    hist.forEach(function(h){
        if (key === 'netWorth') {
            valueByDate[h.date] = h.netWorth || 0;
        } else {
            valueByDate[h.date] = (h.breakdown && typeof h.breakdown[key] === 'number') ? h.breakdown[key] : 0;
        }
    });
    var dailyChange = {}; // { date: { value, delta, pct } }
    var monthSet = {};
    for (var i = 0; i < hist.length; i++) {
        var d = hist[i].date;
        var v = valueByDate[d];
        var delta = 0, pct = 0;
        if (i > 0) {
            var prevV = valueByDate[hist[i-1].date];
            delta = v - prevV;
            pct = (prevV !== 0) ? (delta / Math.abs(prevV) * 100) : 0;
        }
        dailyChange[d] = { value: v, delta: delta, pct: pct };
        if (d) monthSet[d.slice(0,7)] = true;
    }
    var months = Object.keys(monthSet).sort().reverse();
    var curMonth = (_sectionCalendarMonth[key] && monthSet[_sectionCalendarMonth[key]]) ? _sectionCalendarMonth[key] : months[0];

    // 月合計：當月每一天的當日變化加總（含當月第一天 vs 上月最後一筆快照的變化）。
    // dailyChange[d].delta 已是「該日 vs 前一筆快照」，僅全期間最初一筆 delta=0（無前可比），加總不受影響。
    var monthDates = Object.keys(dailyChange).filter(function(d){ return d.slice(0,7) === curMonth; }).sort();
    var monthDelta = 0;
    monthDates.forEach(function(d){
        monthDelta += dailyChange[d].delta;
    });

    var monthOpts = months.map(function(m){
        return '<option value="' + m + '"' + (m === curMonth ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    var html = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
    // 月份左右切換（◀ 月份 ▸）；點中間月份仍可叫出選擇器直接挑月
    (function(){
        var mIdx = months.indexOf(curMonth);
        var olderM = (mIdx >= 0 && mIdx < months.length - 1) ? months[mIdx + 1] : null; // 上一月（較舊）
        var newerM = (mIdx > 0) ? months[mIdx - 1] : null;                              // 下一月（較新）
        var mBase = 'flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:14px;color:var(--text)';
        var mOn = mBase + ';cursor:pointer', mOff = mBase + ';opacity:0.3;cursor:not-allowed';
        html += '<div style="display:inline-flex;align-items:center;gap:5px">';
        html += olderM ? '<button onclick="onSectionCalendarMonthChange(\'' + key + '\',\'' + olderM + '\')" title="上一月" style="' + mOn + '"><i class="ti ti-chevron-left"></i></button>'
                       : '<button disabled style="' + mOff + '"><i class="ti ti-chevron-left"></i></button>';
        html += '<button onclick="openSectionCalendarMonthPicker(\'' + key + '\')" title="點選月份" style="padding:4px 12px;height:30px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px"><span>' + curMonth + '</span><i class="ti ti-chevron-down" style="font-size:12px;color:var(--muted)"></i></button>';
        html += newerM ? '<button onclick="onSectionCalendarMonthChange(\'' + key + '\',\'' + newerM + '\')" title="下一月" style="' + mOn + '"><i class="ti ti-chevron-right"></i></button>'
                       : '<button disabled style="' + mOff + '"><i class="ti ti-chevron-right"></i></button>';
        html += '</div>';
    })();
    // 對負債來說：增加 = 負面（綠/紅相反）
    var deltaColor = isDebt ? signColor(-monthDelta) : signColor(monthDelta);
    html += '<span style="margin-left:auto;font-size:13px;color:var(--muted)">月變化 <b style="color:' + deltaColor + ';font-size:16px">' + signedFmt(monthDelta) + '</b></span>';
    html += '</div>';

    // 日曆網格（一~日，七欄）
    var ym = curMonth.split('-');
    var year = parseInt(ym[0], 10), monthIdx = parseInt(ym[1], 10) - 1;
    var lastDay = new Date(year, monthIdx + 1, 0).getDate();
    var firstDow = new Date(year, monthIdx, 1).getDay(); // 0=日

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px">';
    ['日','一','二','三','四','五','六'].forEach(function(w){
        html += '<div style="text-align:center;color:var(--muted);font-size:10px;padding:2px 0">' + w + '</div>';
    });
    // 月初前的空格
    for (var k = 0; k < firstDow; k++) html += '<div class="cal-cell cal-cell--sm cal-cell-empty"></div>';
    // 判斷今天
    var twNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var todayStr = _localDateStr(twNow);
    for (var day = 1; day <= lastDay; day++) {
        var dStr = year + '-' + String(monthIdx + 1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        var isToday = (dStr === todayStr);
        var entry = dailyChange[dStr];
        if (entry && entry.delta !== 0) {
            var color = isDebt ? signColor(-entry.delta) : signColor(entry.delta);
            var bg = (isDebt ? -entry.delta : entry.delta) > 0 ? 'rgba(239,68,68,0.08)' : (isDebt ? -entry.delta : entry.delta) < 0 ? 'rgba(22,163,74,0.08)' : 'transparent';
            var todayBorder = isToday ? 'border:1.5px solid var(--lux-gold);' : '';
            html += '<div class="cal-cell cal-cell--sm" style="' + todayBorder + 'background:' + bg + '" title="' + dStr + '：金額 ' + fmt(entry.value) + '">' +
                '<div class="cal-cell-day">' + day + (isToday ? ' <span class="cal-cell-today-label">今</span>' : '') + '</div>' +
                '<div class="cal-cell-main" style="color:' + color + '">' + signedFmt(entry.delta) + '</div>' +
                '</div>';
        } else if (entry) {
            // 有資料但無變化
            var todayBorder2 = isToday ? 'border:1.5px solid var(--lux-gold);' : '';
            html += '<div class="cal-cell cal-cell--sm" style="' + todayBorder2 + '" title="' + dStr + '：金額 ' + fmt(entry.value) + '">' +
                '<div class="cal-cell-day">' + day + (isToday ? ' <span class="cal-cell-today-label">今</span>' : '') + '</div>' +
                '<div class="cal-cell-main" style="color:var(--muted)">—</div>' +
                '</div>';
        } else {
            var todayBorder3 = isToday ? 'border:1.5px solid var(--lux-gold);background:rgba(212,175,55,0.05);' : 'border:1px dashed var(--border);';
            var todayLbl = isToday ? ' <span class="cal-cell-today-label">今</span>' : '';
            html += '<div class="cal-cell cal-cell--sm" style="' + todayBorder3 + 'color:var(--muted)">' + day + todayLbl + '</div>';
        }
    }
    html += '</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6">※ 每格數字為「該日 vs 前一筆快照」的淨變化。' + (isDebt ? '負債增加顯示紅色、減少顯示綠色。' : '') + '滑鼠移過去可看當日金額。</div>';
    return html;
}

function _drawSectionTrendChart(key) {
    var hist = (DATA.assets.history || []).slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var months = _sectionTrendState[key] || 6;
    // 按鈕 active：相容右側常駐面板與舊 modal
    var scope = document.getElementById('pinned-history-panel') || document.querySelector('.section-trend-overlay');
    if (scope) {
        scope.querySelectorAll('.nw-range-btn').forEach(function(b){
            var m = b.textContent.trim().match(/\d+/);
            var val = m ? parseInt(m[0]) : 0;
            b.classList.toggle('active', val === months);
        });
    }
    var canvas = document.getElementById('section-trend-chart');
    if (!canvas) return;
    if (_sectionTrendChart) { try { _sectionTrendChart.destroy(); } catch(_){} }
    if (hist.length < 1) {
        var ctx0 = canvas.getContext('2d');
        ctx0.clearRect(0,0,canvas.width,canvas.height);
        ctx0.fillStyle = '#8C8578';
        ctx0.font = '13px sans-serif';
        ctx0.textAlign = 'center';
        ctx0.fillText('此範圍內無資料', canvas.width/2, 40);
        return;
    }

    // 與主頁淨資產趨勢同套規則：依範圍決定聚合粒度
    // 近 6 月 → 日；近 12 月 → 週；近 24 月／全部 → 月
    var granularity = 'month';
    if (months === 6) granularity = 'day';
    else if (months === 12) granularity = 'week';

    // 取值 helper（netWorth 與 section key 不同欄位）
    function _valOf(h) {
        if (key === 'netWorth') return h.netWorth || 0;
        return (h.breakdown && h.breakdown[key]) || 0;
    }
    // ISO 週鍵 = 該週週一的日期
    function _weekKey(dateStr) {
        var d = new Date(dateStr);
        var day = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - day);
        return _localDateStr(d);
    }
    // 聚合：同一桶取最後一筆
    var bucket = {};
    hist.forEach(function(h){
        var k;
        if (granularity === 'day') k = h.date;
        else if (granularity === 'week') k = _weekKey(h.date);
        else k = h.date.slice(0,7);
        bucket[k] = h;
    });
    var keys = Object.keys(bucket).sort();

    // 範圍過濾
    if (months > 0) {
        var cutoff = new Date();
        cutoff.setMonth(cutoff.getMonth() - months);
        var cutoffStr = _localDateStr(cutoff);
        keys = keys.filter(function(k){
            var ref = (granularity === 'month') ? k + '-01' : k;
            return ref >= cutoffStr;
        });
    }
    if (keys.length < 1) {
        var ctx1 = canvas.getContext('2d');
        ctx1.clearRect(0,0,canvas.width,canvas.height);
        ctx1.fillStyle = '#8C8578';
        ctx1.font = '13px sans-serif';
        ctx1.textAlign = 'center';
        ctx1.fillText('此範圍內無資料', canvas.width/2, 40);
        return;
    }
    var labels = keys.map(function(k){
        // 月聚合的 key 是 YYYY-MM，補上 -01 給 _toROCDate；其他直接傳
        return _toROCDate(granularity === 'month' ? (k + '-01') : k);
    });
    var values = keys.map(function(k){ return _valOf(bucket[k]); });
    var isDebt = key === 'debt';
    var color = isDebt ? '#DC2626' : '#059669';
    // Y 軸用「萬」當單位簡化顯示
    function _fmtAxisY(v) {
        if (v === 0) return '0';
        var absV = Math.abs(v);
        if (absV >= 100000000) return (v / 100000000).toFixed(1) + ' 億';
        if (absV >= 10000) {
            var w = v / 10000;
            return (Math.abs(w) >= 100 ? Math.round(w) : w.toFixed(1)) + ' 萬';
        }
        return fmt(v);
    }
    _sectionTrendChart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{ data: values, borderColor: color, backgroundColor: color + '1A', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: color, borderWidth: 2 }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: function(ctx){ return fmt(ctx.parsed.y); } } } // tooltip 仍顯示完整金額
            },
            scales: {
                x: {
                    ticks: {
                        maxTicksLimit: 7,
                        autoSkip: true,
                        maxRotation: 30,
                        minRotation: 0
                    }
                },
                y: { ticks: { callback: function(v){ return _fmtAxisY(v); } } }
            }
        }
    });
}

// 一鍵更新匯率、金價，並把所有黃金帳戶的單價同步到最新國際金價
function manualRefreshMarket() {
    toast('更新中...');
    var fxDone = false, goldDone = false, fxOk = false, goldOk = false;
    function finish() {
        if (!fxDone || !goldDone) return;
        // 更新黃金帳戶
        var price = (DATA.assets.goldRef && DATA.assets.goldRef.twdPerTael) || 0;
        var updatedGold = 0;
        if (price) {
            ['liquid','invest','fixed','receivable','debt'].forEach(function(k){
                (DATA.assets[k] || []).forEach(function(a){
                    if (a.isGold && a.goldTael) {
                        a.goldUnitPrice = price;
                        a.amount = Math.round(a.goldTael * price);
                        a.updatedAt = _todayStr();
                        updatedGold++;
                    }
                });
            });
        }
        saveData();
        maybeAutoSnapshot();
        renderAssets();
        // 提示訊息：依成功狀況組合
        var parts = [];
        if (fxOk) parts.push('匯率已更新');
        if (goldOk) parts.push('金價 ' + fmt(price) + '/兩');
        if (updatedGold > 0) parts.push('同步 ' + updatedGold + ' 筆黃金');
        if (parts.length === 0) toast('更新失敗，請稍後再試', true);
        else toast(parts.join('·'));
    }
    fetchFxRates(function(ok){ fxDone = true; fxOk = ok; finish(); });
    fetchGoldPrice(function(ok){ goldDone = true; goldOk = ok; finish(); });
}

    html += '<div class="fld"><label>換算總價</label><input id="am-gold-total" type="text" value="" readonly style="background:#FAFAF9;color:var(--lux-navy);font-weight:800"></div>';
    if (goldRef) html += '<div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:12px">參考國際金價：' + fmt(goldRef) + ' /兩</div>';
    html += '</div>';
    html += '<div class="fld"><label>備註（選填）</label><input id="am-memo" type="text" value="' + esc(acc.memo || '') + '"></div>';
    html += '<div class="btns">';
    if (onDel) html += '<button class="btn-del" id="am-del">刪除</button>';
    html += '<button class="btn-cancel" id="am-cancel">取消</button>';
    html += '<button class="btn-ok" id="am-ok">儲存</button>';
    html += '</div>';
    html += '</div>';
    overlay.innerHTML = html;
    overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
    overlay.addEventListener('keydown', function(e){
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('am-ok').click();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            overlay.remove();
        }
    });
    document.body.appendChild(overlay);
    var curSel = document.getElementById('am-cur');
    curSel.value = acc.currency || 'TWD';
    var rateRow = document.getElementById('am-rate-row');
    var goldCheck = document.getElementById('am-gold');
    var normalFields = document.getElementById('am-normal-fields');
    var goldFields = document.getElementById('am-gold-fields');
    var goldTaelIn = document.getElementById('am-gold-tael');
    var goldPriceIn = document.getElementById('am-gold-price');
    var goldTotalIn = document.getElementById('am-gold-total');
    function updateRateRow() {
        if (curSel.value === 'TWD') rateRow.style.display = 'none';
        else {
            rateRow.style.display = '';
            var rIn = document.getElementById('am-rate');
            if (!rIn.value) rIn.value = getFxRate(curSel.value);
        }
    }
    function updateGoldTotal() {
        var t = Number(goldTaelIn.value) || 0;
        var p = Number(goldPriceIn.value) || 0;
        goldTotalIn.value = Math.round(t * p).toLocaleString();
    }
    function updateGoldMode() {
        if (goldCheck.checked) {
            normalFields.style.display = 'none';
            goldFields.style.display = '';
            updateGoldTotal();
        } else {
            normalFields.style.display = '';
            goldFields.style.display = 'none';
        }
    }
    curSel.addEventListener('change', updateRateRow);
    goldCheck.addEventListener('change', updateGoldMode);
    goldTaelIn.addEventListener('input', updateGoldTotal);
    goldPriceIn.addEventListener('input', updateGoldTotal);
    updateRateRow();
    updateGoldMode();
    document.getElementById('am-cancel').onclick = function(){ overlay.remove(); };
    document.getElementById('am-ok').onclick = function(){
        var name = document.getElementById('am-name').value.trim();
        var memo = document.getElementById('am-memo').value.trim();
        var isGold = goldCheck.checked;
        if (!name) { toast('請輸入名稱', true); return; }
        var result;
        if (isGold) {
            var tael = Number(goldTaelIn.value);
            var unitPrice = Number(goldPriceIn.value);
            if (isNaN(tael) || tael <= 0) { toast('請輸入台兩數', true); return; }
            if (isNaN(unitPrice) || unitPrice <= 0) { toast('請輸入單價', true); return; }
            result = {
                id: acc.id || _assetUid(),
                name: name,
                amount: Math.round(tael * unitPrice),
                currency: 'TWD',
                rate: 1,
                memo: memo,
                isGold: true,
                goldTael: tael,
                goldUnitPrice: unitPrice,
                updatedAt: _todayStr()
            };
        } else {
            var amt = Number(document.getElementById('am-amt').value);
            var cur = curSel.value;
            var rate = Number(document.getElementById('am-rate').value);
            if (isNaN(amt)) { toast('請輸入數字金額', true); return; }
            result = {
                id: acc.id || _assetUid(),
                name: name,
                amount: amt,
                currency: cur,
                rate: cur === 'TWD' ? 1 : (rate > 0 ? rate : getFxRate(cur)),
                memo: memo,
                isGold: false,
                updatedAt: _todayStr()
            };
        }
        onOk(result);
        overlay.remove();
    };
    if (onDel) {
        document.getElementById('am-del').onclick = function(){
            var curName = document.getElementById('am-name').value.trim() || acc.name || '此項目';
            confirmAction('確定刪除「' + esc(curName) + '」？', function(){
                onDel();
                overlay.remove();
            }, { danger: true });
        };
    }
    // 編輯既有項目（已有 id）時直接 focus 金額欄並全選，方便修改數字；
    // 新增時還是 focus 名稱欄
    setTimeout(function(){
        var isEditing = !!acc.id;
        var target;
        if (isEditing) {
            target = acc.isGold ? document.getElementById('am-gold-tael') : document.getElementById('am-amt');
        } else {
            target = document.getElementById('am-name');
        }
        if (!target) target = document.getElementById('am-name');
        target.focus();
        if (isEditing && target.select) target.select();
    }, 50);
}

function addAssetAccount(sectionKey) {
    var sec = ASSET_SECTIONS.find(function(s){ return s.key === sectionKey; });
    _assetModal('新增' + sec.label + '項目', { currency: 'TWD' }, function(acc){
        DATA.assets[sectionKey].push(acc);
        saveData();
        maybeAutoSnapshot();
        renderAssets();
    });
}

function moveAssetAccount(sectionKey, id, delta) {
    var list = DATA.assets[sectionKey] || [];
    var idx = -1;
    for (var i=0;i<list.length;i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var newIdx = idx + delta;
    if (newIdx < 0 || newIdx >= list.length) return;
    var tmp = list[idx];
    list[idx] = list[newIdx];
    list[newIdx] = tmp;
    saveData();
    renderAssets();
}

function editAssetAccount(sectionKey, id) {
    var list = DATA.assets[sectionKey] || [];
    var idx = -1;
    for (var i=0;i<list.length;i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    var sec = ASSET_SECTIONS.find(function(s){ return s.key === sectionKey; });
    var cur = list[idx];
    var name = cur.name;
    _assetModal('編輯' + sec.label + '項目', cur, function(acc){
        DATA.assets[sectionKey][idx] = acc;
        saveData();
        maybeAutoSnapshot();
        renderAssets();
    }, function(){
        DATA.assets[sectionKey].splice(idx, 1);
        saveData();
        maybeAutoSnapshot();
        renderAssets();
        toast('已刪除「' + name + '」');
    });
}

// ── 初始化 ──
loadData();
loadStockData();
_loadMarketInfoLS();   // 先載入上次的大盤指數/成交金額，開頁立即顯示，背景再更新
updateLastExportLabel();
// 開啟網頁立即更新一次股價；之後盤中每 5 分鐘自動刷新（不論目前在哪個頁籤）
try { startStockAutoRefresh(); } catch(_) {}
// 每日 14:00（台灣時間）自動跑一次快照，確保長時間掛機也能累積每日資料
try { scheduleDailySnapshot(); } catch(_) {}
// 一次性：放款→借款
(function(){
    var changed = false;
    DATA.settings.passiveSources.forEach(function(s,i){
        var n = typeof s === 'string' ? s : s.name;
        if (n === '放款') {
            if (typeof s === 'string') DATA.settings.passiveSources[i] = '借款';
            else s.name = '借款';
            changed = true;
        }
    });
    if (changed) {
        DATA.settings.years.forEach(function(y){
            if (DATA.passive[y] && DATA.passive[y]['放款']) {
                DATA.passive[y]['借款'] = DATA.passive[y]['放款'];
                delete DATA.passive[y]['放款'];
            }
        });
        saveData();
    }
})();
// 初始頁籤（收入/支出）載入上次的排序偏好（持久化）
if (currentTab === 'income' || currentTab === 'expense') _loadSortStateFor(currentTab);
render();
// 預設開台股頁時，初始 render() 不經 switchTab('stock')，需另行觸發除權息抓取
if (currentTab === 'stock' && (!_dividendAlertChecked || _dividendNeedsRefresh)) {
    try { checkDividendAlerts(); } catch(e) { console.error('[init checkDividendAlerts]', e); }
}
// 啟動時：自動快照 + 背景抓匯率/金價（不擋畫面）
try { maybeAutoSnapshot(); } catch(e) { console.error('[maybeAutoSnapshot init]', e); }
setTimeout(function(){
    try { maybeAutoFetchFx(); } catch(e) { console.error('[maybeAutoFetchFx init]', e); }
    try { maybeAutoFetchGold(); } catch(e) { console.error('[maybeAutoFetchGold init]', e); }
}, 500);
// 定期收入循環：畫面先出來，再跳補記 modal（等 DOM 準備好）
_whenReady(function(){
    try { runRecurringAutoPost(); } catch(e) { console.error('[runRecurringAutoPost]', e); }
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
</script>
