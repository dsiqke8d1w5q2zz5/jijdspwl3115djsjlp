// 在 走勢分頁 HTML 注入後初始化 Chart + Flatpickr + 區間查詢
function _initStockTrendChart(stockId) {
    var arr = (stockData.priceHistory && stockData.priceHistory[stockId]) || [];
    if (arr.length < 2) return;
    var rng = _trendDefaultRange(arr);
    var first = rng.first, last = rng.last;
    var defaultStartDate = rng.start;
    var defaultSubset = arr.filter(function(e){ return e.date >= defaultStartDate; });

    var canvas = document.getElementById('stock-price-trend-chart');
    function _draw(subset) {
        if (!canvas) return;
        if (_stockPriceTrendChart) { try { _stockPriceTrendChart.destroy(); } catch(_){} }
        _stockPriceTrendChart = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
                labels: subset.map(function(e){ return e.date; }),
                datasets: [{ data: subset.map(function(e){ return e.price; }), borderColor: '#0284C7', backgroundColor: 'rgba(2,132,199,0.1)', fill: true, tension: 0.3, pointRadius: 2, borderWidth: 2 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(ctx){ return '價格 ' + ctx.parsed.y; } } } },
                scales: {
                    x: {
                        ticks: { maxTicksLimit: 10, autoSkip: true, maxRotation: 30, minRotation: 0 }
                    }
                }
            }
        });
    }
    _draw(defaultSubset);

    // 自訂區間查詢
    var startInput = document.getElementById('trend-range-start');
    var endInput = document.getElementById('trend-range-end');
    var resultEl = document.getElementById('trend-range-result');

    // 套上 Flatpickr 日曆（若未載入則 fallback 為純文字輸入）
    var fpStart, fpEnd;
    if (typeof flatpickr === 'function') {
        var fpLocale = (flatpickr.l10ns && flatpickr.l10ns.zh_tw) ? flatpickr.l10ns.zh_tw : undefined;
        fpStart = flatpickr(startInput, {
            dateFormat: 'Y-m-d', locale: fpLocale,
            minDate: arr[0].date, maxDate: arr[arr.length-1].date,
            defaultDate: defaultStartDate,
            onChange: function(sel, str){ fpEnd && fpEnd.set('minDate', str); }
        });
        fpEnd = flatpickr(endInput, {
            dateFormat: 'Y-m-d', locale: fpLocale,
            minDate: arr[0].date, maxDate: arr[arr.length-1].date,
            defaultDate: last.date,
            onChange: function(sel, str){ fpStart && fpStart.set('maxDate', str); }
        });
    }

    function _applyRange() {
        var s = (startInput.value || '').trim();
        var e = (endInput.value || '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || !/^\d{4}-\d{2}-\d{2}$/.test(e)) {
            resultEl.innerHTML = '<span style="color:var(--red)">日期格式錯誤</span>';
            return;
        }
        if (s > e) {
            resultEl.innerHTML = '<span style="color:var(--red)">起始日不可大於結束日</span>';
            return;
        }
        var subset = arr.filter(function(it){ return it.date >= s && it.date <= e; });
        if (subset.length < 2) {
            resultEl.innerHTML = '<span style="color:var(--muted)">此區間紀錄不足</span>';
            _draw(arr);
            return;
        }
        var startEntry = subset[0], endEntry = subset[subset.length - 1];
        var adj = adjustForCorporateActions(stockId, startEntry.price, startEntry.date, endEntry.date);
        var adjustedStart = adj.adjustedPrice;
        var pct = adjustedStart > 0 ? (endEntry.price - adjustedStart) / adjustedStart * 100 : 0;
        resultEl.innerHTML = '<span style="font-size:16px">區間漲跌 <b>' + fmtPriceChange({pct: pct}) + '</b></span>' +
            ' <span style="font-size:12px;color:var(--muted)">（' + startEntry.date + ' ~ ' + endEntry.date + '，' + subset.length + ' 筆）</span>';
        _draw(subset);
    }
    // 點 KPI 卡片（近 7/30/90/365 日）→ 自動套用對應區間
    function _setRangeAndApply(startDate, endDate) {
        if (fpStart) fpStart.setDate(startDate, false); else startInput.value = startDate;
        if (fpEnd) fpEnd.setDate(endDate, false); else endInput.value = endDate;
        if (fpStart) fpStart.set('maxDate', endDate);
        if (fpEnd) fpEnd.set('minDate', startDate);
        _applyRange();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.trend-kpi'), function(card) {
        card.onclick = function() {
            var days = parseInt(card.getAttribute('data-days'), 10);
            if (!days) return;
            var lastDate = arr[arr.length - 1].date;
            var lp = lastDate.split('-');
            var d = new Date(+lp[0], +lp[1] - 1, +lp[2]);
            d.setDate(d.getDate() - days);
            var startDate = _localDateStr(d);
            if (startDate < arr[0].date) startDate = arr[0].date;
            _setRangeAndApply(startDate, lastDate);
        };
    });

    var applyBtn = document.getElementById('trend-range-apply');
    var resetBtn = document.getElementById('trend-range-reset');
    if (applyBtn) applyBtn.onclick = _applyRange;
    if (resetBtn) resetBtn.onclick = function() {
        if (fpStart) fpStart.setDate(arr[0].date, false);
        else startInput.value = arr[0].date;
        if (fpEnd) fpEnd.setDate(arr[arr.length - 1].date, false);
        else endInput.value = arr[arr.length - 1].date;
        if (fpStart) fpStart.set('maxDate', arr[arr.length-1].date);
        if (fpEnd) fpEnd.set('minDate', arr[0].date);
        resultEl.innerHTML = '';
        _draw(arr);
    };
}

// 手動「重新整理」：強制重抓當前這檔的基本面／籌碼面／ETF 資訊（繞過 TTL 節流）
function refreshStockModalData(stockId) {
    // 把三類快取的 fetchedAt 清掉 → 下次 fetch 視為過期、會重抓
    if (_fundamentalsCache[stockId]) _fundamentalsCache[stockId].fetchedAt = 0;
    if (_chipsCache[stockId]) _chipsCache[stockId].fetchedAt = 0;
    if (_etfInfoCache[stockId]) _etfInfoCache[stockId].fetchedAt = 0;
    // 按鈕轉圈回饋
    var btn = document.getElementById('stock-modal-refresh');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> 重抓中…'; }
    // 重繪當前分頁（_build* 會觸發 fetch，因 fetchedAt=0 → 重抓最新）
    _renderStockCalModalBody();
    // 順手也抓一次最新股價
    if (typeof refreshPrices === 'function') { try { refreshPrices(); } catch(e){} }
    // 1.2 秒後復原按鈕（重抓是非同步，畫面會在抓完各自更新）
    setTimeout(function(){
        var b = document.getElementById('stock-modal-refresh');
        if (b) { b.disabled = false; b.innerHTML = '<i class="ti ti-refresh"></i> 重新整理'; }
    }, 1200);
    toast('已重新抓取最新資料');
}

function _renderStockCalModalBody() {
    var box = document.getElementById('stock-cal-modal-body');
    if (!box) return;
    var tab = _stockCalModalState.tab;
    if (tab === 'trades') {
        box.innerHTML = _buildStockTradesHtml(_stockCalModalState.stockId);
    } else if (tab === 'fundamentals') {
        box.innerHTML = _buildFundamentalsHtml(_stockCalModalState.stockId);
    } else if (tab === 'chips') {
        box.innerHTML = _buildChipsHtml(_stockCalModalState.stockId);
    } else if (tab === 'dividends') {
        var divId = _stockCalModalState.stockId;
        box.innerHTML = _buildStockDividendsHtml(divId);
        // ETF：配息頻率優先用 etfinfo 的官方值。若 etfinfo 還沒抓、或舊快取沒有 dividendFreq，背景抓一次後重畫。
        var _ec = _etfInfoCache[divId];
        var _needFetch = !(_ec && _ec.data) || !(_ec.data.dividendFreq);
        if (/^00/.test(String(divId)) && _needFetch) {
            // 舊快取沒 freq 欄位 → 清 fetchedAt 繞過 6h TTL 強制重抓
            if (_ec && _ec.data && !_ec.data.dividendFreq) _ec.fetchedAt = 0;
            fetchEtfInfo(divId, function(){
                if (_stockCalModalState.tab === 'dividends' && _stockCalModalState.stockId === divId) {
                    var b = document.getElementById('stock-cal-modal-body');
                    if (b) b.innerHTML = _buildStockDividendsHtml(divId);
                }
            });
        }
    } else if (tab === 'trend') {
        box.innerHTML = _buildStockTrendHtml(_stockCalModalState.stockId);
        // 走勢分頁需要在 HTML 注入後才能畫圖
        _initStockTrendChart(_stockCalModalState.stockId);
    } else {
        box.innerHTML = _buildStockCalendarHtml(_stockCalModalState.stockId, _stockCalModalState.month);
    }
}

// ── ETF 輕量基本面：價格／費用淨值／產業／持股（配息表現已移到「歷史配息」分頁）──
function _buildEtfFundamentalsHtml(stockId) {
    var now = new Date();
    var oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
    var price = _currentPriceFor(stockId);

    // 近 12 月價格區間 / 波動（用 priceHistory）— 卡片內容（與費用淨值併排）
    var ph = (stockData.priceHistory || {})[stockId] || [];
    var oneYearStr = _localDateStr(oneYearAgo);
    var yp = ph.filter(function(e){ return e && e.date >= oneYearStr && typeof e.price === 'number'; });
    var priceInner = '';
    if (yp.length >= 2) {
        var hi = Math.max.apply(null, yp.map(function(e){ return e.price; }));
        var lo = Math.min.apply(null, yp.map(function(e){ return e.price; }));
        var amp = lo > 0 ? (hi - lo) / lo * 100 : 0;
        priceInner = '<div style="font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:6px">近一年價格</div>' +
            '<div style="display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px">' +
            '<span>最高 <b>' + hi.toFixed(2) + '</b></span>' +
            '<span>最低 <b>' + lo.toFixed(2) + '</b></span>' +
            '<span>振幅 <b>' + amp.toFixed(1) + '%</b></span>' +
            (price ? '<span>現價 <b style="color:var(--lux-navy)">' + price.toFixed(2) + '</b></span>' : '') +
            '</div>';
    }

    var cardBase = 'border:1px solid var(--border);border-radius:10px;padding:10px 14px';
    var html = '';

    // 近一年價格 + 費用與淨值：同一排（flex 兩欄）
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">';
    if (priceInner) {
        html += '<div style="' + cardBase + ';flex:1 1 260px">' + priceInner + '</div>';
    }
    // 費用與淨值由後端資料填（先放容器，有快取直接帶內容，無則留白不跳 loading）
    var ec = _etfInfoCache[stockId];
    var feeInner = (ec && ec.data) ? _etfFeeNavHtml(ec.data) : '';
    html += '<div class="etf-fee-box" data-etf="' + esc(stockId) + '" style="' + cardBase + ';flex:1 1 260px">' + (feeInner || _etfFeeNavPlaceholder()) + '</div>';
    html += '</div>';

    // 產業分佈 / 持股明細 / 成分股異動（後端資料；有快取立即顯示，無則留空容器，不跳 loading）
    var etfInfoInner = (ec && ec.data) ? _etfInfoHtml(ec.data) : '';
    html += '<div class="etf-info-box" data-etf="' + esc(stockId) + '">' + etfInfoInner + '</div>';

    // 不論有無快取，背景都抓一次最新；有實質變動才重繪
    setTimeout(function(){
        fetchEtfInfo(stockId, function(data, changed){
            var hadShown = !!(ec && ec.data);
            if (!hadShown || changed) _paintEtfInfo(stockId); // 首次填入 or 有變動才重畫
        });
    }, 0);

    html += '<div style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px">※ 產業／持股／淨值折溢價／費率來源：MoneyDJ；配息表現移至「歷史配息」分頁。</div>';

    return html;
}

// ETF 後端資料快取 + 抓取（產業/持股/淨值/費率）
// localStorage 持久化：打開分頁立刻顯示上次資料（不跳 loading），背景更新，有變動才重繪
var _etfInfoCache = {};
var _ETF_INFO_LS_KEY = 'etfInfoCache';
function _loadEtfInfoLS() {
    try {
        var raw = localStorage.getItem(_ETF_INFO_LS_KEY);
        if (!raw) return;
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
            Object.keys(o).forEach(function(id){ if (o[id] && o[id].data) _etfInfoCache[id] = { data: o[id].data, fetchedAt: o[id].fetchedAt || 0 }; });
        }
    } catch (e) {}
}
function _saveEtfInfoLS() {
    try {
        var slim = {};
        Object.keys(_etfInfoCache).forEach(function(id){
            if (_etfInfoCache[id] && _etfInfoCache[id].data) slim[id] = { data: _etfInfoCache[id].data, fetchedAt: _etfInfoCache[id].fetchedAt || 0 };
        });
        localStorage.setItem(_ETF_INFO_LS_KEY, JSON.stringify(slim));
    } catch (e) {}
}
_loadEtfInfoLS();

// ── 持股異動（diff）：保存上一版持股快照，比對出新增／移除／比例變動 ──
var _ETF_HOLD_PREV_KEY = 'etfHoldingsPrev';   // { id: [{id,name,pct}, ...] }
var _ETF_HOLD_DIFF_KEY = 'etfHoldingsDiff';   // { id: {added:[],removed:[],changed:[]} }
function _readLS(key) { try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : {}; } catch (e) { return {}; } }
function _writeLS(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
// 取某檔 ETF 已算好的異動結果（給畫面用）
function getEtfHoldingsDiff(stockId) { return _readLS(_ETF_HOLD_DIFF_KEY)[stockId] || null; }
// 比對 old/new 持股，回傳 {added, removed, changed}；同時更新基準與 diff 快取
function _computeEtfHoldingsDiff(stockId, newHoldings) {
    var prevAll = _readLS(_ETF_HOLD_PREV_KEY);
    var oldList = prevAll[stockId];
    var newList = (newHoldings || []).map(function(x){ return { id: x.id || x.code || x.name, name: x.name, code: x.code, pct: (x.pct != null ? x.pct : null), shares: (x.shares != null ? x.shares : null) }; });
    // 首次沒有基準：建立基準，不產生 diff（避免把全部當新增）
    if (!Array.isArray(oldList)) {
        prevAll[stockId] = newList; _writeLS(_ETF_HOLD_PREV_KEY, prevAll);
        return null;
    }
    var oldMap = {}, newMap = {};
    oldList.forEach(function(x){ oldMap[x.id] = x; });
    newList.forEach(function(x){ newMap[x.id] = x; });
    var added = newList.filter(function(x){ return !oldMap[x.id]; });
    var removed = oldList.filter(function(x){ return !newMap[x.id]; });
    var changed = [];
    newList.forEach(function(x){
        var o = oldMap[x.id];
        if (o && o.pct != null && x.pct != null && Math.abs(o.pct - x.pct) >= 0.01) {
            changed.push({ id: x.id, name: x.name, code: x.code, from: o.pct, to: x.pct, sharesFrom: (o.shares != null ? o.shares : null), sharesTo: (x.shares != null ? x.shares : null) });
        }
    });
    var hasDiff = added.length || removed.length || changed.length;
    // 更新基準到最新；diff 快取保留到下次有變動才覆蓋（無變動時維持上次的明細顯示）
    prevAll[stockId] = newList; _writeLS(_ETF_HOLD_PREV_KEY, prevAll);
    if (hasDiff) {
        var diffAll = _readLS(_ETF_HOLD_DIFF_KEY);
        diffAll[stockId] = { added: added, removed: removed, changed: changed };
        _writeLS(_ETF_HOLD_DIFF_KEY, diffAll);
        return diffAll[stockId];
    }
    return getEtfHoldingsDiff(stockId);
}

// onDone(data, changed)：changed 表示與顯示中的舊資料相比有無實質變動
function fetchEtfInfo(stockId, onDone) {
    var c = _etfInfoCache[stockId];
    var hadData = !!(c && c.data);
    if (c && c.loading) return;
    // 快取仍新鮮（TTL 內）→ 跳過重抓（省後端流量；成分股一天內不會變）
    if (_isCacheFresh(c, _ETFINFO_TTL)) { if (onDone) onDone(c.data, false); return; }
    // 標記抓取中（但保留舊 data 供畫面繼續顯示）
    _etfInfoCache[stockId] = hadData ? { data: c.data, loading: true, fetchedAt: c.fetchedAt } : { loading: true };
    var oldJson = hadData ? JSON.stringify(c.data) : null;
    var url = CLOUD_URL + '?action=etfinfo&format=json&id=' + encodeURIComponent(stockId) + '&t=' + Date.now();
    fetchWithTimeout(url, {}, 20000)
        .then(function(r){ return r.json(); })
        .then(function(data){
            var changed = JSON.stringify(data) !== oldJson;
            // 持股異動 diff（在覆蓋快取前比對；首次建立基準不產生 diff）
            if (data && Array.isArray(data.holdings)) _computeEtfHoldingsDiff(stockId, data.holdings);
            _etfInfoCache[stockId] = { data: data, fetchedAt: Date.now() };
            _saveEtfInfoLS();
            if (onDone) onDone(data, changed);
        })
        .catch(function(){
            // 抓失敗：保留舊資料（若有），不洗掉畫面
            _etfInfoCache[stockId] = hadData ? { data: c.data } : { data: null, failed: true };
            if (onDone) onDone(_etfInfoCache[stockId].data, false);
        });
}

function _paintEtfInfo(stockId) {
    var sel = (window.CSS && CSS.escape) ? CSS.escape(stockId) : stockId;
    var c = _etfInfoCache[stockId];
    var hasData = !!(c && c.data);
    // 費用與淨值（併排卡）
    var feeBoxes = document.querySelectorAll('.etf-fee-box[data-etf="' + sel + '"]');
    var feeInner = hasData ? _etfFeeNavHtml(c.data) : '';
    Array.prototype.forEach.call(feeBoxes, function(b){ b.innerHTML = feeInner || _etfFeeNavPlaceholder(); });
    // 產業/持股/異動
    var boxes = document.querySelectorAll('.etf-info-box[data-etf="' + sel + '"]');
    var inner = hasData ? _etfInfoHtml(c.data) :
        '<div style="font-size:12px;color:var(--muted);padding:8px 0">持股資料載入失敗（後端未更新或查無資料）。</div>';
    Array.prototype.forEach.call(boxes, function(b){ b.innerHTML = inner; });
}

// 費用與淨值卡片內容（從 etf-fee-box 併排用）
function _etfFeeNavHtml(d) {
    var hasFee = d.fee && (d.fee.total != null || d.fee.manage != null || d.fee.custody != null);
    var hasNav = d.nav && d.nav.nav != null;
    if (!hasFee && !hasNav) return _etfFeeNavPlaceholder();
    var html = '<div style="font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:6px">費用與淨值</div>';
    html += '<div style="display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13px">';
    if (d.fee && d.fee.total != null) html += '<span>內扣總費用 <b style="color:var(--lux-navy)">' + d.fee.total + '%</b></span>';
    if (d.fee && d.fee.manage != null) html += '<span>經理費 <b>' + d.fee.manage + '%</b></span>';
    if (d.fee && d.fee.custody != null) html += '<span>保管費 <b>' + d.fee.custody + '%</b></span>';
    if (hasNav) {
        var pm = d.nav.premium;
        var pmColor = pm > 0 ? signColor(1) : pm < 0 ? signColor(-1) : 'var(--text)';
        var pmLabel = pm > 0 ? '溢價' : pm < 0 ? '折價' : '';
        html += '<span>淨值 <b>' + d.nav.nav + '</b></span>';
        html += '<span>折溢價 <b style="color:' + pmColor + '">' + (pm > 0 ? '+' : '') + pm + '%</b>' + (pmLabel ? ' <span style="font-size:11px;color:var(--muted)">' + pmLabel + '</span>' : '') + '</span>';
    }
    html += '</div>';
    return html;
}
function _etfFeeNavPlaceholder() {
    return '<div style="font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:10px">費用與淨值</div>' +
        '<div style="font-size:13px;color:var(--muted)">—</div>';
}

// 成分股持有股數 → 「N 張」字串（1 張=1000 股）；無資料回 ''
function _etfLotsLabel(shares) {
    if (shares == null || isNaN(shares) || shares <= 0) return '';
    var lots = shares / 1000;
    // 1 張以上取整數張顯示；不足 1 張（零股）顯示到小數 1 位
    var txt = lots >= 1 ? Math.round(lots).toLocaleString('en-US') : lots.toFixed(1);
    return txt + ' 張';
}

function _etfInfoHtml(d) {
    if (!d) return '<div style="font-size:12px;color:var(--muted);padding:8px 0">查無此 ETF 的持股資料。</div>';
    var html = '';
    var cardOpen = '<div style="border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px">';
    var titleStyle = 'font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:10px';

    // 成分股變動橫幅（與前一日比對：新增綠、移除紅）
    if (d.changes && ((d.changes.added && d.changes.added.length) || (d.changes.removed && d.changes.removed.length))) {
        var ch = d.changes;
        var nameOf = function(x){ return (x.name ? esc(x.name) + ' ' : '') + '<span style="color:var(--muted);font-size:11px">' + esc(x.code) + '</span>'; };
        html += '<div style="border:1px solid #F0C36D;background:#FCF6E8;border-radius:10px;padding:12px 14px;margin-bottom:12px">';
        html += '<div style="font-size:12px;font-weight:700;color:#B45309;margin-bottom:8px"><i class="ti ti-bell"></i> 成分股異動（' + esc(ch.prevDate || '') + ' → ' + esc(ch.currDate || '') + '）</div>';
        if (ch.added && ch.added.length) {
            html += '<div style="font-size:13px;margin-bottom:4px"><span style="color:' + signColor(1) + ';font-weight:700">＋ 新增</span>　' +
                ch.added.map(nameOf).join('、') + '</div>';
        }
        if (ch.removed && ch.removed.length) {
            html += '<div style="font-size:13px"><span style="color:' + signColor(-1) + ';font-weight:700">－ 移除</span>　' +
                ch.removed.map(nameOf).join('、') + '</div>';
        }
        html += '</div>';
    }

    // （費用與淨值已抽到 _etfFeeNavHtml，與「近一年價格」併排顯示）

    // 產業分佈（長條）— 直接顯示（不開合）
    if (Array.isArray(d.industries) && d.industries.length) {
        var maxPct = Math.max.apply(null, d.industries.map(function(x){ return x.pct; }));
        var topInd = d.industries[0];
        html += cardOpen;
        html += '<div style="display:flex;align-items:center;gap:6px;' + titleStyle + ';margin-bottom:0">產業分佈' +
            '<span style="font-weight:400;color:var(--muted);margin-left:auto">' + esc(topInd.name) + ' ' + topInd.pct.toFixed(1) + '%…</span></div>';
        var indShown = d.industries.slice(0, 8);
        html += '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(' + Math.ceil(indShown.length / 2) + ',auto);grid-auto-flow:column;gap:4px 20px;margin-top:10px">';
        indShown.forEach(function(x){
            var w = maxPct > 0 ? Math.max(3, x.pct / maxPct * 100) : 3;
            html += '<div style="display:flex;align-items:center;gap:6px;font-size:12px">' +
                '<span style="flex:0 0 72px;text-align:right;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(x.name) + '</span>' +
                '<div style="flex:1;background:#F1EDE8;border-radius:3px;height:12px;position:relative">' +
                    '<div style="width:' + w + '%;background:var(--lux-navy);height:100%;border-radius:3px"></div></div>' +
                '<span style="flex:0 0 46px;text-align:right;font-weight:600;color:var(--lux-navy)">' + x.pct.toFixed(1) + '%</span>' +
                '</div>';
        });
        html += '</div></div>';
    }

    // 前十大持股 — 直接顯示（不開合）
    if (Array.isArray(d.holdings) && d.holdings.length) {
        var top = d.holdings.slice(0, 10);
        var top10Sum = top.reduce(function(s,x){ return s + (x.pct || 0); }, 0);
        html += cardOpen;
        html += '<div style="display:flex;align-items:center;gap:6px;' + titleStyle + ';margin-bottom:0">前十大持股' +
            '<span style="font-weight:400;color:var(--muted);margin-left:auto">合計 ' + top10Sum.toFixed(1) + '%／共 ' + d.holdings.length + ' 檔</span></div>';
        html += '<div style="margin-top:10px">';
        html += '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(' + Math.ceil(top.length / 2) + ',auto);grid-auto-flow:column;gap:0 20px;font-size:13px">';
        top.forEach(function(x, i){
            var lots = _etfLotsLabel(x.shares);
            html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:1px solid var(--border)">' +
                '<span style="flex:0 0 18px;text-align:right;color:var(--muted);font-size:11px">' + (i+1) + '</span>' +
                '<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(x.name) + (x.code ? ' <span style="color:var(--muted);font-size:11px">' + esc(x.code) + '</span>' : '') + '</span>' +
                (lots ? '<span style="flex:0 0 auto;text-align:right;color:var(--muted);font-size:11px;margin-right:8px">' + lots + '</span>' : '') +
                '<span style="flex:0 0 auto;text-align:right;color:var(--lux-navy);font-weight:600">' + (x.pct != null ? x.pct.toFixed(2) + '%' : '—') + '</span></div>';
        });
        html += '</div>';
        // 成分股異動按鈕（常駐）+ 查看全部按鈕：同一排
        var diff = getEtfHoldingsDiff(d.id);
        var nAdd = diff ? diff.added.length : 0, nRem = diff ? diff.removed.length : 0, nChg = diff ? diff.changed.length : 0;
        var hasDiff = (nAdd + nRem + nChg) > 0;
        window._etfAllHoldings = window._etfAllHoldings || {};
        window._etfAllHoldings[d.id] = { name: (d.name || d.id), holdings: d.holdings };
        // 三欄：左佔位／中＝成分股異動(置中)／右＝查看全部(靠最右)
        html += '<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px">';
        // 成分股異動：常駐顯示，有異動列數量，無異動顯示「—」
        var diffParts;
        if (hasDiff) {
            var parts = [];
            if (nAdd) parts.push('<span style="color:' + signColor(1) + '">+' + nAdd + '</span>');
            if (nRem) parts.push('<span style="color:' + signColor(-1) + '">−' + nRem + '</span>');
            if (nChg) parts.push('<span style="color:var(--muted)">✎' + nChg + '</span>');
            diffParts = '<span style="color:var(--muted)">成分股異動</span>' + parts.join(' ');
        } else {
            diffParts = '<span style="color:var(--muted)">成分股異動</span><span style="color:var(--muted)">—</span>';
        }
        html += '<span></span>'; // 左佔位（讓異動鈕置中）
        html += '<span onclick="event.stopPropagation();showEtfHoldingsDiff(\'' + esc(d.id) + '\')" title="點看成分股異動明細" style="grid-column:2;justify-self:center;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card)">' + diffParts + '</span>';
        if (d.holdings.length > 10) {
            html += '<button type="button" onclick="event.stopPropagation();showEtfAllHoldings(\'' + esc(d.id) + '\')" style="grid-column:3;justify-self:end;padding:6px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-family:inherit;font-size:13px;color:var(--lux-navy);font-weight:600">查看全部 ' + d.holdings.length + ' 檔</button>';
        }
        html += '</div>';
        html += '</div></div>';
    }

    if (!html) return '<div style="font-size:12px;color:var(--muted);padding:8px 0">此 ETF 暫無持股／費率資料。</div>';
    return html;
}

// 查看全部持股（另開 modal）
function showEtfAllHoldings(etfId) {
    var rec = (window._etfAllHoldings || {})[etfId];
    if (!rec || !rec.holdings || !rec.holdings.length) { toast('尚無持股資料'); return; }
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.style.alignItems = 'flex-start';
    ov.style.paddingTop = '6vh';
    ov.style.overflowY = 'auto';
    var rows = '';
    rec.holdings.forEach(function(x, i){
        var lots = _etfLotsLabel(x.shares);
        rows += '<div style="display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--border);font-size:13px">' +
            '<span style="flex:0 0 28px;color:var(--muted);font-size:11px;text-align:right">' + (i+1) + '</span>' +
            '<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(x.name) + (x.code ? ' <span style="color:var(--muted);font-size:11px">' + esc(x.code) + '</span>' : '') + '</span>' +
            (lots ? '<span style="flex:0 0 auto;text-align:right;color:var(--muted);font-size:11px;margin-right:8px">' + lots + '</span>' : '') +
            '<span style="flex:0 0 auto;text-align:right;color:var(--lux-navy);font-weight:600">' + (x.pct != null ? x.pct.toFixed(2) + '%' : '—') + '</span></div>';
    });
    ov.innerHTML = '<div class="modal" style="width:560px;max-width:94vw;display:flex;flex-direction:column;max-height:84vh">' +
        '<h3 style="margin:0 0 12px;flex:none"><i class="ti ti-list-details"></i> ' + esc(etfId) + ' 全部持股（' + rec.holdings.length + ' 檔）</h3>' +
        '<div style="flex:1;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(' + Math.ceil(rec.holdings.length / 2) + ',auto);grid-auto-flow:column;gap:0 20px">' + rows + '</div>' +
        '<div class="modal-btns" style="margin-top:12px;flex:none"><button onclick="this.closest(\'.overlay\').remove()" style="flex:1">關閉</button></div>' +
        '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
}

// 成分股異動明細（另開 modal）：新增／移除／比例變動
function showEtfHoldingsDiff(etfId) {
    var diff = getEtfHoldingsDiff(etfId);
    function nameCell(x) {
        return esc(x.name || x.id) + (x.code ? ' <span style="color:var(--muted);font-size:11px">' + esc(x.code) + '</span>' : '');
    }
    function section(title, color, list, render) {
        if (!list || !list.length) return '';
        var s = '<div style="font-size:12px;font-weight:700;color:' + color + ';margin:14px 0 6px">' + title + '（' + list.length + '）</div>';
        list.forEach(function(x){
            s += '<div style="display:flex;align-items:center;gap:6px;padding:4px 4px;border-bottom:1px solid var(--border);font-size:13px">' + render(x) + '</div>';
        });
        return s;
    }
    var body = '';
    body += section('新增', signColor(1), diff && diff.added, function(x){
        var lots = _etfLotsLabel(x.shares);
        return '<span style="flex:1;min-width:0">' + nameCell(x) + '</span>' +
            (lots ? '<span style="flex:0 0 auto;color:var(--muted);font-size:11px;margin-right:8px">' + lots + '</span>' : '') +
            '<span style="flex:0 0 auto;color:' + signColor(1) + ';font-weight:600">' + (x.pct != null ? x.pct.toFixed(2) + '%' : '—') + '</span>';
    });
    body += section('移除', signColor(-1), diff && diff.removed, function(x){
        var lots = _etfLotsLabel(x.shares);
        return '<span style="flex:1;min-width:0;color:var(--muted);text-decoration:line-through">' + nameCell(x) + '</span>' +
            (lots ? '<span style="flex:0 0 auto;color:var(--muted);font-size:11px;margin-right:8px">' + lots + '</span>' : '') +
            '<span style="flex:0 0 auto;color:var(--muted)">' + (x.pct != null ? x.pct.toFixed(2) + '%' : '—') + '</span>';
    });
    // 只列「張數有實際變動」的（基金真的買賣）；純股價浮動造成的比例變化（張數沒動）不列。
    // 無 shares 資料者（舊基準）保留，避免漏掉。
    var changedReal = (diff && diff.changed || []).filter(function(x){
        if (x.sharesFrom == null || x.sharesTo == null) return true;        // 無張數資料 → 保留
        return Math.round((x.sharesTo - x.sharesFrom) / 1000) !== 0;        // 張數變化 ≠ 0 才留
    });
    body += section('張數變動', 'var(--lux-navy)', changedReal, function(x){
        var up = x.to >= x.from;
        // 現有張數（變動後＝目前持有）
        var curLots = _etfLotsLabel(x.sharesTo);
        // 張數變化（若兩版都有 shares）
        var lotsLine = '';
        if (x.sharesFrom != null && x.sharesTo != null) {
            var lotDelta = (x.sharesTo - x.sharesFrom) / 1000;
            var lUp = lotDelta >= 0;
            var deltaTxt = (lUp ? '+' : '−') + Math.abs(Math.round(lotDelta)).toLocaleString('en-US') + ' 張';
            lotsLine = '<span style="flex:0 0 auto;color:' + signColor(lUp ? 1 : -1) + ';font-size:11px;margin-left:6px">' + deltaTxt + '</span>';
        }
        return '<span style="flex:1;min-width:0">' + nameCell(x) + '</span>' +
            (curLots ? '<span style="flex:0 0 auto;color:var(--muted);font-size:11px;margin-right:8px">' + curLots + '</span>' : '') +
            '<span style="flex:0 0 auto;color:var(--muted);font-size:12px">' + x.from.toFixed(2) + '% → </span>' +
            '<span style="flex:0 0 auto;color:' + signColor(up ? 1 : -1) + ';font-weight:600">' + x.to.toFixed(2) + '%</span>' +
            '<span style="flex:0 0 auto;color:' + signColor(up ? 1 : -1) + ';font-size:11px">(' + (up ? '+' : '') + (x.to - x.from).toFixed(2) + ')</span>' +
            lotsLine;
    });
    // 無異動：顯示友善空狀態（首次建基準後、或成分股沒變時）
    if (!body) {
        body = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:24px 8px;line-height:1.8">' +
            '<i class="ti ti-circle-check" style="font-size:28px;color:' + signColor(1) + ';display:block;margin-bottom:8px"></i>' +
            '與上次抓取相比，成分股無變動。<br>' +
            '<span style="font-size:11px">（系統會在每次開啟時記錄成分股，往後若有進榜／出榜／比例變動會顯示在這裡）</span></div>';
    }
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.style.alignItems = 'flex-start';
    ov.style.paddingTop = '6vh';
    ov.style.overflowY = 'auto';
    ov.innerHTML = '<div class="modal" style="width:460px;max-width:94vw;display:flex;flex-direction:column;max-height:84vh">' +
        '<h3 style="margin:0 0 4px;flex:none"><i class="ti ti-arrows-exchange"></i> ' + esc(etfId) + ' 成分股異動</h3>' +
        '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;flex:none">與上次抓取的成分股相比</div>' +
        '<div style="flex:1;overflow-y:auto">' + body + '</div>' +
        '<div class="modal-btns" style="margin-top:12px;flex:none"><button onclick="this.closest(\'.overlay\').remove()" style="flex:1">關閉</button></div>' +
        '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
}

// ETF 卡片開合（產業分佈、前十大持股）。body 可能是 div 或 table
function toggleEtfCard(headEl) {
    var card = headEl.parentElement;
    var body = card && card.querySelector('.etf-card-body');
    var icon = headEl.querySelector('i');
    if (!body) return;
    var open = body.style.display !== 'none';
    var openDisp = body.getAttribute('data-disp') || (body.tagName === 'TABLE' ? 'table' : 'block');
    body.style.display = open ? 'none' : openDisp;
    if (icon) icon.style.transform = open ? '' : 'rotate(90deg)';
}

// ── 基本面分頁／區塊（個股 modal + 搜尋日曆共用）──
// 同步回傳容器，注入 DOM 後會自動非同步抓取並填入（用 requestAnimationFrame 排程 hydrate）
var _FUND_CONTAINER_ID = 'fund-box';
function _buildFundamentalsHtml(stockId) {
    // ETF／債券 ETF 沒有個股財報（無 EPS／月營收）；改顯示「配息表現」輕量基本面
    if (/^00/.test(String(stockId))) {
        return _buildEtfFundamentalsHtml(stockId);
    }
    var hadCache = !!(_fundamentalsCache[stockId] && _fundamentalsCache[stockId].data);
    // 觸發抓取（非同步）：首次填入 or 有實質變動才重繪；無變動不動畫面
    setTimeout(function(){
        fetchFundamentals(stockId, function(err, data, changed){
            if (!hadCache || changed || err) _paintFundamentals(stockId, err, data);
        });
    }, 0);
    var loading = '<div class="' + _FUND_CONTAINER_ID + '" data-fund="' + esc(stockId) + '">' +
        '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px"><i class="ti ti-loader"></i> 載入基本面資料中…</div>' +
        '</div>';
    // 若已有快取（含 localStorage 還原），直接帶內容（避免閃 loading）
    var c = _fundamentalsCache[stockId];
    if (c && c.data) {
        return '<div class="' + _FUND_CONTAINER_ID + '" data-fund="' + esc(stockId) + '">' + _fundamentalsInnerHtml(c.data) + '</div>';
    }
    return loading;
}

// 籌碼面分頁（個股限定）：三大法人買賣超 + 連買連賣 + 外資趨勢 + 融資融券
function _buildChipsHtml(stockId) {
    var hadChips = !!(_chipsCache[stockId] && _chipsCache[stockId].data);
    setTimeout(function(){
        fetchChips(stockId, function(err, data, changed){
            if (!hadChips || changed || err) _paintChips(stockId, err, data);
        });
    }, 0);
    var cc = _chipsCache[stockId];
    if (cc && cc.data) {
        var inner = _chipsInnerHtml(cc.data);
        return '<div class="chips-box" data-chips="' + esc(stockId) + '">' + (inner || _chipsEmptyHtml()) + '</div>';
    }
    return '<div class="chips-box" data-chips="' + esc(stockId) + '">' +
        '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px"><i class="ti ti-loader"></i> 載入籌碼面資料中…</div></div>';
}
function _chipsEmptyHtml() {
    return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">查無籌碼面資料（法人買賣超／融資融券）。</div>';
}

// 抓完後把內容填入頁面上所有對應容器
function _paintFundamentals(stockId, err, data) {
    var boxes = document.querySelectorAll('.' + _FUND_CONTAINER_ID + '[data-fund="' + (window.CSS && CSS.escape ? CSS.escape(stockId) : stockId) + '"]');
    Array.prototype.forEach.call(boxes, function(box){
        if (err || !data) {
            box.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">基本面資料載入失敗或查無資料。</div>';
        } else {
            box.innerHTML = _fundamentalsInnerHtml(data);
        }
    });
}

// 抓完後把籌碼面填入頁面上所有對應容器
function _paintChips(stockId, err, data) {
    var sel = (window.CSS && CSS.escape ? CSS.escape(stockId) : stockId);
    var boxes = document.querySelectorAll('.chips-box[data-chips="' + sel + '"]');
    Array.prototype.forEach.call(boxes, function(box){
        if (err || !data) { box.innerHTML = _chipsEmptyHtml(); return; }
        var inner = _chipsInnerHtml(data);
        box.innerHTML = inner || _chipsEmptyHtml();
    });
}

// 把指標物件渲染成 HTML
function _fundamentalsInnerHtml(d) {
    var html = '';
    var cardOpen = '<div style="border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:6px">';
    var titleStyle = 'font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:4px';

    var hasRev = d.revenue, hasEps = d.eps && d.eps.length, hasMargin = d.grossMargin !== null || d.opMargin !== null || d.netMargin !== null;
    if (!hasRev && !hasEps && !hasMargin) {
        return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">查無此標的的基本面資料。</div>';
    }

    // ── 月營收 ──
    if (hasRev) {
        var r = d.revenue;
        var ymp = r.ym.split('-');
        html += cardOpen;
        html += '<div style="' + titleStyle + '">月營收</div>';
        html += '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px">';
        html += '<span style="font-size:13px;color:var(--muted)">' + ymp[0] + '年' + parseInt(ymp[1],10) + '月</span>';
        html += '<b style="font-size:22px;color:var(--text)">' + (r.value/1e8).toFixed(2) + '<span style="font-size:13px;font-weight:400;color:var(--muted)"> 億</span></b>';
        if (r.mom !== null) html += '<span style="font-size:13px">月增 <b style="color:' + signColor(r.mom) + '">' + signPrefix(r.mom) + r.mom.toFixed(1) + '%</b></span>';
        if (r.yoy !== null) html += '<span style="font-size:13px">年增 <b style="color:' + signColor(r.yoy) + '">' + signPrefix(r.yoy) + r.yoy.toFixed(1) + '%</b></span>';
        else html += '<span style="font-size:13px;color:var(--muted)">年增 <b>—</b><span style="font-size:11px"> (去年同月無資料)</span></span>';
        html += '</div>';
        // 近 12 月迷你長條圖
        if (d.revTrend && d.revTrend.length > 1) {
            var maxV = Math.max.apply(null, d.revTrend.map(function(t){ return t.value; }));
            html += '<div style="display:flex;align-items:flex-end;gap:3px;height:48px">';
            d.revTrend.forEach(function(t, i){
                var h = maxV > 0 ? Math.max(2, Math.round(t.value/maxV*44)) : 2;
                var isLast = i === d.revTrend.length - 1;
                var mm = t.ym.split('-')[1];
                html += '<div title="' + t.ym + '：' + (t.value/1e8).toFixed(2) + ' 億" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px">' +
                    '<div style="width:100%;height:' + h + 'px;background:' + (isLast ? 'var(--lux-navy)' : 'rgba(30,58,95,0.25)') + ';border-radius:2px 2px 0 0"></div>' +
                    '<span style="font-size:9px;color:var(--muted)">' + parseInt(mm,10) + '</span></div>';
            });
            html += '</div><div style="font-size:10px;color:var(--muted);margin-top:4px">近 12 月營收趨勢（億元）</div>';
        }
        html += '</div>';
    }

    // ── 獲利（季 EPS）+ 本益比 ──
    if (hasEps) {
        html += cardOpen;
        html += '<div style="' + titleStyle + '">獲利（每股盈餘 EPS）</div>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">';
        d.eps.forEach(function(e){
            html += '<div style="flex:1;min-width:64px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px 4px">' +
                '<div style="font-size:11px;color:var(--muted)">' + e.label + '</div>' +
                '<div style="font-size:16px;font-weight:700;color:' + signColor(e.value) + '">' + signPrefix(e.value) + e.value.toFixed(2) + '</div></div>';
        });
        html += '</div>';
        html += '<div style="display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px">';
        if (d.epsTTM !== null) {
            var ttmFull = d.eps.length === 4;
            html += '<span>近四季合計 <b style="color:' + signColor(d.epsTTM) + '">' + signPrefix(d.epsTTM) + d.epsTTM.toFixed(2) + '</b>' +
                (ttmFull ? '' : '<span style="font-size:11px;color:var(--muted)">（不足四季）</span>') + '</span>';
        }
        if (d.roe !== null) {
            html += '<span>ROE（近四季） <b style="color:' + signColor(d.roe) + '">' + signPrefix(d.roe) + d.roe.toFixed(1) + '%</b></span>';
        }
        // 官方估值（TWSE 版 PER/PBR/殖利率）併入此卡，取代原自算 PER
        if (d.perOfficial != null) html += '<span>本益比 PER <b style="color:var(--lux-navy)">' + d.perOfficial.toFixed(2) + ' 倍</b></span>';
        else if (d.epsTTM !== null && d.epsTTM <= 0) html += '<span>本益比 PER <b style="color:var(--muted)">—（近四季虧損）</b></span>';
        if (d.pbrOfficial != null) html += '<span>股價淨值比 PB <b style="color:var(--lux-navy)">' + d.pbrOfficial.toFixed(2) + ' 倍</b></span>';
        if (d.dividendYield != null) html += '<span>殖利率 <b style="color:' + signColor(1) + '">' + d.dividendYield.toFixed(2) + '%</b></span>';
        html += '</div>';
        if (d.perDate) html += '<div style="font-size:10px;color:var(--muted);margin-top:4px">PER／PB／殖利率為官方公告值（' + d.perDate.slice(5) + '）</div>';
        html += '</div>';
    }

    // ── 獲利品質（三率）＋ 財務體質：併同一排（flex 兩欄，窄了自動換行）──
    var cardHalf = 'border:1px solid var(--border);border-radius:10px;padding:8px 14px;flex:1 1 300px';
    // 三率卡片內容
    var marginInner = '';
    if (hasMargin) {
        marginInner = '<div style="' + titleStyle + '">獲利品質' + (d.marginQuarter ? '（' + d.marginQuarter + '）' : '') + '</div>';
        marginInner += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
        function _marginCell(label, v) {
            if (v === null) return '';
            return '<div style="flex:1;min-width:72px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px 4px">' +
                '<div style="font-size:11px;color:var(--muted)">' + label + '</div>' +
                '<div style="font-size:16px;font-weight:700;color:' + signColor(v) + '">' + v.toFixed(1) + '%</div></div>';
        }
        marginInner += _marginCell('毛利率', d.grossMargin);
        marginInner += _marginCell('營益率', d.opMargin);
        marginInner += _marginCell('淨利率', d.netMargin);
        marginInner += '</div>';
    }
    // 財務體質卡片內容
    var healthInner = '';
    if (d.debtRatio != null || d.currentRatio != null || d.bookValuePerShare != null) {
        healthInner = '<div style="' + titleStyle + '">財務體質' + (d.bsQuarter ? '<span style="font-weight:400;color:var(--muted);font-size:11px">（' + d.bsQuarter + '）</span>' : '') + '</div>';
        healthInner += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
        function _healthCell(label, valStr, color, hint) {
            return '<div style="flex:1;min-width:72px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px 4px">' +
                '<div style="font-size:11px;color:var(--muted)">' + label + '</div>' +
                '<div style="font-size:16px;font-weight:700;color:' + color + '">' + valStr + '</div>' +
                (hint ? '<div style="font-size:10px;color:var(--muted);margin-top:1px">' + hint + '</div>' : '') + '</div>';
        }
        if (d.debtRatio != null) {
            var dColor = d.debtRatio < 40 ? signColor(1) : d.debtRatio > 60 ? signColor(-1) : 'var(--text)';
            healthInner += _healthCell('負債比', d.debtRatio.toFixed(1) + '%', dColor, d.debtRatio < 40 ? '偏低' : d.debtRatio > 60 ? '偏高' : '');
        }
        if (d.currentRatio != null) {
            var cColor = d.currentRatio >= 200 ? signColor(1) : d.currentRatio < 100 ? signColor(-1) : 'var(--text)';
            healthInner += _healthCell('流動比', d.currentRatio.toFixed(0) + '%', cColor, d.currentRatio >= 200 ? '充裕' : d.currentRatio < 100 ? '偏弱' : '');
        }
        if (d.bookValuePerShare != null) {
            healthInner += _healthCell('每股淨值', d.bookValuePerShare.toFixed(2), 'var(--lux-navy)', '元');
        }
        healthInner += '</div>';
    }
    if (marginInner || healthInner) {
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">';
        if (marginInner) html += '<div style="' + cardHalf + '">' + marginInner + '</div>';
        if (healthInner) html += '<div style="' + cardHalf + '">' + healthInner + '</div>';
        html += '</div>';
    }

    html += '<div style="font-size:11px;color:var(--muted);line-height:1.6">※ 資料來源：FinMind（月營收、季財報、資產負債表、官方本益比）。PER／PB／殖利率為 TWSE／TPEX 官方公告值；ROE＝近四季淨利÷最新股東權益。負債比＝總負債÷總資產（低較穩健）；流動比＝流動資產÷流動負債（高較有短期償債力）；每股淨值＝股東權益÷股數。</div>';
    return html;
}

// 把籌碼指標物件渲染成 HTML（三大法人買賣超 + 連買連賣 + 外資趨勢條 + 融資融券）
function _chipsInnerHtml(d) {
    if (!d) return '';
    var hasInst = d.foreign != null || d.trust != null || d.dealer != null;
    var hasMargin = d.marginBalance != null || d.shortBalance != null;
    if (!hasInst && !hasMargin) return '';
    var cardOpen = '<div style="border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:6px">';
    var titleStyle = 'font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:4px';
    // 張數格式化：千分位、帶正負號顏色
    function _lots(v) {
        if (v == null) return '—';
        var s = (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('en-US');
        return s;
    }
    function _streakLabel(n) {
        if (!n) return '';
        return n > 0 ? '連買 ' + n + ' 日' : '連賣 ' + Math.abs(n) + ' 日';
    }
    var html = cardOpen;
    var dateStr = d.date ? '（' + d.date.slice(5) + '）' : '';
    html += '<div style="' + titleStyle + '">籌碼面' + (dateStr ? '<span style="font-weight:400;color:var(--muted);font-size:11px">' + dateStr + '</span>' : '') + '</div>';

    // 三大法人買賣超：三欄卡片（最新一日 / 近5日 / 連買賣）
    if (hasInst) {
        function _instCell(label, today, sum5, streak) {
            var tColor = today > 0 ? signColor(1) : today < 0 ? signColor(-1) : 'var(--muted)';
            var s5Color = sum5 > 0 ? signColor(1) : sum5 < 0 ? signColor(-1) : 'var(--muted)';
            var sk = _streakLabel(streak);
            return '<div style="flex:1;min-width:90px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px 4px">' +
                '<div style="font-size:11px;color:var(--muted);margin-bottom:2px">' + label + '</div>' +
                '<div style="font-size:16px;font-weight:700;color:' + tColor + '">' + _lots(today) + '</div>' +
                '<div style="font-size:10px;color:var(--muted);margin-top:2px">近5日 <span style="color:' + s5Color + '">' + _lots(sum5) + '</span></div>' +
                (sk ? '<div style="font-size:10px;color:' + (streak > 0 ? signColor(1) : signColor(-1)) + ';margin-top:1px">' + sk + '</div>' : '') +
                '</div>';
        }
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
        html += _instCell('外資', d.foreign, d.foreign5, d.foreignStreak);
        html += _instCell('投信', d.trust, d.trust5, d.trustStreak);
        html += _instCell('自營', d.dealer, d.dealer5, 0);
        html += '</div>';

        // 三大法人合計（當日 / 近5日）
        if (d.instTotal != null) {
            var itColor = d.instTotal > 0 ? signColor(1) : d.instTotal < 0 ? signColor(-1) : 'var(--muted)';
            var it5Color = d.instTotal5 > 0 ? signColor(1) : d.instTotal5 < 0 ? signColor(-1) : 'var(--muted)';
            html += '<div style="font-size:13px;margin-top:6px">三大法人合計 <b style="color:' + itColor + '">' + _lots(d.instTotal) + '</b> 張' +
                (d.instTotal5 != null ? ' <span style="font-size:11px;color:var(--muted)">近5日 <span style="color:' + it5Color + '">' + _lots(d.instTotal5) + '</span></span>' : '') + '</div>';
        }

        // 趨勢條共用：正綠負紅、中線=0
        function _trendBars(arr, label) {
            if (!Array.isArray(arr) || arr.length < 2) return '';
            var maxAbs = Math.max.apply(null, arr.map(function(v){ return Math.abs(v); })) || 1;
            var bars = arr.map(function(v){
                var h = Math.max(2, Math.abs(v) / maxAbs * 22);
                var up = v >= 0;
                return '<div title="' + _lots(v) + ' 張" style="flex:1;display:flex;flex-direction:column;justify-content:center;height:40px">' +
                    (up ? '<div style="height:20px;display:flex;align-items:flex-end"><div style="width:100%;height:' + h + 'px;background:' + signColor(1) + ';border-radius:2px 2px 0 0"></div></div><div style="height:20px"></div>'
                        : '<div style="height:20px"></div><div style="height:20px;display:flex;align-items:flex-start"><div style="width:100%;height:' + h + 'px;background:' + signColor(-1) + ';border-radius:0 0 2px 2px"></div></div>') +
                    '</div>';
            }).join('');
            return '<div style="margin-top:6px"><div style="display:flex;align-items:center;gap:2px;position:relative">' +
                '<div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border)"></div>' + bars + '</div>' +
                '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + label + '</div></div>';
        }
        html += _trendBars(d.foreignTrend, '外資近 ' + (d.foreignTrend ? d.foreignTrend.length : 0) + ' 日買賣超趨勢（張）');
        html += _trendBars(d.trustTrend, '投信近 ' + (d.trustTrend ? d.trustTrend.length : 0) + ' 日買賣超趨勢（張）');
    }

    // 融資融券餘額
    if (hasMargin) {
        function _marginCell(label, bal, chg, unit) {
            if (bal == null) return '';
            var cColor = chg > 0 ? signColor(1) : chg < 0 ? signColor(-1) : 'var(--muted)';
            return '<span>' + label + ' <b>' + bal.toLocaleString('en-US') + '</b> ' + unit +
                (chg != null ? ' <span style="color:' + cColor + ';font-size:12px">(' + _lots(chg) + ')</span>' : '') + '</span>';
        }
        html += '<div style="display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px;margin-top:' + (hasInst ? '10px' : '0') + '">';
        html += _marginCell('融資餘額', d.marginBalance, d.marginChange, '張');
        html += _marginCell('融券餘額', d.shortBalance, d.shortChange, '張');
        if (d.marginUsage != null) html += '<span>融資使用率 <b>' + d.marginUsage.toFixed(1) + '%</b></span>';
        if (d.shortMarginRatio != null) html += '<span>券資比 <b>' + d.shortMarginRatio.toFixed(1) + '%</b></span>';
        html += '</div>';
    }

    // 外資持股比例（僅個股；ETF 的此值無意義，隱藏）
    var _isEtfChips = /^00/.test(String(d.stockId || ''));
    if (!_isEtfChips && d.foreignHoldRatio != null) {
        var fhColor = d.foreignHoldChange > 0 ? signColor(1) : d.foreignHoldChange < 0 ? signColor(-1) : 'var(--muted)';
        html += '<div style="font-size:13px;margin-top:10px">外資持股比例 <b style="color:var(--lux-navy)">' + d.foreignHoldRatio.toFixed(2) + '%</b>' +
            (d.foreignHoldChange != null && Math.abs(d.foreignHoldChange) >= 0.01 ? ' <span style="color:' + fhColor + ';font-size:12px">(' + (d.foreignHoldChange > 0 ? '+' : '') + d.foreignHoldChange.toFixed(2) + ' pt，近期)</span>' : '') + '</div>';
    }

    html += '<div style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px">※ 法人買賣超／融資融券／外資持股來源：FinMind。買超為正、賣超為負；單位：張（1張=1000股）。括號內為較前一日增減。融資使用率＝融資餘額÷限額；券資比＝融券÷融資（高有軋空潛力）；外資持股變化為區間首尾比較。</div>';
    html += '</div>';
    return html;
}

// 單股歷史配息（個股 modal 的「歷史配息」分頁）。
// 合併兩來源：除權息快取（FinMind/Yahoo/MoneyDJ，含股票股利、配息日）+ 你手記的股利。
// 以「除息日」去重；每股配息優先用手記值，股票股利／配息日用快取。
// 配息表現摘要（近一年每股配息／殖利率／頻率）—— 歷史配息分頁頂部顯示
function _dividendSummaryHtml(stockId) {
    var ttmCps = _trailing12mCashPerShare(stockId);
    var now = new Date();
    var oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
    var seen = {}, cnt = 0;
    (_dividendCacheItems || []).forEach(function(item){
        if (item.stockId !== stockId || !item.cash || item.cash <= 0) return;
        var d = new Date(item.exDate);
        if (isNaN(d.getTime())) return;
        var key = stockId + '|' + item.exDate;
        if (seen[key]) return;
        seen[key] = true;
        if (d >= oneYearAgo && d <= now) cnt++;
    });
    if (ttmCps <= 0 && cnt === 0) return '';
    // 官方配息頻率（後端 etfinfo 從 MoneyDJ 章程抓）優先；沒有才用近一年次數推估並標「推估」
    var officialFreq = (_etfInfoCache[stockId] && _etfInfoCache[stockId].data && _etfInfoCache[stockId].data.dividendFreq) || '';
    var freqLabel, freqIsEstimate = false;
    if (officialFreq) {
        freqLabel = officialFreq;
    } else {
        freqLabel = cnt >= 11 ? '月配' : cnt >= 4 ? '季配' : cnt === 2 ? '半年配' : cnt === 1 ? '年配' : '—';
        freqIsEstimate = (freqLabel !== '—');
    }
    var price = _currentPriceFor(stockId);
    // 年化殖利率：用共用函式（配滿一年用實際 ttmCps；新標的用「最新一次配息×頻率次數」推估）
    var ay = _annualizedCashPerShare(stockId);
    var yieldIsEstimate = ay.isEstimate;
    var yieldVal = (price && ay.annualCps > 0) ? (ay.annualCps / price * 100) : null;
    var yieldTxt = yieldVal != null ? yieldVal.toFixed(2) + '%' : '—';
    var html = '<div style="border:1px solid var(--border);border-radius:10px;padding:8px 16px;margin-bottom:12px">';
    html += '<div style="font-size:12px;color:var(--lux-navy);font-weight:700;letter-spacing:.5px;margin-bottom:5px">配息表現</div>';
    html += '<div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px">';
    html += '<span>近一年每股配息 <b style="color:var(--lux-navy)">' + (ttmCps > 0 ? '$' + ttmCps.toFixed(3) : '—') + '</b></span>';
    html += '<span>年化殖利率 <b style="color:var(--lux-navy)">' + yieldTxt + '</b>' +
        (yieldIsEstimate ? '<span style="font-size:11px;color:var(--muted)">（推估・最新 $' + ay.unitCps.toFixed(3) + '×' + ay.freqCount + '）</span>' : '') +
        '</span>';
    html += '<span>配息頻率 <b>' + freqLabel + '</b>' +
        (freqIsEstimate ? '<span style="font-size:11px;color:var(--muted)">（推估・近一年 ' + cnt + ' 次）</span>'
                        : (cnt ? '<span style="font-size:11px;color:var(--muted)">（近一年 ' + cnt + ' 次）</span>' : '')) +
        '</span>';
    html += '</div></div>';
    return html;
}

function _buildStockDividendsHtml(stockId) {
    var byEx = {}; // 除息日 → { date, cps, stockDiv, payDate }

    // 快取（市場資料：含股票股利、配息日，覆蓋最完整且乾淨）
    (_dividendCacheItems || []).forEach(function(it){
        if (!it || it.stockId !== stockId || !it.exDate) return;
        if (!byEx[it.exDate]) byEx[it.exDate] = { date: it.exDate, cps: 0, stockDiv: 0, payDate: '' };
        var e = byEx[it.exDate];
        if ((Number(it.cash) || 0) > 0) e.cps = Number(it.cash);
        if ((Number(it.stockDiv) || 0) > 0) e.stockDiv = Number(it.stockDiv);
        if (it.payDate && !e.payDate) e.payDate = it.payDate;
    });

    // 該股只要快取有任何資料就完全以快取為準（避免手記除息日對不齊污染）；
    // 只有「快取完全沒這檔」時才退回用手記墊底。
    var hasCache = Object.keys(byEx).length > 0;
    if (!hasCache) {
        (stockData.dividends || []).forEach(function(d){
            if (d.stockId !== stockId || !d.date) return;
            if (!byEx[d.date]) byEx[d.date] = { date: d.date, cps: 0, stockDiv: 0, payDate: '' };
            var cps = Number(d.cashPerShare) || 0;
            if (cps > 0) byEx[d.date].cps = cps;
        });
    }

    // 過濾現金與股票都為 0 的空筆
    var all = Object.keys(byEx).map(function(k){ return byEx[k]; })
        .filter(function(e){ return e.cps > 0 || e.stockDiv > 0; });

    if (all.length === 0) {
        return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">尚無配息紀錄。<br>市場資料每日自動更新；也可在「股利紀錄」分頁手動新增。</div>';
    }

    var hasPayCol = all.some(function(e){ return e.payDate; });
    var hasStockCol = all.some(function(e){ return e.stockDiv > 0; });

    // 分年
    var byYear = {};
    all.forEach(function(e){
        var y = e.date.substring(0,4);
        if (!byYear[y]) byYear[y] = { items: [], cps: 0, stockDiv: 0 };
        byYear[y].items.push(e);
        byYear[y].cps += e.cps;
        byYear[y].stockDiv += e.stockDiv;
    });
    Object.keys(byYear).forEach(function(y){
        byYear[y].items.sort(function(a, b){ return b.date.localeCompare(a.date); }); // 年內新→舊
    });
    var years = Object.keys(byYear).sort(function(a, b){ return b.localeCompare(a); }); // 新→舊
    function _yearROC(y){ var n = parseInt(y,10); return isNaN(n) ? y : (n - 1911); }

    // 選定年份：優先用使用者切換的；否則預設今年（若有），再否則最新有資料的年
    var thisYear = String(new Date().getFullYear());
    var curYear = _stockCalModalState.divYear;
    if (!curYear || years.indexOf(curYear) < 0) {
        curYear = (years.indexOf(thisYear) >= 0) ? thisYear : years[0];
    }

    // 年份左右切換（years 為新→舊：上一年=較舊=index+1、下一年=較新=index-1）
    var curIdx = years.indexOf(curYear);
    var prevYear = (curIdx >= 0 && curIdx < years.length - 1) ? years[curIdx + 1] : '';
    var nextYear = (curIdx > 0) ? years[curIdx - 1] : '';
    var arrowBase = 'flex:0 0 auto;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:16px;color:var(--text)';
    var arrowOn = arrowBase + ';cursor:pointer';
    var arrowOff = arrowBase + ';opacity:0.3;cursor:not-allowed';

    // 判定「年配」：官方頻率為年配，或（無官方頻率時）每個有資料的年份都最多 1 筆
    var officialFreqDiv = (_etfInfoCache[stockId] && _etfInfoCache[stockId].data && _etfInfoCache[stockId].data.dividendFreq) || '';
    var isAnnualPay;
    if (officialFreqDiv) {
        isAnnualPay = (officialFreqDiv === '年配');
    } else {
        isAnnualPay = years.every(function(y){ return byYear[y].items.length <= 1; });
    }

    var html = _dividendSummaryHtml(stockId);

    // 年配：不分年，直接列近 10 年全部配息（新→舊）
    if (isAnnualPay) {
        var tenYearsAgo = String(new Date().getFullYear() - 10);
        var recent = all.filter(function(e){ return e.date.substring(0,4) >= tenYearsAgo; })
                        .sort(function(a, b){ return b.date.localeCompare(a.date); });
        if (recent.length === 0) recent = all.slice().sort(function(a, b){ return b.date.localeCompare(a.date); });
        var sumCps = recent.reduce(function(s, e){ return s + e.cps; }, 0);
        var sumStock = recent.reduce(function(s, e){ return s + e.stockDiv; }, 0);
        var sumLbl = '近 ' + recent.length + ' 次合計 <b style="color:var(--lux-navy);font-size:15px">' + sumCps.toFixed(3) + '</b>';
        if (sumStock > 0) sumLbl += '　配股 <b style="color:var(--lux-navy)">' + sumStock.toFixed(3) + '</b>';
        html += '<div style="display:flex;align-items:center;margin-bottom:10px"><span style="font-size:13px;font-weight:600;color:var(--text)">歷年配息（近 10 年）</span>' +
            '<span style="margin-left:auto;font-size:13px;color:var(--muted)">' + sumLbl + '</span></div>';
        html += '<table class="stock-table" style="width:100%;font-size:13px"><thead><tr>' +
            '<th style="text-align:left;padding:6px 4px">除息日</th>' +
            (hasPayCol ? '<th style="text-align:left;padding:6px 4px">發放日</th>' : '') +
            '<th style="text-align:right;padding:6px 4px">每股配息</th>' +
            (hasStockCol ? '<th style="text-align:right;padding:6px 4px">股票股利</th>' : '') +
            '</tr></thead><tbody>';
        recent.forEach(function(e){
            html += '<tr style="border-bottom:1px solid var(--border)">' +
                '<td style="text-align:left;padding:6px 4px">' + esc(_toROCDate(e.date) || '—') + '</td>' +
                (hasPayCol ? '<td style="text-align:left;padding:6px 4px;color:var(--muted)">' + (e.payDate ? esc(_toROCDate(e.payDate)) : '—') + '</td>' : '') +
                '<td style="text-align:right;padding:6px 4px;color:var(--lux-navy);font-weight:600">' + (e.cps > 0 ? e.cps.toFixed(3) : '-') + '</td>' +
                (hasStockCol ? '<td style="text-align:right;padding:6px 4px;color:var(--green);font-weight:600">' + (e.stockDiv > 0 ? e.stockDiv.toFixed(3) : '-') + '</td>' : '') +
                '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    var g = byYear[curYear];
    var sumLabel = '每股合計 <b style="color:var(--lux-navy);font-size:15px">' + g.cps.toFixed(3) + '</b>';
    if (g.stockDiv > 0) sumLabel += '　配股 <b style="color:var(--lux-navy)">' + g.stockDiv.toFixed(3) + '</b>';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
    html += prevYear
        ? '<button type="button" onclick="onStockDivYearChange(\'' + prevYear + '\')" title="上一年" style="' + arrowOn + '"><i class="ti ti-chevron-left"></i></button>'
        : '<button type="button" disabled style="' + arrowOff + '"><i class="ti ti-chevron-left"></i></button>';
    html += '<div style="min-width:120px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:15px;font-weight:600;color:var(--text)">' + _yearROC(curYear) + ' 年</div>';
    html += nextYear
        ? '<button type="button" onclick="onStockDivYearChange(\'' + nextYear + '\')" title="下一年" style="' + arrowOn + '"><i class="ti ti-chevron-right"></i></button>'
        : '<button type="button" disabled style="' + arrowOff + '"><i class="ti ti-chevron-right"></i></button>';
    html += '<span style="margin-left:auto;font-size:13px;color:var(--muted)">' + sumLabel + '　' + g.items.length + ' 筆</span>';
    html += '</div>';

    html += '<table class="stock-table" style="width:100%;font-size:13px"><thead><tr>' +
        '<th style="text-align:left;padding:6px 4px">除息日</th>' +
        (hasPayCol ? '<th style="text-align:left;padding:6px 4px">發放日</th>' : '') +
        '<th style="text-align:right;padding:6px 4px">每股配息</th>' +
        (hasStockCol ? '<th style="text-align:right;padding:6px 4px">股票股利</th>' : '') +
        '</tr></thead><tbody>';
    g.items.forEach(function(e){
        html += '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="text-align:left;padding:6px 4px">' + esc(_toROCDate(e.date) || '—') + '</td>' +
            (hasPayCol ? '<td style="text-align:left;padding:6px 4px;color:var(--muted)">' + (e.payDate ? esc(_toROCDate(e.payDate)) : '—') + '</td>' : '') +
            '<td style="text-align:right;padding:6px 4px;color:var(--lux-navy);font-weight:600">' + (e.cps > 0 ? e.cps.toFixed(3) : '-') + '</td>' +
            (hasStockCol ? '<td style="text-align:right;padding:6px 4px;color:var(--green);font-weight:600">' + (e.stockDiv > 0 ? e.stockDiv.toFixed(3) : '-') + '</td>' : '') +
            '</tr>';
    });
    html += '</tbody></table>';
    return html;
}

// 單股交易紀錄（buy + sell）
function _buildStockTradesHtml(stockId) {
    var items = (stockData.trades || [])
        .map(function(t, i){ return { t: t, i: i }; })
        .filter(function(x){ return (x.t.type === 'buy' || x.t.type === 'sell') && x.t.id === stockId; });

    if (items.length === 0) {
        return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">尚無交易紀錄。<br>在持股總覽用 <i class="ti ti-plus"></i> 買入或 <i class="ti ti-cash"></i> 賣出，會自動記在這裡。</div>';
    }

    // 計算「波次」：依日期+原索引由舊到新 replay，每次股數歸 0 後再進場就是新一波
    var ascSorted = items.slice().sort(function(a, b){
        var ad = a.t.date || '', bd = b.t.date || '';
        if (ad !== bd) return ad < bd ? -1 : 1;
        return a.i - b.i;
    });
    var wave = 1, shares = 0;
    var waveByIdx = {}; // trade index → wave number
    ascSorted.forEach(function(x){
        if (shares === 0 && Object.keys(waveByIdx).length > 0) wave++;
        var t = x.t;
        if (t.type === 'buy') shares += (t.shares || 0);
        else shares = Math.max(0, shares - (t.shares || 0));
        waveByIdx[x.i] = wave;
    });
    var totalWaves = wave;

    // 顯示用：新→舊
    items.sort(function(a, b){
        var ad = a.t.date || '', bd = b.t.date || '';
        if (ad !== bd) return ad < bd ? 1 : -1;
        return b.i - a.i;
    });

    // 摘要：累積已實現、買入次數、賣出次數
    var totalRealized = 0, buyCount = 0, sellCount = 0;
    items.forEach(function(x){
        if (x.t.type === 'sell') { totalRealized += (x.t.realized || 0); sellCount++; }
        else buyCount++;
    });

    var html = '';
    var clearBtn = '<button onclick="clearStockTrades(' + escJs(stockId) + ')" style="margin-left:auto;background:none;border:1px solid var(--red);color:var(--red);padding:3px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit"><i class="ti ti-trash" style="font-size:12px"></i> 清空</button>';
    if (sellCount > 0) {
        var rCls = totalRealized >= 0 ? 'pos' : 'neg';
        html += '<div style="display:flex;align-items:center;gap:14px;font-size:13px;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:6px;flex-wrap:wrap">';
        html += '<span style="color:var(--muted)">累積已實現 <b class="' + rCls + '">' + (totalRealized >= 0 ? '+' : '') + fmt(totalRealized) + '</b></span>';
        html += '<span style="color:var(--muted)">買 <b style="color:var(--text)">' + buyCount + '</b> 筆／賣 <b style="color:var(--text)">' + sellCount + '</b> 筆</span>';
        html += clearBtn;
        html += '</div>';
    } else {
        html += '<div style="display:flex;align-items:center;font-size:13px;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:6px;color:var(--muted)">買入 <b style="color:var(--text);margin:0 4px"> ' + buyCount + ' </b> 筆（尚未賣出）' + clearBtn + '</div>';
    }

    html += '<div style="max-height:420px;overflow-y:auto">';
    html += '<table style="width:100%;font-size:13px;border-collapse:collapse">' +
        '<thead><tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:12px">' +
            '<th style="padding:6px 4px;text-align:center;width:42px">類別</th>' +
            '<th style="padding:6px 4px;text-align:center">日期</th>' +
            '<th style="padding:6px 4px;text-align:right">股數</th>' +
            '<th style="padding:6px 4px;text-align:right">股價</th>' +
            '<th style="padding:6px 4px;text-align:right">金額／已實現</th>' +
            '<th style="padding:6px 4px;width:60px"></th>' +
        '</tr></thead><tbody>';
    var prevWave = null;
    items.forEach(function(x){
        var t = x.t;
        var w = waveByIdx[x.i];
        if (w !== prevWave) {
            // 波次分隔列；最頂部那一波（= 最新波）標「目前持有」
            var isCurrent = (w === totalWaves);
            var label = '第 ' + w + ' 波' + (isCurrent ? '（目前持有）' : '（已結束）');
            var bg = isCurrent ? 'rgba(212,175,55,0.10)' : 'rgba(0,0,0,0.03)';
            var color = isCurrent ? 'var(--lux-navy)' : 'var(--muted)';
            html += '<tr><td colspan="6" style="padding:6px 8px;background:' + bg + ';color:' + color + ';font-size:11px;font-weight:600;letter-spacing:0.5px">' + label + '</td></tr>';
            prevWave = w;
        }
        var isBuy = t.type === 'buy';
        var typeLabel = isBuy
            ? '<span style="display:inline-block;background:rgba(22,163,74,0.12);color:var(--green);padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600">買</span>'
            : '<span style="display:inline-block;background:rgba(239,68,68,0.12);color:var(--red);padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600">賣</span>';
        var priceStr = (typeof t.price === 'number') ? t.price.toFixed(2) : '-';
        var amountCell;
        if (isBuy) {
            var amount = (typeof t.amount === 'number') ? t.amount : (t.shares || 0) * (t.price || 0);
            amountCell = '<td style="padding:8px 4px;text-align:right;font-weight:600;color:var(--muted)">' + fmt(amount) + '</td>';
        } else {
            var realized = t.realized || 0;
            var cls = realized >= 0 ? 'pos' : 'neg';
            amountCell = '<td class="' + cls + '" style="padding:8px 4px;text-align:right;font-weight:600">' + (realized >= 0 ? '+' : '') + fmt(realized) + '</td>';
        }
        html += '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="padding:8px 4px;text-align:center">' + typeLabel + '</td>' +
            '<td style="padding:8px 4px;text-align:center;color:var(--muted);font-size:12px;white-space:nowrap">' + esc(t.date || '') + '</td>' +
            '<td style="padding:8px 4px;text-align:right">' + fmt(t.shares || 0) + '</td>' +
            '<td style="padding:8px 4px;text-align:right;color:var(--muted)">' + priceStr + '</td>' +
            amountCell +
            '<td style="padding:8px 4px;text-align:right;white-space:nowrap">' +
                '<button onclick="editTrade(' + x.i + ')" title="編輯" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 4px;font-size:13px"><i class="ti ti-pencil"></i></button>' +
                '<button onclick="deleteTrade(' + x.i + ')" title="刪除" style="background:none;border:none;cursor:pointer;color:var(--red);padding:2px 4px;font-size:13px"><i class="ti ti-trash"></i></button>' +
            '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
    return html;
}

// 建立個股漲跌日曆 HTML（純價格 %、複利累加）
// ── 單日成交量（張）快取，來源 FinMind TaiwanStockPrice ──
// stockId → { loading, map:{ 'YYYY-MM-DD': 張數 } }
// localStorage 持久化：重整後直接用上次抓到的量，不必重抓（避免額度滿時量消失）
var _volumeCache = {};
var _VOL_CACHE_LS_KEY = 'volumeCache';
function _loadVolumeLS() {
    try {
        var raw = localStorage.getItem(_VOL_CACHE_LS_KEY);
        if (!raw) return;
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
            Object.keys(o).forEach(function(id){ if (o[id] && o[id].map) _volumeCache[id] = { map: o[id].map }; });
        }
    } catch (e) {}
}
function _saveVolumeLS() {
    try {
        var slim = {};
        Object.keys(_volumeCache).forEach(function(id){
            if (_volumeCache[id] && _volumeCache[id].map && Object.keys(_volumeCache[id].map).length) slim[id] = { map: _volumeCache[id].map };
        });
        localStorage.setItem(_VOL_CACHE_LS_KEY, JSON.stringify(slim));
    } catch (e) {}
}
_loadVolumeLS();

function fetchStockVolume(stockId, onDone, force, _attempt) {
    var c = _volumeCache[stockId];
    if (c && c.map && !force) { if (onDone) onDone(c.map); return; } // 已有快取且非強制→直接用
    if (c && c.loading && !_attempt) return; // 抓取中，避免重複（重試自身的遞迴呼叫帶 _attempt 不擋）
    _attempt = _attempt || 1;
    var MAX_ATTEMPT = 3; // FinMind 免費端常 timeout/塞，自動重試提高成功率
    // force 重抓時保留舊 map 供畫面繼續顯示，只標 loading
    _volumeCache[stockId] = (c && c.map) ? { map: c.map, loading: true } : { loading: true };
    var url = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=' + encodeURIComponent(stockId) + '&start_date=2023-01-01');
    function _retryOrFail() {
        if (_attempt < MAX_ATTEMPT) {
            // 退避重試：第2次等 1.2s、第3次 2.4s（避開瞬間塞車/額度尖峰）
            setTimeout(function(){ fetchStockVolume(stockId, onDone, force, _attempt + 1); }, 1200 * _attempt);
        } else {
            delete _volumeCache[stockId]; // 連 3 次都失敗：清標記，下次開又會重試
            if (onDone) onDone({});
        }
    }
    fetchWithTimeout(url, {}, 15000)
        .then(function(r){ return r.json(); })
        .then(function(json){
            var map = {};
            if (json && json.status === 200 && Array.isArray(json.data)) {
                json.data.forEach(function(r){
                    if (r && r.date && typeof r.Trading_Volume === 'number') {
                        map[r.date] = Math.round(r.Trading_Volume / 1000); // 股→張
                    }
                });
            }
            if (Object.keys(map).length) {
                _volumeCache[stockId] = { map: map };
                _saveVolumeLS(); // 抓到才持久化
                if (onDone) onDone(map);
            } else {
                _retryOrFail(); // status 非200(額度/timeout回空)或無資料 → 重試
            }
        })
        .catch(function(){ _retryOrFail(); }); // 網路/timeout → 重試
}

// 量抓好後，重繪頁面上正在顯示這檔日曆的容器
function _repaintActiveCalendars(stockId) {
    // 個股 modal（搜尋個股查完也是開這個 modal，統一由此重繪）
    if (_stockCalModalState.stockId === stockId && _stockCalModalState.tab === 'calendar') {
        var b = document.getElementById('stock-cal-modal-body');
        if (b) b.innerHTML = _buildStockCalendarHtml(stockId, _stockCalModalState.month);
    }
}

function _buildStockCalendarHtml(stockId, curMonthOpt, onChangeFn) {
    onChangeFn = onChangeFn || 'onStockCalMonthChange';
    var _vc = _volumeCache[stockId];
    var volMap = (_vc && _vc.map) ? _vc.map : null;
    var ph = (stockData.priceHistory || {})[stockId] || [];
    ph = ph.slice().sort(function(a, b){ return (a.date || '').localeCompare(b.date || ''); });
    // 確保成交量資料：沒抓過就抓；已有但「量的最新日期落後於股價最新日期」(如5月抓的、6月新交易日沒量) → 強制重抓補上
    if (!/^00/.test(String(stockId)) && !(_vc && _vc.loading)) {
        var phLatest = ph.length ? (ph[ph.length-1].date || '') : '';
        var volLatest = '';
        if (volMap) { var vks = Object.keys(volMap); if (vks.length) volLatest = vks.sort()[vks.length-1]; }
        if (!_vc) {
            fetchStockVolume(stockId, function(){ _repaintActiveCalendars(stockId); });
        } else if (volMap && phLatest && volLatest && volLatest < phLatest) {
            fetchStockVolume(stockId, function(){ _repaintActiveCalendars(stockId); }, true); // 量落後→強制重抓
        }
    }
    var dailyPnL = {};
    var allMonthSet = {};
    for (var i = 1; i < ph.length; i++) {
        var prevP = ph[i - 1], curP = ph[i];
        if (prevP.price > 0) {
            dailyPnL[curP.date] = { pct: (curP.price - prevP.price) / prevP.price * 100, price: curP.price };
        }
    }
    ph.forEach(function(e){ if (e.date) allMonthSet[e.date.slice(0,7)] = true; });
    // 補今天（用 Yahoo change 推算）：與 snapshotStockPrices 同規則 — 僅在「平日 + 15:00 後」才補
    var todayP = stockData.prices && stockData.prices[stockId];
    if (todayP && typeof todayP.price === 'number' && typeof todayP.change === 'number') {
        var twNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        var wd = twNow.getDay();
        var afterClose = twNow.getHours() >= 15;
        if (wd !== 0 && wd !== 6 && afterClose) {
            var prevClose = todayP.price - todayP.change;
            var todayKey = _localDateStr(twNow);
            if (!dailyPnL[todayKey] && prevClose > 0) {
                dailyPnL[todayKey] = { pct: todayP.change / prevClose * 100, price: todayP.price };
                allMonthSet[todayKey.slice(0,7)] = true;
            }
        }
    }
    if (Object.keys(dailyPnL).length === 0) {
        return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">尚無價格紀錄。</div>';
    }
    var months = Object.keys(allMonthSet).sort().reverse();
    var curMonth = (curMonthOpt && allMonthSet[curMonthOpt]) ? curMonthOpt : months[0];

    // 月合計（複利）
    var monthDates = Object.keys(dailyPnL).filter(function(d){ return d.slice(0,7) === curMonth; }).sort();
    var acc = 1;
    monthDates.forEach(function(d){ acc *= (1 + dailyPnL[d].pct / 100); });
    var monthPct = (acc - 1) * 100;

    var monthOpts = months.map(function(m){
        return '<option value="' + m + '"' + (m === curMonth ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    // 左右切換：months 為新→舊排序，故「上一月」index+1（較舊）、「下一月」index-1（較新）
    var curIdx = months.indexOf(curMonth);
    var prevMonth = (curIdx >= 0 && curIdx < months.length - 1) ? months[curIdx + 1] : '';
    var nextMonth = (curIdx > 0) ? months[curIdx - 1] : '';
    var arrowBase = 'flex:0 0 auto;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:16px;color:var(--text)';
    var arrowOn = arrowBase + ';cursor:pointer';
    var arrowOff = arrowBase + ';opacity:0.3;cursor:not-allowed';

    var html = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
    html += prevMonth
        ? '<button type="button" onclick="' + onChangeFn + '(\'' + prevMonth + '\')" title="上一月" style="' + arrowOn + '"><i class="ti ti-chevron-left"></i></button>'
        : '<button type="button" disabled style="' + arrowOff + '"><i class="ti ti-chevron-left"></i></button>';
    // 中間：點擊可自選月份（原生 select 透明疊在月份文字上）
    html += '<div style="position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;color:var(--text)">' +
        '<span>' + curMonth + '</span><i class="ti ti-chevron-down" style="margin-left:6px;font-size:13px;color:var(--muted)"></i>' +
        '<select onchange="' + onChangeFn + '(this.value)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-family:inherit">' + monthOpts + '</select>' +
        '</div>';
    html += nextMonth
        ? '<button type="button" onclick="' + onChangeFn + '(\'' + nextMonth + '\')" title="下一月" style="' + arrowOn + '"><i class="ti ti-chevron-right"></i></button>'
        : '<button type="button" disabled style="' + arrowOff + '"><i class="ti ti-chevron-right"></i></button>';
    html += '<span style="margin-left:auto;font-size:13px;color:var(--muted)">當月合計 <b style="color:' + signColor(monthPct) + ';font-size:16px">' + signPrefix(monthPct) + monthPct.toFixed(2) + '%</b></span>';
    html += '</div>';

    // 日曆網格（一~五 + 週合計）
    var ym = curMonth.split('-');
    var year = parseInt(ym[0], 10), monthIdx = parseInt(ym[1], 10) - 1;

    html += '<div style="display:grid;grid-template-columns:repeat(5,1fr) 70px;gap:4px;font-size:12px">';
    ['一','二','三','四','五'].forEach(function(w){
        html += '<div style="text-align:center;color:var(--muted);font-size:11px;padding:4px 0">' + w + '</div>';
    });
    html += '<div style="text-align:center;color:var(--muted);font-size:11px;padding:4px 0">週合計</div>';

    function _pctBg(p) {
        return p > 0 ? 'rgba(239,68,68,0.08)' : p < 0 ? 'rgba(22,163,74,0.08)' : 'transparent';
    }
    var weekList2 = _groupMonthByWeeks(year, monthIdx);
    weekList2.forEach(function(week) {
        var byDow = week.byDow;
        var weekAcc = 1, weekHasData = false;
        for (var dow = 1; dow <= 5; dow++) {
            var dayNum = byDow[dow];
            if (!dayNum) {
                html += '<div class="cal-cell cal-cell-empty cal-cell--sm"></div>';
                continue;
            }
            var dStr = year + '-' + String(monthIdx + 1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
            var entry = dailyPnL[dStr];
            if (entry) {
                weekAcc *= (1 + entry.pct / 100);
                weekHasData = true;
                var closeRow = (typeof entry.price === 'number')
                    ? '<div class="cal-cell-sub" style="color:var(--muted)">收 ' + entry.price.toFixed(2) + '</div>'
                    : '';
                // 量：有資料顯示張數；正在抓(loading)且這天還沒量 → 顯示「量 …」提示載入中(非永久空白)
                var volRow = '';
                if (volMap && typeof volMap[dStr] === 'number') {
                    volRow = '<div class="cal-cell-sub" style="color:var(--muted);font-weight:400">量 ' + fmt(volMap[dStr]) + '</div>';
                } else if (_vc && _vc.loading && !/^00/.test(String(stockId))) {
                    volRow = '<div class="cal-cell-sub" style="color:var(--muted-2);font-weight:400">量 …</div>';
                }
                html += '<div class="cal-cell cal-cell--sm" style="background:' + _pctBg(entry.pct) + '">' +
                    '<div class="cal-cell-day">' + dayNum + '</div>' +
                    '<div class="cal-cell-main" style="color:' + signColor(entry.pct) + '">' + signPrefix(entry.pct) + entry.pct.toFixed(2) + '%</div>' +
                    closeRow +
                    volRow +
                    '</div>';
            } else {
                html += '<div class="cal-cell cal-cell-blank cal-cell--sm">' + dayNum + '</div>';
            }
        }
        if (weekHasData) {
            var wPct = (weekAcc - 1) * 100;
            html += '<div class="cal-cell cal-cell-week-total cal-cell--sm">' +
                '<div class="cal-cell-main" style="color:' + signColor(wPct) + '">' + signPrefix(wPct) + wPct.toFixed(2) + '%</div>' +
                '</div>';
        } else {
            html += '<div class="cal-cell cal-cell-empty cal-cell--sm"></div>';
        }
    });
    html += '</div>';
    html += '<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6">※ 個股漲跌：純價格 % 漲跌（不含股數）。「收」為當日收盤價。週／月為複利累加。</div>';
    return html;
}
