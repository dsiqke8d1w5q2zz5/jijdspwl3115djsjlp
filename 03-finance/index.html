function _recordExport() {
    var now = _toROCDateTime(new Date());
    localStorage.setItem('finTracker_lastExport', now);
    updateLastExportLabel();
}

function updateLastExportLabel() {
    var el = document.getElementById('last-export');
    if (!el) return;
    var last = localStorage.getItem('finTracker_lastExport');
    el.textContent = last ? '上次匯出：' + last : '';
}

function importData(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        var d;
        try {
            d = JSON.parse(ev.target.result);
        } catch(err) {
            toast('匯入失敗：' + err.message, true);
            e.target.value = '';
            return;
        }
        _confirmAndImport('JSON', function() {
            // 新格式（含台股）
            if (d.finance && d.stock) {
                DATA = d.finance;
                stockData = d.stock;
                if (!stockData.holdings) stockData.holdings = [];
                if (!stockData.dividends) stockData.dividends = [];
                if (!stockData.pledges) stockData.pledges = [];
                if (!stockData.prices) stockData.prices = {};
                if (!stockData.trades) stockData.trades = [];
                delete stockData._loadFailed;
                _healDataStructure();
                saveData();
                saveStockData();
                render();
                toast('已匯入資料（含台股）');
                return;
            }
            // 舊格式（純財務）
            if (!d.settings || !d.income) { toast('檔案格式不正確', true); return; }
            DATA = d;
            _healDataStructure();
            saveData();
            render();
            toast('已匯入資料');
        });
    };
    reader.readAsText(file);
    e.target.value = '';
}

// 匯入前確認 + 自動備份
function _confirmAndImport(formatLabel, doImport) {
    var currentDivCount = (stockData && stockData.dividends && stockData.dividends.length) || 0;
    var msg = '即將從 ' + formatLabel + ' 匯入資料，將覆蓋現在所有內容。\n\n' +
              '目前股利紀錄：' + currentDivCount + ' 筆\n' +
              '\n確定要繼續嗎？（會自動備份現在的資料到快照）';

    showConfirm2(msg, function onYes() {
        try {
            // 匯入前自動備份
            try {
                localStorage.setItem('finTracker_autoBackup', JSON.stringify({
                    finance: DATA, stock: stockData, time: new Date().toISOString()
                }));
                var curRaw = localStorage.getItem(STOCK_KEY);
                if (curRaw) pushSnapshot(curRaw);
            } catch(_e) {}
            doImport();
        } catch(err) {
            toast('匯入失敗：' + err.message, true);
        }
    }, function onNo() {
        toast('已取消匯入');
    }, { title: '<i class="ti ti-download"></i> 確認匯入（' + formatLabel + '）', okText: '確定匯入', cancelText: '取消' });
}

// ── UI 工具 ──

// 延遲執行直到 DOM 準備好（用於初始化期間呼叫 modal）
// 比 setTimeout(fn, 0) 更可靠，因為初始化跑到 catch 時 body 可能還沒 append
function _whenReady(fn) {
    if (document.body && document.readyState !== 'loading') {
        fn();
    } else {
        document.addEventListener('DOMContentLoaded', fn, { once: true });
    }
}

// 自訂 alert：用 .overlay + .modal 樣式置中，取代瀏覽器原生 alert
function showAlert(msg, title) {
    var ov = document.createElement('div');
    ov.className = 'overlay';

        '<p style="font-size:14px;line-height:1.7;margin-bottom:14px">' + msgHtml + '</p>' +

}

// 通用自訂 confirm：置中、可自訂標題和按鈕文字、callback 模式
// options: { title, okText, cancelText, okStyle }
function showConfirm2(msg, onYes, onNo, options) {
    options = options || {};
    var title = options.title || '確認';
    var okText = options.okText || '確定';
    var cancelText = options.cancelText || '取消';
    var okStyle = options.okStyle || '';
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var msgHtml = msg.replace(/\n/g, '<br>');
    ov.innerHTML = '<div class="modal" style="max-width:440px;width:440px"><h3>' + title + '</h3>' +
        '<p style="font-size:14px;line-height:1.7;margin-bottom:14px;white-space:pre-wrap">' + msgHtml + '</p>' +
        '<div class="modal-btns"><button id="confirm2-no">' + esc(cancelText) + '</button>' +
        '<button class="btn-primary" id="confirm2-yes"' + (okStyle?' style="'+okStyle+'"':'') + '>' + esc(okText) + '</button></div></div>';
    document.body.appendChild(ov);
    document.getElementById('confirm2-yes').onclick = function() {
        ov.remove();
        if (onYes) onYes();
    };
    document.getElementById('confirm2-no').onclick = function() {
        ov.remove();
        if (onNo) onNo();
    };
}

function showModal(title, placeholder, defaultVal, onSave) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3>' +
        '<input type="text" id="modal-input" placeholder="' + esc(placeholder) + '" value="' + esc(defaultVal) + '">' +
        '<div class="modal-btns"><button onclick="this.closest(\'.overlay\').remove()">取消</button><button class="btn-primary" id="modal-save">確定</button></div></div>';
    document.body.appendChild(ov);
    var inp = document.getElementById('modal-input');
    inp.focus();
    document.getElementById('modal-save').onclick = function() {
        var val = inp.value.trim();
        ov.remove();
        onSave(val);

        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modal-save').click(); }
    };
    // 已移除點空白關閉行為（避免誤觸）
}

function toast(msg, isError) {
    var el = document.getElementById('toast');
    // 安全考量：純文字訊息一律走 textContent；若呼叫端確定要 HTML（含圖示），用 toastHtml()
    el.textContent = msg == null ? '' : String(msg);
    el.style.background = isError ? '#DC2626' : '#333';
    el.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}
// 需要顯示圖示等 HTML 的場合（內部安全字串），用此版本
function toastHtml(html, isError) {
    var el = document.getElementById('toast');
    el.innerHTML = html;
    el.style.background = isError ? '#DC2626' : '#333';
    el.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 把字串安全包成「可放進 onclick 屬性內的 JS 字串字面值」
// 用法：'onclick="renameCat(' + escJs(name) + ')"'
// 兩層防禦：先 \\、\\'、\\" 把 JS 特殊字元跳脫；再對 HTML 屬性的特殊字元 esc
// 這樣即使 name 含 ' 或 HTML 標籤，瀏覽器解析屬性、JS 引擎解析字串字面值都不會破壞語法
function escJs(s) {
    if (s === null || s === undefined) return "''";
    var jsStr = String(s)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\u0027")
        .replace(/"/g, '\\u0022')
        .replace(/</g, '\\u003c')
        .replace(/>/g, '\\u003e')
        .replace(/&/g, '\\u0026')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r');
    // 用 ' 包起來；裡頭已沒有 ' 也沒有 HTML 特殊字元
    return "'" + jsStr + "'";
}

// 小型確認框（取代原生 confirm）。opts: { danger: true 會把確定鈕變紅 }
function confirmAction(msg, onConfirm, opts) {
    opts = opts || {};
    var existing = document.getElementById('confirm-overlay');
    if (existing) existing.remove();
    var overlay = document.createElement('div');
    overlay.id = 'confirm-overlay';
    overlay.className = 'confirm-overlay';
    var box = document.createElement('div');
    box.className = 'confirm-box';
    box.onclick = function(e){ e.stopPropagation(); };
    box.innerHTML =
        '<div class="confirm-msg">' + msg + '</div>' +
        '<div class="confirm-btns">' +
            '<button type="button" class="cf-no">取消</button>' +
            '<button type="button" class="cf-yes' + (opts.danger ? ' danger' : '') + '">確定</button>' +
        '</div>';
    overlay.appendChild(box);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    box.querySelector('.cf-no').onclick = function(){ overlay.remove(); };
    box.querySelector('.cf-yes').onclick = function(){ overlay.remove(); try { onConfirm(); } catch(e) { console.error('[confirmAction]', e); } };
    // ESC 關閉
    var onKey = function(e){ if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
}

// 讀取輪替快照清單（陣列，每筆 {time, data}）
function getSnapshots() {
    try {
        var raw = localStorage.getItem(STOCK_SNAPSHOT_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
}

// 新增一份快照，最多保留 5 份（最舊的自動剔除）
// respectInterval=true：例行開頁載入用，距上一份未滿 6 小時就略過（拉長頻率，讓 5 份涵蓋更久）；
//   保護性備份（匯入前/還原前/雲端覆寫前）不傳此參數，一定拍。
var _SNAPSHOT_MIN_INTERVAL_MS = 6 * 3600 * 1000; // 6 小時
function pushSnapshot(rawJson, respectInterval) {
    try {
        var snaps = getSnapshots();
        // 若最新一份跟目前完全相同就不重複存
        if (snaps.length > 0 && snaps[snaps.length-1].data === rawJson) return;
        // 例行載入：距上一份未滿間隔就略過
        if (respectInterval && snaps.length > 0) {
            var lastT = new Date(snaps[snaps.length-1].time).getTime();
            if (!isNaN(lastT) && (Date.now() - lastT) < _SNAPSHOT_MIN_INTERVAL_MS) return;
        }
        snaps.push({ time: new Date().toISOString(), data: rawJson });
        while (snaps.length > 5) snaps.shift();
        localStorage.setItem(STOCK_SNAPSHOT_KEY, JSON.stringify(snaps));
    } catch(e) {
        console.warn('[pushSnapshot] 失敗:', e);
    }
}

function loadStockData() {
    var raw = localStorage.getItem(STOCK_KEY);
    // 空值 → 初次使用，給預設值（不寫回、不覆蓋任何東西）
    if (!raw) {
        stockData = { holdings: [], dividends: [], pledges: [], lastUpdate: null, prices: {}, trades: [] };
        return;
    }
    // 有資料 → 嘗試解析
    var parsed;
    try {
        parsed = JSON.parse(raw);
    } catch(e) {
        // ★ 不再清空 localStorage！保留原始損壞資料以便手動救援
        console.error('[loadStockData] JSON 解析失敗，原始資料保留於 localStorage:', e);
        // 等 DOM 準備好後再彈警告，比 setTimeout(0) 更可靠
        _whenReady(function(){
            showAlert('<i class="ti ti-alert-triangle"></i> 台股資料讀取失敗（JSON 損壞）！\n\n' +
                  '原始資料已保留在 localStorage，未被覆蓋。\n' +
                  '請立即：\n' +
                  '1. 不要繼續使用此頁面\n' +
                  '2. 開啟 Console（F12）檢查錯誤\n' +
                  '3. 聯絡開發者或嘗試從快照還原\n\n' +
                  '為了避免覆寫，台股功能將暫時顯示空白。', '<i class="ti ti-alert-triangle"></i> 資料讀取失敗');
        });
        // 給一個暫時的空資料，但標記為「未安全載入」，後續 save 會被阻擋
        stockData = { holdings: [], dividends: [], pledges: [], lastUpdate: null, prices: {}, trades: [], _loadFailed: true };
        return;
    }
    stockData = parsed;
    if (!stockData.holdings) stockData.holdings = [];
    if (!stockData.dividends) stockData.dividends = [];
    if (!stockData.pledges) stockData.pledges = [];
    if (!stockData.prices) stockData.prices = {};
    if (!stockData.trades) stockData.trades = [];
    // 自動修正舊格式日期 YYYYMMDD → YYYY-MM-DD
    function fixDate(s) {
        if (!s) return s;
        var v = String(s).replace(/\D/g, '');
        if (v.length === 8) return v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6,8);
        return s;
    }
    try {
        stockData.dividends.forEach(function(d){ d.date = fixDate(d.date); });
        stockData.pledges.forEach(function(p){ p.date = fixDate(p.date); });
    } catch(e) {
        // 日期修正失敗不致命，也不該清空資料
        console.warn('[loadStockData] 日期修正失敗:', e);
    }

    // ★ 大幅減少警告：比對上次啟動時的筆數，若少超過 3 筆就警告並優先還原
    var lastCount = parseInt(localStorage.getItem(STOCK_LAST_COUNT_KEY) || '0', 10);
    var nowCount = stockData.dividends.length;
    if (lastCount > 0 && nowCount < lastCount - 3) {
        var snaps = getSnapshots();
        var msg = '<i class="ti ti-alert-triangle"></i> 偵測到股利紀錄大幅減少！\n\n' +
                  '上次啟動時：' + lastCount + ' 筆\n' +
                  '現在只有：' + nowCount + ' 筆\n' +
                  '減少：' + (lastCount - nowCount) + ' 筆\n\n' +
                  '可用快照：' + snaps.length + ' 份\n\n' +
                  '按【鎖定防覆寫】→ 暫時阻擋儲存，讓你用【<i class="ti ti-shield-check"></i> 還原】救資料\n' +
                  '按【繼續載入】→ 承擔風險載入目前這份';
        // 預設先鎖定（安全），使用者按繼續才解除
        stockData._loadFailed = true;
        _whenReady(function(){
            showConfirm2(msg, function onYes() {
                // 鎖定防覆寫：什麼都不做，_loadFailed 保持 true
                toast('台股資料已鎖定，請用「<i class="ti ti-shield-check"></i> 還原」救援', true);
            }, function onNo() {
                // 繼續載入：解除鎖定
                delete stockData._loadFailed;
                // 存快照 + 更新筆數基準（例行載入，套 6 小時間隔）
                pushSnapshot(raw, true);
                localStorage.setItem(STOCK_LAST_COUNT_KEY, String(nowCount));
                renderStock();
            }, { title: '<i class="ti ti-alert-triangle"></i> 股利紀錄大幅減少', okText: '鎖定防覆寫', cancelText: '繼續載入' });
        });
        return;
    }

    // ★ 成功載入 → 存快照（輪替保留最近 5 份；例行載入套 6 小時間隔，拉長頻率）
    pushSnapshot(raw, true);
    // 更新「上次啟動筆數」基準
    localStorage.setItem(STOCK_LAST_COUNT_KEY, String(nowCount));
    // ★ 不再無條件 saveStockData()，避免任何意外覆寫
}

function saveStockData(opts) {
    // ★ 安全門：若載入時失敗，絕對不能寫回，避免把損壞/空資料覆蓋原始 localStorage
    if (stockData && stockData._loadFailed) {
        console.warn('[saveStockData] 已阻擋：載入失敗狀態下禁止寫入 localStorage');
        toast('已阻擋寫入：資料載入失敗，請先救援', true);
        return;
    }
    try {
        // 真實編輯（非背景價格/快照）才蓋台股編輯時間戳，供雲端衝突比對用
        if (!(opts && opts.skipCloudSync)) {
            stockData._stockEditAt = new Date().toISOString();
        }
        var json = JSON.stringify(stockData);
        localStorage.setItem(STOCK_KEY, json);
        // 同步更新筆數基準，讓「大幅減少警告」有依據
        try { localStorage.setItem(STOCK_LAST_COUNT_KEY, String(stockData.dividends.length)); } catch(_e) {}
        console.log('[saveStockData] 已存 dividends:', stockData.dividends.length, '筆，時間:', new Date().toLocaleTimeString());
    } catch(e) {
        console.error('[saveStockData] 失敗:', e);
        if (e && e.name === 'QuotaExceededError') {
            toast('儲存失敗：瀏覽器儲存空間已滿', true);
        } else {
            toast('儲存失敗：' + (e.message || '未知錯誤'), true);
        }
        return;
    }
    // 觸發雲端同步：把 stockData 變化也視為整體編輯，更新 _lastEditAt 並 schedule push
    // 預設行為；若為背景自動更新（價格抓取、自動快照等）可傳 {skipCloudSync:true} 跳過
    if (!(opts && opts.skipCloudSync)) {
        if (typeof DATA !== 'undefined' && DATA) DATA._lastEditAt = new Date().toISOString();
        try { localStorage.setItem('finTracker', JSON.stringify(DATA)); } catch(_e) {}
        if (typeof scheduleCloudSync === 'function') scheduleCloudSync();
        if (typeof _updateLastEditLabel === 'function') _updateLastEditLabel();
    }
}

// ── TWSE API（直接呼叫，有 CORS 支援）──
// 快取所有上市股票當日資料（代號→{name, price}）
var _twseAllCache = null;
var _twseAllCacheTime = 0;

function fetchTWSEAll(callback) {
    // 快取 3 分鐘
    if (_twseAllCache && (Date.now() - _twseAllCacheTime < 3 * 60 * 1000)) {
        callback(null, _twseAllCache);
        return;
    }
    fetchWithTimeout('https://www.twse.com.tw/exchangeReport/STOCK_DAY_ALL?response=json')
        .then(function(r) { return r.json(); })
        .then(function(json) {
            if (json.stat === 'OK' && json.data) {
                var map = {};
                json.data.forEach(function(row) {
                    // [代號, 名稱, 成交股數, 成交金額, 開盤價, 最高價, 最低價, 收盤價, 漲跌價差, 成交筆數]
                    var id = row[0].trim();
                    var name = row[1].trim();
                    var price = parseFloat(row[7].replace(/,/g, ''));
                    var change = parseFloat(row[8].replace(/,/g, '')) || 0;
                    if (!isNaN(price)) {
                        map[id] = { name: name, price: price, change: change };
                    }
                });
                _twseAllCache = map;
                _twseAllCacheTime = Date.now();
                callback(null, map);
            } else {
                callback('TWSE 無資料');
            }
        })
        .catch(function(err) { callback(err.message || '網路錯誤'); });
}

// ── TPEX API（上櫃 / 債券 ETF 批次查詢）──
var _tpexAllCache = null;
var _tpexAllCacheTime = 0;
function fetchTPEXAll(callback) {
    if (_tpexAllCache && (Date.now() - _tpexAllCacheTime < 3 * 60 * 1000)) {
        callback(null, _tpexAllCache);
        return;
    }
    // TPEX v1 OpenAPI：當日上櫃收盤行情
    fetchWithTimeout('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes')
        .then(function(r) { return r.json(); })
        .then(function(arr) {
            if (!Array.isArray(arr) || arr.length === 0) { callback('TPEX 無資料'); return; }
            var map = {};
            arr.forEach(function(row) {
                var id = String(row.SecuritiesCompanyCode || '').trim();
                if (!id) return;
                var name = _cleanStockName(row.CompanyName);
                var price = parseFloat(String(row.Close || '').replace(/,/g, ''));
                // Change 欄可能含漲跌符號（▲▼+-），抽出數字
                var chgRaw = String(row.Change || '');
                var chgMatch = chgRaw.match(/-?\d+(\.\d+)?/);
                var change = chgMatch ? parseFloat(chgMatch[0]) : 0;
                if (/[▼-]/.test(chgRaw) && change > 0) change = -change;
                if (!isNaN(price)) map[id] = { name: name, price: price, change: change };
            });
            if (!Object.keys(map).length) { callback('TPEX 無資料'); return; }
            _tpexAllCache = map;
            _tpexAllCacheTime = Date.now();
            callback(null, map);
        })
        .catch(function(err) { callback(err.message || 'TPEX 網路錯誤'); });
}

var _fundamentalsCache = {};

// localStorage 持久化（重開頁面立即顯示上次資料、不閃 loading；背景再抓最新，有變動才重畫）

        }

}
function _saveFundamentalsLS() {

        });

}
_loadFundamentalsLS();

// 取得目前股價（優先即時 prices，其次 priceHistory 末筆）
function _currentPriceFor(stockId) {
    var p = stockData.prices && stockData.prices[stockId];
    if (p && typeof p.price === 'number' && p.price > 0) return p.price;
    var ph = (stockData.priceHistory || {})[stockId];
    if (Array.isArray(ph) && ph.length) {
        var last = ph.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); })[ph.length-1];
        if (last && typeof last.price === 'number' && last.price > 0) return last.price;
    }
    return null;
}

// 季 EPS 的標籤：2026-03-31 → 26Q1
function _epsQuarterLabel(dateStr) {
    var p = String(dateStr).split('-');
    var y = parseInt(p[0],10), m = parseInt(p[1],10);
    if (isNaN(y) || isNaN(m)) return dateStr;
    var q = Math.ceil(m / 3);
    return String(y).slice(2) + 'Q' + q;
}

// 抓基本面：並行打 月營收 + 財報 兩個 dataset，算出所有指標後 callback
// callback(err, data, changed)：changed 表示與顯示中的舊資料相比有無實質變動
// 即使已有快取也在背景重抓最新（有變動才需重畫）；正在抓取中則不重複發
function fetchFundamentals(stockId, callback) {
    var cached = _fundamentalsCache[stockId];
    var hadData = !!(cached && cached.data);
    // 已有快取：先用快取立即回（changed=false）
    if (hadData) callback(null, cached.data, false);
    if (cached && cached.loading) return;
    // 快取仍新鮮（TTL 內）→ 跳過背景重抓，省 FinMind 額度
    if (_isCacheFresh(cached, _FUND_TTL)) return;
    var oldJson = hadData ? JSON.stringify(cached.data) : null;
    _fundamentalsCache[stockId] = hadData ? { data: cached.data, loading: true, fetchedAt: cached.fetchedAt } : { loading: true };

    var revUrl = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=' + stockId + '&start_date=2023-01-01');
    var finUrl = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockFinancialStatements&data_id=' + stockId + '&start_date=2023-01-01');
    var bsUrl = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockBalanceSheet&data_id=' + stockId + '&start_date=2023-01-01');
    // 官方 PER/PBR/殖利率（TWSE 版）：只需近幾日，取最新一筆
    var perStart = _localDateStr(new Date(Date.now() - 14 * 86400000));
    var perUrl = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPER&data_id=' + stockId + '&start_date=' + perStart);

    Promise.all([
        fetchWithTimeout(revUrl, {}, 15000).then(function(r){ return r.json(); }).catch(function(){ return null; }),
        fetchWithTimeout(finUrl, {}, 15000).then(function(r){ return r.json(); }).catch(function(){ return null; }),
        fetchWithTimeout(bsUrl, {}, 15000).then(function(r){ return r.json(); }).catch(function(){ return null; }),
        fetchWithTimeout(perUrl, {}, 15000).then(function(r){ return r.json(); }).catch(function(){ return null; })
    ]).then(function(res) {
        var revJson = res[0], finJson = res[1], bsJson = res[2], perJson = res[3];
        var data = _computeFundamentals(stockId, revJson, finJson, bsJson, perJson);
        var changed = JSON.stringify(data) !== oldJson;
        _fundamentalsCache[stockId] = { data: data, fetchedAt: Date.now() };
        _saveFundamentalsLS();
        // 首次（無舊資料）一定要回；有舊資料則只在變動時回（避免無謂重畫）
        if (!hadData || changed) callback(null, data, changed);
    }).catch(function(err) {
        // 抓失敗：保留舊資料（若有），不洗掉畫面
        if (hadData) { _fundamentalsCache[stockId] = { data: cached.data }; }
        else { _fundamentalsCache[stockId] = { error: String(err && err.message || err) }; callback(_fundamentalsCache[stockId].error, null, false); }
    });
}

// 把 FinMind 回傳整理成指標物件
function _computeFundamentals(stockId, revJson, finJson, bsJson, perJson) {
    var out = { stockId: stockId, revenue: null, revTrend: [], eps: [], epsTTM: null, per: null,
                grossMargin: null, opMargin: null, netMargin: null, marginQuarter: null, roe: null,
                debtRatio: null, currentRatio: null, bookValuePerShare: null, bsQuarter: null,
                perOfficial: null, pbrOfficial: null, dividendYield: null, perDate: null };

    // ── 月營收 ──
    var revRows = (revJson && revJson.status === 200 && Array.isArray(revJson.data)) ? revJson.data : [];
    if (revRows.length) {
        var revMap = {}; // 'YYYY-MM' → revenue
        revRows.forEach(function(r){
            var key = r.revenue_year + '-' + String(r.revenue_month).padStart(2,'0');
            revMap[key] = r.revenue;
        });
        var revKeys = Object.keys(revMap).sort();
        // 近 12 月趨勢（給迷你長條圖）
        out.revTrend = revKeys.slice(-12).map(function(k){ return { ym: k, value: revMap[k] }; });
        // 最新一月 + MoM + YoY
        var latestK = revKeys[revKeys.length - 1];
        var lp = latestK.split('-'); var ly = parseInt(lp[0],10), lm = parseInt(lp[1],10);
        var prevMK = ly + '-' + String(lm-1>=1?lm-1:12).padStart(2,'0');
        if (lm === 1) prevMK = (ly-1) + '-12';
        var prevYK = (ly-1) + '-' + String(lm).padStart(2,'0');
        var cur = revMap[latestK];
        out.revenue = {
            ym: latestK,
            value: cur,
            mom: revMap[prevMK] ? (cur/revMap[prevMK]-1)*100 : null,
            yoy: revMap[prevYK] ? (cur/revMap[prevYK]-1)*100 : null
        };
    }

    // ── 財報（季 EPS + 三率）──
    var finRows = (finJson && finJson.status === 200 && Array.isArray(finJson.data)) ? finJson.data : [];
    if (finRows.length) {
        var byDate = {}; // date → { EPS, Revenue, GrossProfit, OperatingIncome, IncomeAfterTaxes }
        finRows.forEach(function(r){
            if (!byDate[r.date]) byDate[r.date] = {};
            byDate[r.date][r.type] = r.value;
        });
        var dates = Object.keys(byDate).sort(); // 舊→新
        // 近四季 EPS（取最新 4 季）
        var epsSeq = dates.filter(function(d){ return typeof byDate[d].EPS === 'number'; });
        out.eps = epsSeq.slice(-4).map(function(d){ return { label: _epsQuarterLabel(d), value: byDate[d].EPS }; });
        if (out.eps.length === 4) {
            out.epsTTM = out.eps.reduce(function(s,e){ return s + e.value; }, 0);
        } else if (out.eps.length > 0) {
            // 不足 4 季也先加總（標示為非完整）
            out.epsTTM = out.eps.reduce(function(s,e){ return s + e.value; }, 0);
        }
        // 三率（用最新一季有 Revenue 的那季）
        var marginDates = dates.filter(function(d){ return typeof byDate[d].Revenue === 'number' && byDate[d].Revenue !== 0; });
        if (marginDates.length) {
            var md = marginDates[marginDates.length - 1];
            var rec = byDate[md];
            out.marginQuarter = _epsQuarterLabel(md);
            if (typeof rec.GrossProfit === 'number') out.grossMargin = rec.GrossProfit / rec.Revenue * 100;
            if (typeof rec.OperatingIncome === 'number') out.opMargin = rec.OperatingIncome / rec.Revenue * 100;
            if (typeof rec.IncomeAfterTaxes === 'number') out.netMargin = rec.IncomeAfterTaxes / rec.Revenue * 100;
        }
    }

    // ── 本益比 PER = 現價 / 近四季EPS（僅在 TTM > 0 時有意義）──
    var price = _currentPriceFor(stockId);
    if (price && out.epsTTM && out.epsTTM > 0) {
        out.per = price / out.epsTTM;
    }

    // ── ROE = 近四季淨利(TTM) / 最新股東權益 ──（財報拿淨利、資產負債表拿股東權益）
    var finRows2 = (finJson && finJson.status === 200 && Array.isArray(finJson.data)) ? finJson.data : [];
    var bsRows = (bsJson && bsJson.status === 200 && Array.isArray(bsJson.data)) ? bsJson.data : [];
    if (finRows2.length && bsRows.length) {
        var niByDate = {}; // date → 本期淨利
        finRows2.forEach(function(r){ if (r.type === 'IncomeAfterTaxes' && typeof r.value === 'number') niByDate[r.date] = r.value; });
        var eqByDate = {}; // date → 股東權益
        bsRows.forEach(function(r){ if (r.type === 'Equity' && typeof r.value === 'number') eqByDate[r.date] = r.value; });
        var niDates = Object.keys(niByDate).sort();
        var eqDates = Object.keys(eqByDate).sort();
        if (niDates.length >= 4 && eqDates.length) {
            var niTTM = niDates.slice(-4).reduce(function(s,d){ return s + niByDate[d]; }, 0);
            var latestEq = eqByDate[eqDates[eqDates.length - 1]];
            if (latestEq && latestEq > 0) {
                out.roe = niTTM / latestEq * 100;
            }
        }
    }

    // ── 財務體質：負債比 / 流動比 / 每股淨值（取最新一季資產負債表）──
    if (bsRows.length) {
        // 以最新日期那一季的各科目值
        var bsByDateType = {}; // date → {type:value}
        bsRows.forEach(function(r){
            if (typeof r.value !== 'number') return;
            if (!bsByDateType[r.date]) bsByDateType[r.date] = {};
            bsByDateType[r.date][r.type] = r.value;
        });
        var bsDates = Object.keys(bsByDateType).sort();
        if (bsDates.length) {
            var bq = bsByDateType[bsDates[bsDates.length - 1]];
            out.bsQuarter = _epsQuarterLabel(bsDates[bsDates.length - 1]);
            var totalAssets = bq.TotalAssets, totalLiab = bq.Liabilities, equity = bq.Equity, capital = bq.CapitalStock;
            // 負債比 = 總負債 / 總資產
            if (totalLiab != null && totalAssets > 0) out.debtRatio = totalLiab / totalAssets * 100;
            // 流動比 = 流動資產 / 流動負債
            if (bq.CurrentAssets != null && bq.CurrentLiabilities > 0) out.currentRatio = bq.CurrentAssets / bq.CurrentLiabilities * 100;
            // 每股淨值 = 股東權益 / 股數；股數 = 股本/10（面額10元）
            if (equity != null && capital > 0) out.bookValuePerShare = equity / (capital / 10);
        }
    }

    // ── 官方 PER / PBR / 殖利率（TWSE 版，取最新一筆）──
    var perRows = (perJson && perJson.status === 200 && Array.isArray(perJson.data)) ? perJson.data : [];
    if (perRows.length) {
        var pr = perRows[perRows.length - 1]; // 升冪，最後一筆最新
        if (typeof pr.PER === 'number') out.perOfficial = pr.PER;
        if (typeof pr.PBR === 'number') out.pbrOfficial = pr.PBR;
        if (typeof pr.dividend_yield === 'number') out.dividendYield = pr.dividend_yield;
        out.perDate = pr.date || null;
    }

    return out;
}

// 把 FinMind 法人/融資券/外資持股回傳整理成籌碼指標
function _computeChips(stockId, instJson, marginJson, shareJson) {
    var out = { stockId: stockId, date: null,
        foreign: null, trust: null, dealer: null,            // 最新一日買賣超（張）
        foreign5: null, trust5: null, dealer5: null,         // 近5日合計（張）
        instTotal: null, instTotal5: null,                   // 三大法人合計（當日 / 近5日）
        foreignStreak: 0, trustStreak: 0,                    // 連買(正)/連賣(負)天數
        foreignTrend: [], trustTrend: [],                    // 近 N 日外資／投信買賣超（張），畫趨勢條
        marginBalance: null, marginChange: null,             // 融資餘額(張) / 較前日增減
        shortBalance: null, shortChange: null,               // 融券餘額(張) / 較前日增減
        marginUsage: null, shortMarginRatio: null,           // 融資使用率% / 券資比%
        foreignHoldRatio: null, foreignHoldChange: null };   // 外資持股比例% / 較最早一筆變化(百分點)

    // ── 三大法人（單位：股 → 轉張，1張=1000股）──
    var instRows = (instJson && instJson.status === 200 && Array.isArray(instJson.data)) ? instJson.data : [];
    if (instRows.length) {
        // 依日期彙整：每日 { foreign, trust, dealer }（買賣超張數 = (buy-sell)/1000）
        var byDate = {};
        instRows.forEach(function(r){
            var d = r.date; if (!d) return;
            if (!byDate[d]) byDate[d] = { foreign: 0, trust: 0, dealer: 0 };
            var net = ((r.buy || 0) - (r.sell || 0)) / 1000;
            if (r.name === 'Foreign_Investor' || r.name === 'Foreign_Dealer_Self') byDate[d].foreign += net;
            else if (r.name === 'Investment_Trust') byDate[d].trust += net;
            else if (r.name === 'Dealer_self' || r.name === 'Dealer_Hedging') byDate[d].dealer += net;
        });
        var dates = Object.keys(byDate).sort(); // 舊→新
        if (dates.length) {
            var last = dates[dates.length - 1];
            out.date = last;
            out.foreign = Math.round(byDate[last].foreign);
            out.trust = Math.round(byDate[last].trust);
            out.dealer = Math.round(byDate[last].dealer);
            // 近 5 日合計
            var last5 = dates.slice(-5);
            out.foreign5 = Math.round(last5.reduce(function(s,d){ return s + byDate[d].foreign; }, 0));
            out.trust5 = Math.round(last5.reduce(function(s,d){ return s + byDate[d].trust; }, 0));
            out.dealer5 = Math.round(last5.reduce(function(s,d){ return s + byDate[d].dealer; }, 0));
            // 三大法人合計（當日 / 近5日）
            out.instTotal = out.foreign + out.trust + out.dealer;
            out.instTotal5 = out.foreign5 + out.trust5 + out.dealer5;
            // 連買/連賣天數（從最新往回，同號才累加；外資、投信各算）
            out.foreignStreak = _netStreak(dates, byDate, 'foreign');
            out.trustStreak = _netStreak(dates, byDate, 'trust');
            // 近 20 日外資／投信趨勢
            out.foreignTrend = dates.slice(-20).map(function(d){ return Math.round(byDate[d].foreign); });
            out.trustTrend = dates.slice(-20).map(function(d){ return Math.round(byDate[d].trust); });
        }
    }

    // ── 融資融券（單位：張）──
    var marginRows = (marginJson && marginJson.status === 200 && Array.isArray(marginJson.data)) ? marginJson.data : [];
    if (marginRows.length) {
        var mLast = marginRows[marginRows.length - 1]; // FinMind 已按日期升冪
        out.marginBalance = mLast.MarginPurchaseTodayBalance != null ? mLast.MarginPurchaseTodayBalance : null;
        if (mLast.MarginPurchaseTodayBalance != null && mLast.MarginPurchaseYesterdayBalance != null)
            out.marginChange = mLast.MarginPurchaseTodayBalance - mLast.MarginPurchaseYesterdayBalance;
        out.shortBalance = mLast.ShortSaleTodayBalance != null ? mLast.ShortSaleTodayBalance : null;
        if (mLast.ShortSaleTodayBalance != null && mLast.ShortSaleYesterdayBalance != null)
            out.shortChange = mLast.ShortSaleTodayBalance - mLast.ShortSaleYesterdayBalance;
        // 融資使用率 = 融資餘額 / 融資限額；券資比 = 融券餘額 / 融資餘額
        if (mLast.MarginPurchaseTodayBalance != null && mLast.MarginPurchaseLimit > 0)
            out.marginUsage = mLast.MarginPurchaseTodayBalance / mLast.MarginPurchaseLimit * 100;
        if (mLast.ShortSaleTodayBalance != null && mLast.MarginPurchaseTodayBalance > 0)
            out.shortMarginRatio = mLast.ShortSaleTodayBalance / mLast.MarginPurchaseTodayBalance * 100;
        if (!out.date && mLast.date) out.date = mLast.date;
    }

    // ── 外資持股比例（單位：%）──
    var shareRows = (shareJson && shareJson.status === 200 && Array.isArray(shareJson.data)) ? shareJson.data : [];
    if (shareRows.length) {
        var sLast = shareRows[shareRows.length - 1];
        if (typeof sLast.ForeignInvestmentSharesRatio === 'number') {
            out.foreignHoldRatio = sLast.ForeignInvestmentSharesRatio;
            // 與區間最早一筆相比的變化（百分點），看外資是加碼還減碼
            var sFirst = shareRows[0];
            if (typeof sFirst.ForeignInvestmentSharesRatio === 'number')
                out.foreignHoldChange = sLast.ForeignInvestmentSharesRatio - sFirst.ForeignInvestmentSharesRatio;
        }
    }
    return out;
}

// 連買/連賣天數：從最新往回數，同方向(正/負)連續幾天；回傳正數=連買、負數=連賣
function _netStreak(dates, byDate, key) {
    var streak = 0, sign = 0;
    for (var i = dates.length - 1; i >= 0; i--) {
        var v = byDate[dates[i]][key];
        var s = v > 0 ? 1 : (v < 0 ? -1 : 0);
        if (s === 0) break;
        if (sign === 0) sign = s;
        if (s !== sign) break;
        streak++;
    }
    return sign * streak;
}

// 透過 Apps Script proxy 打 Yahoo Finance（15 分鐘延遲、盤中有變化）
// 策略：先用 .TW（上市）打一輪，errors 的再用 .TWO（上櫃）打一輪
// 為了避免每次都重打 .TWO，會把成功命中 .TWO 的代號快取到 localStorage
// callback(filledIds[], notFoundIds[])
var _yahooTwoFlagKey = 'yahooTwoFlags';
function _getYahooTwoFlags() {
    try { return JSON.parse(localStorage.getItem(_yahooTwoFlagKey)) || {}; }
    catch(e) { return {}; }
}
function _setYahooTwoFlag(stockId) {
    var flags = _getYahooTwoFlags();
    flags[stockId] = true;
    try { localStorage.setItem(_yahooTwoFlagKey, JSON.stringify(flags)); } catch(e) {}
}
function _fetchYahooBatch(holdings, suffix, callback) {
    if (!holdings || holdings.length === 0) { callback([], []); return; }
    var codes = holdings.map(function(h){ return h.id + suffix; }).join(',');
    var url = CLOUD_URL + '?action=quote&format=json&codes=' + encodeURIComponent(codes) + '&t=' + Date.now();
    var now = function(){ return _toROCDateTime(new Date()); };
    fetchWithTimeout(url, {}, 15000)
        .then(function(r){ return r.json(); })
        .then(function(data){
            var quotes = (data && data.quotes) || {};
            var filled = [];
            var notFound = [];
            holdings.forEach(function(h){
                var q = quotes[h.id + suffix];
                if (q && typeof q.price === 'number') {
                    stockData.prices[h.id] = {
                        price: q.price,
                        change: q.change || 0,
                        date: now(),
                        source: 'yahoo',
                        srcTime: q.time || 0 // Yahoo 給的 unix timestamp（秒）
                    };
                    filled.push(h.id);
                } else {
                    notFound.push(h.id);
                }
            });
            callback(filled, notFound);
        })
        .catch(function(err){
            console.warn('[_fetchYahooBatch] failed:', err);
            callback([], holdings.map(function(h){ return h.id; }));
        });
}
function fetchYahooQuotes(holdings, callback) {
    if (!holdings || holdings.length === 0) { callback([], []); return; }
    if (typeof CLOUD_URL !== 'string' || !CLOUD_URL) { callback([], holdings.map(function(h){return h.id;})); return; }
    // 依快取分流：標記過 .TWO 的直接走 .TWO；其他先試 .TW
    var twoFlags = _getYahooTwoFlags();
    var goTwo = holdings.filter(function(h){ return twoFlags[h.id]; });
    var goTw  = holdings.filter(function(h){ return !twoFlags[h.id]; });

    _fetchYahooBatch(goTw, '.TW', function(twFilled, twNotFound) {
        // 第一輪沒命中的代號，併入 .TWO 批次再試
        var allTwoHoldings = goTwo.concat(holdings.filter(function(h){ return twNotFound.indexOf(h.id) >= 0; }));
        _fetchYahooBatch(allTwoHoldings, '.TWO', function(twoFilled, twoNotFound) {
            // 命中 .TWO 的標記起來，下次直接走 .TWO（省一輪）
            twoFilled.forEach(function(id){
                if (!twoFlags[id]) _setYahooTwoFlag(id);
            });
            callback(twFilled.concat(twoFilled), twoNotFound);
        });
    });
}

var _twseIndex = null;        // { price, change, pct, time }
var _twseIndexFetching = false;
function fetchTwseIndex(onDone) {
    if (typeof CLOUD_URL !== 'string' || !CLOUD_URL) { if (onDone) onDone(); return; }
    if (_twseIndexFetching) { if (onDone) onDone(); return; }
    _twseIndexFetching = true;
    var url = CLOUD_URL + '?action=quote&format=json&codes=' + encodeURIComponent('^TWII') + '&t=' + Date.now();
    fetchWithTimeout(url, {}, 12000)
        .then(function(r){ return r.json(); })

                _saveMarketInfoLS();
            }
            _twseIndexFetching = false;
            if (onDone) onDone();
        })
        .catch(function(){ _twseIndexFetching = false; if (onDone) onDone(); });
}

function fetchAllPrices(onDone) {
    if (stockData.holdings.length === 0) { if (onDone) onDone(); return; }
    // 先試 Yahoo（一個批次請求），剩下 Yahoo 沒料的再走 TWSE/TPEX/FinMind
    fetchYahooQuotes(stockData.holdings, function(filledIds, notFoundIds) {
        if (notFoundIds.length === 0) {
            // 全部都 Yahoo 拿到了
            stockData.lastUpdate = _toROCDateTime(new Date());

            if (onDone) onDone();
            return;

        fallbackTWSE(remaining, onDone);
    });

// 清除 TWSE/TPEX 偶發的 unicode surrogate 亂碼 + replacement char
function _cleanStockName(s) {
    if (!s) return '';
    return String(s).replace(/[\uD800-\uDFFF�]/g, '').trim();
}
function _hasBrokenName(s) {
    return !!s && /[\uD800-\uDFFF�]/.test(String(s));
}
function fallbackTWSE(holdings, onDone) {
    function needsName(h) {
        return !h.name || h.name === h.id || h.name === '查詢中...' || _hasBrokenName(h.name);
    }
    var now = function(){ return _toROCDateTime(new Date()); };
    var flags = getFinMindFlags();
    // 標記過 FinMind 的先分離出來
    var finmindOnly = holdings.filter(function(h){ return flags[h.id]; });
    var rest = holdings.filter(function(h){ return !flags[h.id]; });

    fetchTWSEAll(function(err, twseMap) {
        twseMap = twseMap || {};
        // 第 1 級：TWSE
        var needTPEX = [];
        rest.forEach(function(h){
            if (twseMap[h.id]) {
                stockData.prices[h.id] = { price: twseMap[h.id].price, change: twseMap[h.id].change || 0, date: now() };
                if (needsName(h)) h.name = _cleanStockName(twseMap[h.id].name) || h.id;
            } else {
                needTPEX.push(h);
            }
        });

        // 第 2 級：TPEX
        fetchTPEXAll(function(tpxErr, tpxMap) {
            tpxMap = tpxMap || {};
            var needFinMind = finmindOnly.slice();
            needTPEX.forEach(function(h){
                if (tpxMap[h.id]) {
                    stockData.prices[h.id] = { price: tpxMap[h.id].price, change: tpxMap[h.id].change || 0, date: now() };
                    if (needsName(h)) h.name = _cleanStockName(tpxMap[h.id].name) || h.id;
                } else {
                    setFinMindFlag(h.id); // 下次直接走 FinMind
                    needFinMind.push(h);
                }
            });

            if (needFinMind.length === 0) {
                stockData.lastUpdate = now();
                saveStockData({ skipCloudSync: true }); // 背景抓股價，不觸發雲端同步
                if (onDone) onDone();
                return;
            }

            // 第 3 級：FinMind 逐筆
            var pending = needFinMind.length;
            var errors = [];
            needFinMind.forEach(function(h) {
                fetchFinMind(h.id, function(fErr, price, name, change) {
                    if (!fErr && price) {
                        stockData.prices[h.id] = { price: price, change: change || 0, date: now() };
                        if (name && needsName(h)) h.name = _cleanStockName(name) || h.id;
                    } else {
                        errors.push(h.id + ': ' + (fErr || '無資料'));
                    }
                    pending--;
                    if (pending <= 0) {
                        stockData.lastUpdate = now();
                        saveStockData({ skipCloudSync: true }); // 背景抓股價，不觸發雲端同步
                        if (onDone) onDone(errors.length > 0 ? errors : null);
                    }
                });
            });
        });
    });
}

// ── 查詢股票名稱（三層：TWSE → TPEX → FinMind）──
function lookupStockName(stockId, callback) {
    fetchTWSEAll(function(err, twseMap) {
        if (!err && twseMap && twseMap[stockId]) { callback(null, twseMap[stockId].name); return; }
        fetchTPEXAll(function(e2, tpxMap) {
            if (!e2 && tpxMap && tpxMap[stockId]) { callback(null, tpxMap[stockId].name); return; }
            fetchFinMindName(stockId, function(name) {
                if (name) callback(null, name);
                else callback('查無此股票');
            });
        });
    });
}

function bindBrokerDrag(listEl, brokers) {
    if (!listEl) return;
    var dragging = null, startY = 0, originalIdx = -1, placeholder = null;
    var working = brokers.slice();
    listEl.querySelectorAll('.brk-drag-handle').forEach(function(handle) {
        handle.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            var row = handle.closest('.brk-drag-row');
            if (!row) return;
            dragging = row;
            originalIdx = parseInt(row.dataset.idx, 10);
            startY = e.clientY;
            var rect = row.getBoundingClientRect();
            placeholder = document.createElement('div');
            placeholder.style.height = rect.height + 'px';
            placeholder.style.background = 'rgba(200,164,90,0.15)';
            placeholder.style.borderBottom = '1px solid var(--border)';
            row.parentNode.insertBefore(placeholder, row);
            row.style.position = 'fixed';
            row.style.left = rect.left + 'px';
            row.style.top = rect.top + 'px';
            row.style.width = rect.width + 'px';
            row.style.zIndex = '300';
            row.style.boxShadow = '0 8px 24px rgba(0,0,0,0.2)';
            row.style.opacity = '0.95';
            handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener('pointermove', function(e) {
            if (!dragging) return;
            var dy = e.clientY - startY;
            dragging.style.top = (parseFloat(dragging.style.top) + dy) + 'px';
            startY = e.clientY;
            var siblings = listEl.querySelectorAll('.brk-drag-row');
            var insertBefore = null;
            for (var i = 0; i < siblings.length; i++) {
                var s = siblings[i];
                if (s === dragging) continue;
                var r = s.getBoundingClientRect();
                if (e.clientY < r.top + r.height / 2) { insertBefore = s; break; }
            }
            if (insertBefore) listEl.insertBefore(placeholder, insertBefore);
            else listEl.appendChild(placeholder);
        });
        function endDrag() {
            if (!dragging) return;
            var allChildren = Array.prototype.slice.call(listEl.children);
            var placeholderIdx = allChildren.indexOf(placeholder);
            var draggingIdx = allChildren.indexOf(dragging);
            var newIdx = placeholderIdx;
            if (draggingIdx >= 0 && draggingIdx < placeholderIdx) newIdx--;
            dragging.style.position = '';
            dragging.style.left = '';
            dragging.style.top = '';
            dragging.style.width = '';
            dragging.style.zIndex = '';
            dragging.style.boxShadow = '';
            dragging.style.opacity = '';
            placeholder.parentNode.insertBefore(dragging, placeholder);
            placeholder.remove();
            placeholder = null;
            if (newIdx !== originalIdx && newIdx >= 0) {
                var item = working.splice(originalIdx, 1)[0];
                working.splice(newIdx, 0, item);
                saveBrokerOrder(working);
                // 重新編號 data-idx
                Array.prototype.slice.call(listEl.querySelectorAll('.brk-drag-row')).forEach(function(r, i){ r.dataset.idx = i; });
            }
            dragging = null;
            originalIdx = -1;
        }
        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
    });
}

// 券商改名：把所有持股上的舊名換成新名，並同步更新 brokerOrder / 鎖定值
function renameBroker(oldName) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" style="max-width:380px"><h3><i class="ti ti-pencil"></i> 券商改名</h3>' +
        '<p style="font-size:13px;color:var(--muted);margin-bottom:8px">把「' + esc(oldName) + '」改成：</p>' +
        '<input type="text" id="brk-rename-input" value="' + esc(oldName) + '" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px">' +
        '<div class="modal-btns" style="margin-top:12px"><button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
        '<button class="btn-primary" id="brk-rename-ok">確定</button></div></div>';
    document.body.appendChild(ov);
    var input = document.getElementById('brk-rename-input');
    input.focus(); input.select();
    document.getElementById('brk-rename-ok').onclick = function() {
        var newName = (input.value || '').trim();
        if (!newName) { toast('名稱不可空白', true); return; }
        if (newName === oldName) { ov.remove(); return; }
        var n = 0;
        (stockData.holdings || []).forEach(function(h){
            if (h && (h.broker || '').trim() === oldName) { h.broker = newName; n++; }
        });
        // 同步 brokerOrder
        try {
            var order = JSON.parse(localStorage.getItem('brokerOrder') || '[]');
            order = order.map(function(b){ return b === oldName ? newName : b; });
            saveBrokerOrder(order);
        } catch(e) {}
        // 同步鎖定值與目前過濾
        if (lockedBroker === oldName) { lockedBroker = newName; try { localStorage.setItem('lockedBroker', newName); } catch(e) {} }
        if (currentBroker === oldName) currentBroker = newName;
        saveStockData();
        ov.remove();
        // 關掉管理視窗重開以刷新清單
        var mgr = document.querySelector('.overlay');
        if (mgr) mgr.remove();
        renderStock();
        openBrokerManageModal();
        toast('已將 ' + n + ' 檔持股的券商改為「' + newName + '」');
    };
}

// 刪除券商：把持股的 broker 清空（持股保留）。用 showConfirm2 二次確認，避免誤刪
function deleteBroker(name) {
    var cnt = _brokerHoldingCount(name);
    showConfirm2(
        '確定刪除券商「' + name + '」？\n\n會把這 ' + cnt + ' 檔持股的券商欄清空（持股本身不會刪），之後歸入「全部券商」檢視。',
        function() {
            var n = 0;
            (stockData.holdings || []).forEach(function(h){
                if (h && (h.broker || '').trim() === name) { h.broker = ''; n++; }
            });
            // 從 brokerOrder 移除
            try {
                var order = JSON.parse(localStorage.getItem('brokerOrder') || '[]');
                order = order.filter(function(b){ return b !== name; });
                saveBrokerOrder(order);
            } catch(e) {}
            // 鎖定值/目前過濾若指向被刪券商 → 退回全部
            if (lockedBroker === name) { lockedBroker = ''; try { localStorage.removeItem('lockedBroker'); } catch(e) {} }
            if (currentBroker === name) currentBroker = '';
            saveStockData();
            // 關掉管理視窗重開以刷新
            var mgr = document.querySelector('.overlay');
            if (mgr) mgr.remove();
            renderStock();
            openBrokerManageModal();
            toast('已刪除券商「' + name + '」，' + n + ' 檔持股的券商已清空');

}

// 從 holdings 撈出曾用過的券商清單（去重、去空白）
// 依使用者自訂順序排序（localStorage.brokerOrder），未排序的依字典序排在後面
function getKnownBrokers() {
    var set = {};
    var list = [];
    ((stockData && stockData.holdings) || []).forEach(function(h){
        var b = (h && h.broker) ? String(h.broker).trim() : '';
        if (b && !set[b]) { set[b] = true; list.push(b); }
    });
    var order = [];
    try { order = JSON.parse(localStorage.getItem('brokerOrder') || '[]'); } catch(e) {}
    var orderMap = {};
    order.forEach(function(b, i){ orderMap[b] = i; });
    list.sort(function(a, b) {
        var ai = orderMap[a], bi = orderMap[b];
        if (ai !== undefined && bi !== undefined) return ai - bi;
        if (ai !== undefined) return -1;
        if (bi !== undefined) return 1;
        return a.localeCompare(b);
    });
    return list;
}
function saveBrokerOrder(list) {
    try { localStorage.setItem('brokerOrder', JSON.stringify(list)); } catch(e) {}
}
function getHoldingAssetType(h) {
    if (h && h.assetType) return h.assetType;
    return guessAssetType(h && h.id);
}
function getHoldingRegion(h) {
    if (h && h.region) return h.region;
    return '台灣';
}

// 賣出持股 modal：填股數、股價、日期、成本（預設帶入「賣出股數 × 目前均價」可改），即時算已實現損益
function sellHolding(idx) {
    var h = stockData.holdings[idx];
    if (!h) return;
    if (!h.shares || h.shares <= 0) {
        toast('沒有可賣出的股數');
        return;
    }
    var p = stockData.prices && stockData.prices[h.id];
    var defaultPrice = (p && typeof p.price === 'number') ? p.price.toFixed(2) : '';
    var today = new Date();
    var todayStr = today.getFullYear() + '-' +
        String(today.getMonth()+1).padStart(2,'0') + '-' +
        String(today.getDate()).padStart(2,'0');
    var defaultCost = Math.round(h.shares * h.cost);

    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal"><h3>賣出 - ' + esc(h.name) + '（' + esc(h.id) + '）</h3>' +
        '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">目前持有 <b style="color:var(--text)">' + fmt(h.shares) + '</b> 股，均價 <b style="color:var(--text)">' + h.cost.toFixed(2) + '</b></div>' +

        '<input type="number" id="sell-price" value="' + defaultPrice + '" step="0.01" placeholder="例：50.5">' +
        '<label class="req" style="font-size:12px;color:var(--muted)">賣出日期</label>' +
        '<input type="date" id="sell-date" value="' + todayStr + '">' +
        '<label class="req" style="font-size:12px;color:var(--muted)">成本（賣出部分對應的成本，可手動編輯）</label>' +
        '<input type="number" id="sell-cost" value="' + defaultCost + '" step="1">' +
        '<label class="req" style="font-size:12px;color:var(--muted)">已實現損益（自動算「股數×價 − 成本」，可手動覆寫填扣完手續費／證交稅的實際數）</label>' +
        '<input type="number" id="sell-realized" step="1">' +
        '<div class="modal-btns" style="margin-top:12px">' +
            '<button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
            '<button class="btn-primary" id="sell-confirm">確認賣出</button>' +
        '</div></div>';
    document.body.appendChild(ov);

    var $shares = document.getElementById('sell-shares');
    var $price = document.getElementById('sell-price');
    var $cost = document.getElementById('sell-cost');
    var $realized = document.getElementById('sell-realized');
    var costEdited = false;
    var realizedEdited = false;
    $cost.addEventListener('input', function(){ costEdited = true; updatePreview(); });
    $realized.addEventListener('input', function(){ realizedEdited = true; });
    function updatePreview() {
        var sh = parseInt($shares.value) || 0;
        var pr = parseFloat($price.value);
        // 成本未手動編輯時，自動跟著股數比例算
        if (!costEdited) {
            var autoCost = Math.round(sh * h.cost);
            if (String(autoCost) !== $cost.value) $cost.value = autoCost;
        }
        var c = parseFloat($cost.value);
        // 已實現損益未手動編輯時，自動跟著「股數×價 − 成本」算
        if (!realizedEdited && sh > 0 && !isNaN(pr) && !isNaN(c)) {
            var autoR = Math.round(sh * pr - c);
            if (String(autoR) !== $realized.value) $realized.value = autoR;
        }
    }
    $shares.addEventListener('input', updatePreview);
    $price.addEventListener('input', updatePreview);
    updatePreview();

    document.getElementById('sell-confirm').onclick = function() {
        var sh = parseInt($shares.value) || 0;
        var pr = parseFloat($price.value);
        var c = parseFloat($cost.value);
        var realized = parseFloat($realized.value);
        var date = document.getElementById('sell-date').value || todayStr;
        if (sh <= 0 || sh > h.shares) { toast('賣出股數錯誤'); return; }
        if (isNaN(pr) || pr <= 0) { toast('請輸入賣出股價'); return; }
        if (isNaN(c)) { toast('請輸入成本'); return; }
        if (isNaN(realized)) { toast('請輸入已實現損益'); return; }
        var msg = '確認賣出 ' + esc(h.name) + '（' + esc(h.id) + '）？\n\n' +
            '股數：' + fmt(sh) + ' 股\n' +
            '股價：' + pr.toFixed(2) + '\n' +
            '日期：' + date + '\n' +
            '已實現損益：' + (realized >= 0 ? '+' : '') + fmt(realized) + '\n\n' +
            (sh === h.shares ? '⚠ 將清空此持股部位（trades 紀錄保留）' : '剩餘股數：' + fmt(h.shares - sh));
        showConfirm2(msg, function() {
            if (!Array.isArray(stockData.trades)) stockData.trades = [];
            stockData.trades.push({
                date: date,
                id: h.id,
                name: h.name,
                type: 'sell',
                shares: sh,
                price: pr,
                cost: c,
                realized: realized
            });
            h.shares -= sh;
            try { _syncTradesToCashflow(); saveData(true); } catch(e){ console.error('[syncTrades]', e); }
            saveStockData();
            ov.remove();
            renderStock();
            toast('已賣出 ' + sh + ' 股，' + (realized >= 0 ? '獲利 +' : '虧損 ') + fmt(realized));
        }, null, { title: '確認賣出', okText: '確認賣出', okStyle: 'background:var(--red)' });
    };
}

// 跌幅分批試算 modal：輸入股價 → 列出 -1% ~ -10% 對應價
function showDropCalcModal() {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" style="width:480px;max-width:94vw">' +
        '<h3 style="margin:0 0 12px"><i class="ti ti-calculator"></i> 跌幅分批試算</h3>' +
        '<label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">基準股價</label>' +
        '<input type="number" id="drop-calc-input" placeholder="輸入股價，例如 100" step="0.01" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:16px">' +
        '<div id="drop-calc-result" style="margin-top:12px"></div>' +
        '<div class="modal-btns" style="margin-top:12px"><button onclick="this.closest(\'.overlay\').remove()" style="flex:1">關閉</button></div>' +
        '</div>';
    document.body.appendChild(ov);
    var _md = false;
    ov.addEventListener('mousedown', function(e){ _md = (e.target === ov); });
    ov.addEventListener('click', function(e){ if (e.target === ov && _md) ov.remove(); _md = false; });
    var input = document.getElementById('drop-calc-input');
    var resBox = document.getElementById('drop-calc-result');
    input.focus();
    // 台股檔位：依股價區間決定最小跳動單位
    function _tickSize(price) {
        if (price < 10) return 0.01;
        if (price < 50) return 0.05;
        if (price < 100) return 0.1;
        if (price < 500) return 0.5;
        if (price < 1000) return 1;
        return 5;
    }
    // 向下取到最接近的合法檔位（用於分批掛買參考價，掛低一點）
    function _floorToTick(price) {
        var t = _tickSize(price);
        // 用整數運算避免浮點誤差（t 最小 0.01，乘 100 後為整數）
        var scale = 100;
        return Math.floor((price * scale) / (t * scale)) * t;
    }
    // 向上取到合法檔位（用於「跌停價」）。台股跌停＝基準×0.9 後，取「符合升降單位且≥理論價」的
    // 最接近價位（往上進位），確保跌幅不超過 10%。例：153×0.9=137.7，檔位0.5 → 138.0（非 137.5）。
    function _ceilToTick(price) {
        var t = _tickSize(price);
        var scale = 100;
        // 浮點容差：理論價已落在檔位上時不要被誤進一檔
        var n = (price * scale) / (t * scale);
        var r = Math.ceil(n - 1e-9);
        return r * t;
    }
    function _fmtTick(price) {
        return price < 10 ? price.toFixed(2) : (price < 100 ? price.toFixed(2) : price.toFixed(1));
    }
    input.addEventListener('input', function(){
        var p = parseFloat(input.value);
        if (!p || p <= 0) { resBox.innerHTML = ''; return; }
        var html = '<table style="width:100%;border-collapse:collapse;font-size:14px">' +
            '<thead><tr style="background:rgba(0,0,0,0.03);color:var(--muted);font-size:12px">' +
                '<th style="text-align:left;padding:6px 8px">跌幅</th>' +
                '<th style="text-align:right;padding:6px 8px">股價</th>' +
                '<th style="text-align:right;padding:6px 8px">可下單價</th>' +
                '<th style="text-align:right;padding:6px 8px">差額</th>' +
            '</tr></thead><tbody>';
        for (var i = 1; i <= 10; i++) {
            var price = p * (1 - i / 100);
            var isLimit = (i === 10);
            // 跌停（-10%）用法定算法（向上取整到檔位，跌幅不超過10%）；其餘為分批掛買參考價，向下取整（掛低一點）
            var orderPrice = isLimit ? _ceilToTick(price) : _floorToTick(price);
            var diff = orderPrice - p;
            var bg = isLimit ? 'background:var(--green);color:#fff;font-weight:700' : '';
            var subColor = isLimit ? '#fff' : 'var(--green)';
            html += '<tr style="border-top:1px solid var(--border);' + bg + '">' +
                '<td style="padding:8px 8px">-' + i + '%' + (isLimit ? '（跌停）' : '') + '</td>' +
                '<td style="text-align:right;padding:8px 8px;color:' + (isLimit ? '#fff' : 'var(--muted)') + '">' + price.toFixed(2) + '</td>' +
                '<td style="text-align:right;padding:8px 8px;font-weight:700">' + _fmtTick(orderPrice) + '</td>' +
                '<td style="text-align:right;padding:8px 8px;color:' + subColor + '">' + diff.toFixed(2) + '</td>' +
                '</tr>';
        }
        html += '</tbody></table>' +
            '<div style="margin-top:8px;font-size:11px;color:var(--muted);line-height:1.5">' +
            '檔位：<10 元 0.01／<50 元 0.05／<100 元 0.1／<500 元 0.5／<1000 元 1／≥1000 元 5。-1%～-9% 為分批掛買參考（向下取整）；跌停價依台股法定算法（基準×0.9 後向上取整到檔位，確保跌幅不超過 10%）。' +
            '</div>';
        resBox.innerHTML = html;
    });
}

// ── 股利管理 ──

// 把西元日期 YYYY-MM-DD 轉成 {rocYear, month}（民國年 + 月）
function _parseDividendDate(dateStr) {
    if (!dateStr) return null;
    var m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    var year = parseInt(m[1], 10);
    var month = parseInt(m[2], 10);
    if (isNaN(year) || isNaN(month)) return null;
    return { rocYear: String(year - 1911), month: month };
}

// 確保 DATA.passive[year][source][month] 結構存在；缺的都自動建
// 所有 income/expense/passive 都是 {年: {分類: {1..12: 數字}}} 的月結構
function _ensurePassiveSlot(rocYear, source) {
    var years = DATA.settings.years || [];
    if (years.indexOf(rocYear) < 0) {
        DATA.settings.years.push(rocYear);
        DATA.settings.years.sort();
        if (!DATA.income[rocYear]) DATA.income[rocYear] = {};
        if (!DATA.expense[rocYear]) DATA.expense[rocYear] = {};
        if (!DATA.passive[rocYear]) DATA.passive[rocYear] = {};
        (DATA.settings.incomeCategories || []).forEach(function(c){
            var name = typeof c === 'string' ? c : c.name;
            DATA.income[rocYear][name] = _ensureMonths(DATA.income[rocYear][name]);
        });
        (DATA.settings.expenseCategories || []).forEach(function(c){
            var name = typeof c === 'string' ? c : c.name;
            DATA.expense[rocYear][name] = _ensureMonths(DATA.expense[rocYear][name]);
        });
        (DATA.settings.passiveSources || []).forEach(function(s){
            var name = typeof s === 'string' ? s : s.name;
            DATA.passive[rocYear][name] = _ensureMonths(DATA.passive[rocYear][name]);
        });
    }
    var sources = (DATA.settings.passiveSources || []).map(function(s){ return typeof s === 'string' ? s : s.name; });
    if (sources.indexOf(source) < 0) {
        DATA.settings.passiveSources.push({ name: source, memo: '' });
        (DATA.settings.years || []).forEach(function(y){
            if (!DATA.passive[y]) DATA.passive[y] = {};
            DATA.passive[y][source] = _ensureMonths(DATA.passive[y][source]);
        });
    }
    if (!DATA.passive[rocYear]) DATA.passive[rocYear] = {};
    DATA.passive[rocYear][source] = _ensureMonths(DATA.passive[rocYear][source]);
}

// 將金額加到/減去被動收入的股利欄位
// delta 為正 = 累加；為負 = 扣除
// 回傳 true = 同步成功；false = 未同步（不存在日期 / 扣除會變負 / 金額無效）
function _applyDividendToPassive(dateStr, cash, delta) {
    if (!cash || cash <= 0) return false;
    var d = _parseDividendDate(dateStr);
    if (!d) return false;
    _ensurePassiveSlot(d.rocYear, '股利');
    var cur = DATA.passive[d.rocYear]['股利'][d.month] || 0;
    var next = cur + delta * cash;
    // ★ 扣除時若會變負，代表使用者已手動下調過該月股利數字
    // 直接扣會破壞使用者的手動調整，停止同步並警告
    if (next < 0) {
        console.warn('[_applyDividendToPassive] 扣除會使被動收入股利變負，已停止同步。' +
                     '民國 ' + d.rocYear + '/' + d.month + ' 當前:' + cur + '，欲扣除:' + cash);
        toastHtml('<i class="ti ti-alert-triangle"></i> 被動收入股利已被手動調整，此次未同步反向扣除（避免數字錯亂）', true);
        return false;
    }
    DATA.passive[d.rocYear]['股利'][d.month] = next;
    saveData();
    return true;
}

// 將金額加到/減去「收入→股利」分類（月結構：加到發放月份）
// 此為舊版同步函式的月化重寫，與頂部版本相同
function _applyDividendToIncome(dateStr, cash, delta) {
    if (!cash || cash <= 0) return false;
    var d = _parseDividendDate(dateStr);
    if (!d) return false;
    var cats = DATA.settings.incomeCategories || [];
    var hasDiv = cats.some(function(c){ return (typeof c === 'string' ? c : c.name) === '股利'; });
    if (!hasDiv) {
        DATA.settings.incomeCategories.push('股利');
        (DATA.settings.years || []).forEach(function(y){
            if (!DATA.income[y]) DATA.income[y] = {};
            if (DATA.income[y]['股利'] === undefined) DATA.income[y]['股利'] = _emptyMonths();
        });
    }
    if (!DATA.income[d.rocYear]) DATA.income[d.rocYear] = {};
    DATA.income[d.rocYear]['股利'] = _ensureMonths(DATA.income[d.rocYear]['股利']);
    var cur = DATA.income[d.rocYear]['股利'][d.month] || 0;
    var next = cur + delta * cash;
    if (next < 0) {
        if (typeof toastHtml === 'function') toastHtml('<i class="ti ti-alert-triangle"></i> 收入股利已被手動調整，此次未同步反向扣除（避免數字錯亂）', true);
        return false;
    }
    DATA.income[d.rocYear]['股利'][d.month] = next;
    saveData();
    return true;
}

        '<div class="modal-btns"><button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
        '<button class="btn-primary" id="div-save">確定</button></div></div>';

        var stockId = document.getElementById('div-stock').value;
        var date = document.getElementById('div-date').value;
        var cash = parseFloat(document.getElementById('div-cash').value) || 0;
        var cashPerShare = parseFloat(document.getElementById('div-cash-per-share').value) || 0;
        var stockShares = parseFloat(document.getElementById('div-stock-shares').value) || 0;
        if (!stockId) { toast('請選擇股票', true); return; }
        if (!date) { toast('請選擇日期', true); return; }
        if (cash <= 0 && stockShares <= 0) { toast('請輸入股利金額', true); return; }

        var newRecord = {
            stockId: stockId,
            stockName: holding ? holding.name : stockId,
            date: date,
            cash: cash,
            cashPerShare: cashPerShare,
            stockShares: stockShares
        };
        // 同步加到被動收入（只同步現金股利，股票股利不計入）
        var synced = _applyDividendToPassive(date, cash, +1);
        if (synced) newRecord._syncedToPassive = true;
        // 同步加到「收入→股利」分類
        var syncedInc = _applyDividendToIncome(date, cash, +1);

        stockData.dividends.sort(function(a,b){ return b.date.localeCompare(a.date); });
        saveStockData();
        ov.remove();
        renderStock();
        if (currentTab === 'passive') renderPassive();
        if (currentTab === 'income') renderIncomeExpense('income');
        if (synced) {
            var d = _parseDividendDate(date);
            toast('已新增股利，並同步至被動收入 ' + d.rocYear + '/' + d.month + ' 股利 +' + Math.round(cash).toLocaleString());
        } else {
            toast('已新增股利紀錄');
        }
    };
    // 已移除點空白關閉行為（避免誤觸）
}

function deleteDividend(idx) {
    showConfirm('確定刪除此筆股利紀錄？', function() {
        var rec = stockData.dividends[idx];
        var wasSynced = rec && rec._syncedToPassive && rec.cash > 0;
        var wasSyncedInc = rec && rec._syncedToIncome && rec.cash > 0;
        var reverted = false;
        // 只有有同步標記的才反向扣除被動收入，避免誤動使用者手動填的數字
        if (wasSynced) {
            reverted = _applyDividendToPassive(rec.date, rec.cash, -1);
        }
        if (wasSyncedInc) {
            _applyDividendToIncome(rec.date, rec.cash, -1);
        }
        stockData.dividends.splice(idx, 1);
        saveStockData();
        renderStock();
        if (currentTab === 'passive') renderPassive();
        if (currentTab === 'income') renderIncomeExpense('income');
        if (reverted) {
            var d = _parseDividendDate(rec.date);
            toast('已刪除股利，並從被動收入 ' + d.rocYear + '/' + d.month + ' 股利 -' + Math.round(rec.cash).toLocaleString());
        } else if (!wasSynced) {
            toast('已刪除股利紀錄');
        }
        // 若 wasSynced 但 reverted=false，代表 _applyDividendToPassive 已自行 toast 警告，不覆蓋
    });
}
