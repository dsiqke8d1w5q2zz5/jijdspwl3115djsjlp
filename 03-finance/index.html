// 綁定日期輸入框：8 碼數字自動格式化為 YYYY-MM-DD
function bindDateInput(el) {
    if (!el) return;
    el.addEventListener('input', function() {
        var v = el.value.replace(/\D/g, '');
        if (v.length >= 8) {
            el.value = v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6,8);
        } else if (v.length >= 6) {
            el.value = v.slice(0,4) + '-' + v.slice(4,6) + (v.length > 6 ? '-' + v.slice(6) : '');
        } else if (v.length >= 4) {
            el.value = v.slice(0,4) + (v.length > 4 ? '-' + v.slice(4) : '');
        }
    });
}

// 計算質押到期日：優先用使用者指定的 dueDate；否則 fallback 為質押日 +6 個月
// 接受兩種呼叫：calcPledgeDue(pledgeObj) 或 calcPledgeDue(dateStr)（舊用法）
function calcPledgeDue(pOrDateStr) {
    var dateStr;
    if (pOrDateStr && typeof pOrDateStr === 'object') {
        // 物件：優先用 dueDate
        if (pOrDateStr.dueDate) {
            var dp = String(pOrDateStr.dueDate).slice(0,10).split('-');
            if (dp.length === 3) return new Date(+dp[0], +dp[1]-1, +dp[2]);
        }
        dateStr = pOrDateStr.date;
    } else {
        dateStr = pOrDateStr;
    }
    var p = String(dateStr||'').slice(0,10).split('-');
    if (p.length !== 3) return new Date(dateStr);
    var y = +p[0], m = +p[1]-1, day = +p[2];
    var targetY = y, targetM = m + 6;
    while (targetM > 11) { targetM -= 12; targetY += 1; }
    // 取目標月的最後一天，若原日期超過則 clamp（例：8/31 + 6 月 → 2/28 或 2/29）
    var lastDayOfTargetMonth = new Date(targetY, targetM + 1, 0).getDate();
    var targetDay = Math.min(day, lastDayOfTargetMonth);
    return new Date(targetY, targetM, targetDay);
}
// 本地時區的 YYYY-MM-DD（避免 toISOString 在 UTC+8 把日期吃掉一天）
function _localDateStr(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
}

// ── iOS 風格年月滾輪選擇器 ──
// availableMonths: ['2026-05', '2026-04', ...]（不限順序）
// currentYM: 預選的 'YYYY-MM'
// onConfirm: function(ym) {}
function showYearMonthWheelPicker(availableMonths, currentYM, onConfirm) {
    if (!availableMonths || availableMonths.length === 0) return;
    // 依年份分組
    var byYear = {};
    availableMonths.forEach(function(ym){
        var y = ym.slice(0,4);
        var m = parseInt(ym.slice(5,7), 10);
        if (!byYear[y]) byYear[y] = [];
        if (byYear[y].indexOf(m) < 0) byYear[y].push(m);
    });
    Object.keys(byYear).forEach(function(y){ byYear[y].sort(function(a,b){ return a-b; }); });
    var years = Object.keys(byYear).sort(); // 由小到大

    var curY = (currentYM && byYear[currentYM.slice(0,4)]) ? currentYM.slice(0,4) : years[years.length - 1];
    var curM = (currentYM && byYear[curY].indexOf(parseInt(currentYM.slice(5,7), 10)) >= 0)
        ? parseInt(currentYM.slice(5,7), 10)
        : byYear[curY][byYear[curY].length - 1];

    var ov = document.createElement('div');
    ov.className = 'wheel-picker-overlay';
    var yearItems = years.map(function(y){ return '<div class="wheel-picker-item" data-year="' + y + '">' + y + ' 年</div>'; }).join('');
    var monthItems = byYear[curY].map(function(m){ return '<div class="wheel-picker-item" data-month="' + m + '">' + m + ' 月</div>'; }).join('');
    ov.innerHTML =
        '<div class="wheel-picker-modal">' +
            '<div class="wheel-picker-bar">' +
                '<button id="wp-cancel">取消</button>' +
                '<span class="wheel-picker-title">選擇月份</span>' +
                '<button id="wp-confirm">確定</button>' +
            '</div>' +
            '<div class="wheel-picker-body">' +
                '<div class="wheel-picker-highlight"></div>' +
                '<div class="wheel-picker-col" id="wp-year-col">' + yearItems + '</div>' +
                '<div class="wheel-picker-col" id="wp-month-col">' + monthItems + '</div>' +
            '</div>' +
        '</div>';
    document.body.appendChild(ov);

    var $yearCol = document.getElementById('wp-year-col');
    var $monthCol = document.getElementById('wp-month-col');
    var ITEM_H = 44;

    function _renderMonthCol() {
        $monthCol.innerHTML = byYear[curY].map(function(m){ return '<div class="wheel-picker-item" data-month="' + m + '">' + m + ' 月</div>'; }).join('');
        // 若 curM 不在新年的範圍裡，挑最近的
        if (byYear[curY].indexOf(curM) < 0) curM = byYear[curY][byYear[curY].length - 1];
        _scrollTo($monthCol, byYear[curY].indexOf(curM));
        _updateHighlight();
    }
    function _scrollTo(col, idx) {
        col.scrollTop = idx * ITEM_H;
    }
    function _updateHighlight() {
        // 標記目前 highlight 的 item
        var yearIdx = years.indexOf(curY);
        $yearCol.querySelectorAll('.wheel-picker-item').forEach(function(it, i){
            it.classList.toggle('selected', i === yearIdx);
        });
        var monthIdx = byYear[curY].indexOf(curM);
        $monthCol.querySelectorAll('.wheel-picker-item').forEach(function(it, i){
            it.classList.toggle('selected', i === monthIdx);
        });
    }
    function _onScroll(col, getList, setVal) {
        clearTimeout(col._scrollTimer);
        col._scrollTimer = setTimeout(function(){
            var idx = Math.round(col.scrollTop / ITEM_H);
            var list = getList();
            if (idx < 0) idx = 0;
            if (idx >= list.length) idx = list.length - 1;
            setVal(list[idx]);
            _updateHighlight();
        }, 80);
    }
    $yearCol.addEventListener('scroll', function(){
        _onScroll($yearCol, function(){ return years; }, function(v){
            if (curY !== v) {
                curY = v;
                _renderMonthCol();
            }
        });
    });
    $monthCol.addEventListener('scroll', function(){
        _onScroll($monthCol, function(){ return byYear[curY]; }, function(v){ curM = v; });
    });
    // 點 item 直接跳到該項
    $yearCol.addEventListener('click', function(e){
        var item = e.target.closest('.wheel-picker-item');
        if (!item) return;
        var y = item.getAttribute('data-year');
        var idx = years.indexOf(y);
        if (idx >= 0) _scrollTo($yearCol, idx);
    });
    $monthCol.addEventListener('click', function(e){
        var item = e.target.closest('.wheel-picker-item');
        if (!item) return;
        var m = parseInt(item.getAttribute('data-month'), 10);
        var idx = byYear[curY].indexOf(m);
        if (idx >= 0) _scrollTo($monthCol, idx);
    });

    document.getElementById('wp-cancel').onclick = function(){ ov.remove(); };
    document.getElementById('wp-confirm').onclick = function(){
        var ym = curY + '-' + String(curM).padStart(2,'0');
        ov.remove();
        if (onConfirm) onConfirm(ym);
    };
    // 點背景關閉
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });

    // 初始捲到當前位置
    setTimeout(function(){
        _scrollTo($yearCol, years.indexOf(curY));
        _scrollTo($monthCol, byYear[curY].indexOf(curM));
        _updateHighlight();
    }, 0);
}

// ── 分析子分頁 ──
var _stockPieChart = null;
var _stockPriceTrendChart = null;

// 把除權息事件寫入 stockData.dividendHistory 持久化（每筆 {stockId, exDate, cash, stockDiv}）
// 提供給「還原權息」計算使用，覆蓋過去與未來所有事件
function recordDividendHistory(stockId, exDate, cash, stockDiv) {
    if (!stockId || !exDate) return;
    if (!stockData) return;
    if (!stockData.dividendHistory) stockData.dividendHistory = [];
    if (!cash && !stockDiv) return; // 沒配也沒分股就跳過
    var idKey = String(stockId).trim().toUpperCase();
    var existing = stockData.dividendHistory.find(function(e){ return e.stockId === idKey && e.exDate === exDate; });
    if (existing) {
        var changed = false;
        if (cash > 0 && existing.cash !== cash) { existing.cash = cash; changed = true; }
        if (stockDiv > 0 && existing.stockDiv !== stockDiv) { existing.stockDiv = stockDiv; changed = true; }
        if (changed && typeof saveStockData === 'function') saveStockData();
    } else {
        stockData.dividendHistory.push({ stockId: idKey, exDate: exDate, cash: cash, stockDiv: stockDiv });
        if (typeof saveStockData === 'function') saveStockData();
    }
}

// 從 priceHistory 取得 N 天前對比現價的漲跌幅（已還原權息／股票股利／分割）
// 回傳 { pct, daysBack, latestPrice, startPrice, startDate, adjusted } 或 null（資料不足）
function getStockPriceChange(stockId, daysBack) {
    var arr = (stockData.priceHistory && stockData.priceHistory[stockId]) || [];
    if (arr.length < 2) return null;
    var latest = arr[arr.length - 1];
    var target = new Date();
    target.setDate(target.getDate() - daysBack);
    var tStr = _localDateStr(target);
    var startEntry = null;
    for (var i = arr.length - 1; i >= 0; i--) {
        if (arr[i].date <= tStr) { startEntry = arr[i]; break; }
    }
    if (!startEntry) return null;
    if (startEntry.price === 0) return null;
    // 把 startPrice 還原：找出 startDate < exDate <= latestDate 的所有事件，累積調整
    var adj = adjustForCorporateActions(stockId, startEntry.price, startEntry.date, latest.date);
    var adjustedStart = adj.adjustedPrice;
    var pct = (latest.price - adjustedStart) / adjustedStart * 100;
    return { pct: pct, daysBack: daysBack, latestPrice: latest.price, startPrice: startEntry.price, adjustedStart: adjustedStart, startDate: startEntry.date, adjusted: adj.eventCount > 0 };
}

// 把舊價格依期間內的除權息／股票股利／分割事件還原
// 回傳 { adjustedPrice, eventCount }
// 邏輯：對於每個 startDate < exDate <= endDate 的事件
//   - 現金股利 cash：還原後舊價 = 舊價 − cash（每股配息直接扣）
//   - 股票股利 stockDiv（單位：每股配 stockDiv/10 股；分割 1:N 視為 stockDiv = (N-1)*10）：還原後舊價 = 舊價 / (1 + stockDiv/10)
function adjustForCorporateActions(stockId, oldPrice, startDate, endDate) {
    var events = (stockData && Array.isArray(stockData.dividendHistory)) ? stockData.dividendHistory : [];
    var idKey = String(stockId).trim().toUpperCase();
    var price = oldPrice;
    var count = 0;
    events.forEach(function(ev) {
        if (ev.stockId !== idKey) return;
        if (!ev.exDate) return;
        if (ev.exDate <= startDate || ev.exDate > endDate) return;
        var cash = Number(ev.cash) || 0;
        var stockDiv = Number(ev.stockDiv) || 0;
        if (cash > 0) { price = price - cash; count++; }
        if (stockDiv > 0) { price = price / (1 + stockDiv / 10); count++; }
    });
    if (price < 0.01) price = 0.01; // 防呆
    return { adjustedPrice: price, eventCount: count };
}

function fmtPriceChange(change) {
    if (!change) return '<span style="color:var(--muted);font-size:11px" title="累積中（資料不足）">—</span>';
    var pct = change.pct;
    var color = pct > 0 ? 'var(--green)' : pct < 0 ? 'var(--red)' : 'var(--muted)';
    var sign = pct > 0 ? '+' : '';
    return '<span style="color:' + color + ';font-weight:600">' + sign + pct.toFixed(1) + '%</span>';
}

function renderStockAnalysis() {
    if (!stockData.holdings || stockData.holdings.length === 0) {
        return '<div style="text-align:center;padding:40px;color:var(--muted)">尚未新增持股，無法分析</div>';
    }
    return '<div id="return-calendar-slot">' + renderReturnCalendar() + '</div>' +
           '<div id="realized-trades-wrap">' + _buildRealizedTradesHtml() + '</div>';
}

// ── 報酬日曆 ──
// 用 stockData.priceHistory 逐檔精算每日「未實現損益」：
//   該日 dayPL = Σ (反推該日持股 × (該日收盤 − 前一交易日收盤))
// 這個算法與「點某日看持股快照」算出來的數字一致。
var _returnCalendarMonth = null; // 'YYYY-MM' 字串；null 表示「最近一個有資料的月份」
function _stockCalendarEmpty(msg) {
    return '<div style="background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column"><div style="font-size:14px;font-weight:600;margin-bottom:6px">報酬日曆</div><div style="color:var(--muted);font-size:12px;line-height:1.6">' + msg + '</div></div>';
}
function renderReturnCalendar() {
    var holdings = stockData.holdings || [];
    if (holdings.length === 0) return '';

    // dailyPnL[date] = { unrealized, realized, pct }
    //   unrealized = 純股價漲跌損益（逐檔精算）
    //   realized   = 當日所有 sell trades 的 realized 總和
    //   pct        = unrealized 對前一交易日總市值的比例
    // 算法：對每個 priceHistory 有資料的日期 D，逐檔算 shares(D) × (price(D) − price(D-1))
    var dailyPnL = {};
    var allMonthSet = {};
    var marketByDate = {}, dateListAll = [];

    // 當日交易：sellRealized 用來記「已實現」（不影響純股價漲跌的計算）
    var tradesByDate = {};
    (stockData.trades || []).forEach(function(t){
        if (!t.date) return;
        if (!tradesByDate[t.date]) tradesByDate[t.date] = { sellRealized: 0 };
        if (t.type === 'sell') {
            tradesByDate[t.date].sellRealized += t.realized || 0;
        }
    });

    // 找「最早一筆 buy」當報酬計算的起始日；之前的 priceHistory 不算入報酬
    var earliestBuyDate = null;
    (stockData.trades || []).forEach(function(t){
        if (t.type === 'buy' && t.date) {
            if (!earliestBuyDate || t.date < earliestBuyDate) earliestBuyDate = t.date;
        }
    });
    // 使用者自訂的「報酬日曆起算日」下限：早於此日的不算入報酬日曆（不影響個股漲跌日曆）
    var userStart = stockData.returnCalStartDate || '';
    if (userStart) {
        if (!earliestBuyDate || userStart > earliestBuyDate) earliestBuyDate = userStart;
    }

    // 蒐集所有 priceHistory 出現過的日期（≥ earliestBuyDate）
    var dateSet = {};
    var ph = stockData.priceHistory || {};
    Object.keys(ph).forEach(function(sid){
        (ph[sid] || []).forEach(function(e){
            if (e && e.date && (!earliestBuyDate || e.date >= earliestBuyDate)) dateSet[e.date] = true;
        });
    });
    var sortedDates = Object.keys(dateSet).sort();

    if (sortedDates.length === 0) {
        // 沒有 priceHistory 時，至少把有 realized 的日子顯示出來
        var hasRealized = Object.keys(tradesByDate).some(function(d){ return tradesByDate[d].sellRealized; });
        if (!hasRealized) {
            return _stockCalendarEmpty('尚無價格紀錄。<br>每天 15:00 後打開頁面、抓到股價就會自動記一筆。');
        }
    }

    // 反推某股票在某交易日收盤的股數 = 目前股數 + 該日之後賣 − 該日之後買
    function _sharesAt(sid, atDate) {
        var h = (stockData.holdings || []).find(function(x){ return x.id === sid; });
        var cur = h ? (h.shares || 0) : 0;
        var afterBuy = 0, afterSell = 0;
        (stockData.trades || []).forEach(function(t){
            if (t.id !== sid || !t.date || t.date <= atDate) return;
            if (t.type === 'buy') afterBuy += (t.shares || 0);
            else if (t.type === 'sell') afterSell += (t.shares || 0);
        });
        return cur + afterSell - afterBuy;
    }

    // 預先建立 priceHistory[id] 的日期→價 lookup
    var phByDate = {}; // { sid: { date: price } }
    Object.keys(ph).forEach(function(sid){
        phByDate[sid] = {};
        (ph[sid] || []).forEach(function(e){ if (e && e.date) phByDate[sid][e.date] = e.price; });
    });

    // 預先建立「每日每股的買賣明細」用以拆分當日部位
    var dayTradesByStock = {}; // { date: { sid: { buys: [{shares,price}], sellShares } } }
    (stockData.trades || []).forEach(function(t){
        if (!t.date || !t.id) return;
        if (!dayTradesByStock[t.date]) dayTradesByStock[t.date] = {};
        if (!dayTradesByStock[t.date][t.id]) dayTradesByStock[t.date][t.id] = { buys: [], sellShares: 0 };
        if (t.type === 'buy') dayTradesByStock[t.date][t.id].buys.push({ shares: t.shares || 0, price: t.price || 0 });
        else if (t.type === 'sell') dayTradesByStock[t.date][t.id].sellShares += (t.shares || 0);
    });

    // 逐日計算
    // 該日未實現 = Σ「昨天就有的部位 × (今收 − 昨收)」+ Σ「今天買進的部位 × (今收 − 買進價)」
    // （今天賣出的部位走 realized，不計入 unrealized）
    for (var k = 0; k < sortedDates.length; k++) {
        var curDate = sortedDates[k];

        var unr = 0, baseMarket = 0;
        var dayT = dayTradesByStock[curDate] || {};
        Object.keys(phByDate).forEach(function(sid){
            var pCur = phByDate[sid][curDate];
            if (typeof pCur !== 'number') return;
            // 前一天的價：找 < curDate 的最後一筆
            var pPrev = null;
            var arr = ph[sid] || [];
            for (var j = arr.length - 1; j >= 0; j--) {
                if (arr[j].date < curDate) { pPrev = arr[j].price; break; }
            }

            var endShares = _sharesAt(sid, curDate); // 該日收盤後股數
            var st = dayT[sid] || { buys: [], sellShares: 0 };
            var todayBuyShares = st.buys.reduce(function(a, b){ return a + b.shares; }, 0);
            var todaySellShares = st.sellShares;
            // 昨天就有的股數 = 今天收盤股數 − 今天買 + 今天賣
            var yShares = endShares - todayBuyShares + todaySellShares;
            if (yShares < 0) yShares = 0;

            // 第一部分：昨天就有的部位 × (今收 − 昨收)
            if (yShares > 0 && typeof pPrev === 'number') {
                unr += yShares * (pCur - pPrev);
                baseMarket += yShares * pPrev;
            }
            // 第二部分：今天買進的部位 × (今收 − 買進價)
            st.buys.forEach(function(b){
                unr += b.shares * (pCur - b.price);
                baseMarket += b.shares * b.price;
            });
        });

        var realized = (tradesByDate[curDate] && tradesByDate[curDate].sellRealized) || 0;
        if (unr !== 0 || realized !== 0) {
            dailyPnL[curDate] = {
                unrealized: unr,
                realized: realized,
                pct: baseMarket > 0 ? unr / baseMarket * 100 : 0
            };
        }
    }

    // 補：有賣出但 priceHistory 那天無紀錄時，至少把已實現損益記上去
    Object.keys(tradesByDate).forEach(function(d){
        if (!dailyPnL[d] && tradesByDate[d].sellRealized) {
            dailyPnL[d] = { unrealized: 0, realized: tradesByDate[d].sellRealized, pct: 0 };
        }
    });
    // 月份下拉：priceHistory 的月份 + 任何 sell trade 的月份
    sortedDates.forEach(function(d){ allMonthSet[d.slice(0,7)] = true; });
    Object.keys(tradesByDate).forEach(function(d){
        if (tradesByDate[d].sellRealized) allMonthSet[d.slice(0,7)] = true;
    });
    // dateListAll：相容後續邏輯（取「前一交易日」用）
    dateListAll = sortedDates.slice();

    var months = Object.keys(allMonthSet).sort().reverse();
    if (months.length === 0) return _stockCalendarEmpty('暫無資料');
    var curMonth = (_returnCalendarMonth && allMonthSet[_returnCalendarMonth]) ? _returnCalendarMonth : months[0];

    // ── 月合計 ──
    var monthDates = Object.keys(dailyPnL).filter(function(d){ return d.slice(0,7) === curMonth; }).sort();
    var monthUnrealized = 0, monthRealized = 0, monthPct = 0, basisMarket = null;
    monthDates.forEach(function(d){
        monthUnrealized += dailyPnL[d].unrealized;
        monthRealized   += dailyPnL[d].realized;
    });
    // 基準市值：取「該月第一筆 dailyPnL 之前一個交易日」的整體市值；用 priceHistory 逐檔重算
    function _totalMarketAt(date) {
        var tot = 0;
        Object.keys(phByDate).forEach(function(sid){
            // 找 <= date 的最後一筆價
            var p = phByDate[sid][date];
            if (typeof p !== 'number') {
                var arr = ph[sid] || [];
                for (var j = arr.length - 1; j >= 0; j--) {
                    if (arr[j].date <= date) { p = arr[j].price; break; }
                }
            }
            if (typeof p !== 'number') return;
            var s = _sharesAt(sid, date);
            if (s > 0) tot += s * p;
        });
        return tot;
    }
    if (monthDates.length) {
        var firstDailyDate = monthDates[0];
        var firstIdx = dateListAll.indexOf(firstDailyDate);
        if (firstIdx > 0) basisMarket = _totalMarketAt(dateListAll[firstIdx - 1]);
    }
    if (basisMarket === null && monthDates.length) basisMarket = _totalMarketAt(monthDates[0]);
    monthPct = (basisMarket && basisMarket > 0) ? (monthUnrealized / basisMarket * 100) : 0;
    var monthTotal = monthUnrealized + monthRealized;

    // ── 月份下拉 ──
    var monthOpts = months.map(function(m){
        return '<option value="' + m + '"' + (m === curMonth ? ' selected' : '') + '>' + m + '</option>';
    }).join('');

    var html = '<div style="background:var(--card);border-radius:var(--radius);padding:8px 14px;box-shadow:var(--shadow);flex:1;display:flex;flex-direction:column">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
    html += '<div style="font-size:14px;font-weight:600">報酬日曆</div>';
    // 月份左右切換（◀ 月份 ▸）；點中間月份仍可叫出選擇器直接挑月
    (function(){
        var mIdx = months.indexOf(curMonth);
        var olderM = (mIdx >= 0 && mIdx < months.length - 1) ? months[mIdx + 1] : null; // 上一月（較舊）
        var newerM = (mIdx > 0) ? months[mIdx - 1] : null;                              // 下一月（較新）
        var mBase = 'flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:14px;color:var(--text)';
        var mOn = mBase + ';cursor:pointer', mOff = mBase + ';opacity:0.3;cursor:not-allowed';
        html += '<div style="display:inline-flex;align-items:center;gap:5px">';
        html += olderM ? '<button onclick="onReturnCalendarMonthChange(\'' + olderM + '\')" title="上一月" style="' + mOn + '"><i class="ti ti-chevron-left"></i></button>'
                       : '<button disabled style="' + mOff + '"><i class="ti ti-chevron-left"></i></button>';
        html += '<button onclick="openReturnCalendarMonthPicker()" title="點選月份" style="padding:4px 12px;height:30px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px"><span>' + curMonth + '</span><i class="ti ti-chevron-down" style="font-size:12px;color:var(--muted)"></i></button>';
        html += newerM ? '<button onclick="onReturnCalendarMonthChange(\'' + newerM + '\')" title="下一月" style="' + mOn + '"><i class="ti ti-chevron-right"></i></button>'
                       : '<button disabled style="' + mOff + '"><i class="ti ti-chevron-right"></i></button>';
        html += '</div>';
    })();
    html += '<button onclick="showReturnCalStartDialog()" title="' + (userStart ? '報酬日曆起算日：' + esc(userStart) + '（早於此日不計入）' : '設定報酬日曆起算日') + '" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:' + (userStart ? 'var(--lux-navy)' : 'var(--muted)') + '"><i class="ti ti-calendar-cog" style="font-size:13px"></i>' + (userStart ? '<span>起算 ' + esc(userStart) + '</span>' : '<span>起算日</span>') + '</button>';
    html += '<span style="margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;align-items:baseline">';
    html += '<span>月損益 <b style="color:' + signColor(monthTotal) + ';font-size:16px">' + signedFmt(monthTotal) + '</b></span>';
    html += '<span style="font-size:12px">未實現 <b style="color:' + signColor(monthUnrealized) + '">' + signedFmt(monthUnrealized) + '</b></span>';
    html += '<span style="font-size:12px">已實現 <b style="color:' + signColor(monthRealized) + '">' + signedFmt(monthRealized) + '</b></span>';
    html += '</span>';
    html += '</div>';

    // 日曆網格（只顯示週一到週五，台股交易日才有資料）
    var ym = curMonth.split('-');
    var year = parseInt(ym[0], 10), monthIdx = parseInt(ym[1], 10) - 1;
    var lastDay = new Date(year, monthIdx + 1, 0).getDate();

    html += '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:12px">';
    ['一','二','三','四','五'].forEach(function(w){
        html += '<div style="text-align:center;color:var(--muted);font-size:11px;padding:4px 0">' + w + '</div>';
    });
    html += '<div style="text-align:center;color:var(--muted);font-size:11px;padding:4px 0">週損益</div>';

    // 用全域 helper 分組
    var weekList = _groupMonthByWeeks(year, monthIdx);

    // 判斷今天（台灣時區、YYYY-MM-DD）；僅在「平日 + 15:00 後」才顯示今日即時資料
    var twNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var todayStr = _localDateStr(twNow);
    var _wdNow = twNow.getDay();
    var _afterClose = twNow.getHours() >= 15;
    var todayShowsLive = (_wdNow !== 0 && _wdNow !== 6 && _afterClose);

    // 今日「未實現損益」公式：
    //   Σ(昨天就有的部位 × 今日漲跌) + Σ(今天買入的部位 × (收盤價 − 買入價))
    // 第一項是原有持股的當日漲跌；第二項是今天剛買的「實際獲利」（買入價到現價的差）。
    // 「昨天就有的部位」= 目前持股 − 今天買入 + 今天賣出（還原當沖場景）
    // 今天賣出的已實現損益另外加進「已」那一格，不重複計入未實現。
    var todayBuyByStock = {}; // { stockId: [{ shares, price }, ...] }
    var todaySellSharesByStock = {}; // { stockId: 今天賣出總股數 }
    (stockData.trades || []).forEach(function(t){
        if (!t.date || t.date !== todayStr) return;
        if (t.type === 'buy') {
            if (!todayBuyByStock[t.id]) todayBuyByStock[t.id] = [];
            todayBuyByStock[t.id].push({ shares: t.shares || 0, price: t.price || 0 });
        } else if (t.type === 'sell') {
            todaySellSharesByStock[t.id] = (todaySellSharesByStock[t.id] || 0) + (t.shares || 0);
        }
    });

    var todayLiveUnr = 0;
    var todayLivePct = 0;
    if (Array.isArray(stockData.holdings)) {
        var todayLiveBase = 0;
        stockData.holdings.forEach(function(h){
            if (!h || (h.shares || 0) <= 0) return;
            var p = stockData.prices && stockData.prices[h.id];
            if (!p || typeof p.price !== 'number') return;
            var curPrice = p.price;
            var prevPrice = (typeof p.change === 'number') ? curPrice - p.change : curPrice;
            var change = (typeof p.change === 'number') ? p.change : 0;

            var todayBuys = todayBuyByStock[h.id] || [];
            var todayBuyTotalShares = todayBuys.reduce(function(a, b){ return a + b.shares; }, 0);
            var todaySellShares = todaySellSharesByStock[h.id] || 0;
            // 第一項：昨天就有的部位 × 今日漲跌
            // 還原為「今天交易前的部位」= 目前股數 − 今天買入 + 今天賣出
            var heldShares = Math.max(0, h.shares - todayBuyTotalShares + todaySellShares);
            if (heldShares > 0) {
                todayLiveUnr += heldShares * change;
                todayLiveBase += heldShares * prevPrice;
            }
            // 第二項：今天剛買的部位 × (現價 − 買入價)
            todayBuys.forEach(function(b){
                todayLiveUnr += b.shares * (curPrice - b.price);
                todayLiveBase += b.shares * b.price;
            });
        });
        todayLivePct = todayLiveBase > 0 ? (todayLiveUnr / todayLiveBase * 100) : 0;
    }
    // 今日「已實現」用 trades 當日加總（即時，不依賴快照）
    var todayLiveRz = 0;
    (stockData.trades || []).forEach(function(t){
        if (t.type === 'sell' && t.date === todayStr) todayLiveRz += (t.realized || 0);
    });

    // 計算當前週的 cell bg 色（依正/負/0）
    function _cellBg(v) {
        return v > 0 ? 'rgba(239,68,68,0.08)' : v < 0 ? 'rgba(22,163,74,0.08)' : 'transparent';
    }

    weekList.forEach(function(week) {
        var byDow = week.byDow;
        var weekUnr = 0, weekRz = 0, weekHasData = false;
        for (var dow = 1; dow <= 5; dow++) {
            var dayNum = byDow[dow];
            if (!dayNum) {
                html += '<div class="cal-cell cal-cell-empty"></div>';
                continue;
            }
            var dStr = year + '-' + String(monthIdx + 1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
            var isToday = (dStr === todayStr);
            var entry = dailyPnL[dStr];

            // 今日特殊處理：用即時算法（僅在平日 15:00 後）
            if (isToday) {
                var hasLiveData = todayShowsLive && (todayLiveUnr !== 0 || todayLiveRz !== 0);
                if (hasLiveData) {
                    weekUnr += todayLiveUnr;
                    weekRz  += todayLiveRz;
                    weekHasData = true;
                    var tBg = _cellBg(todayLiveUnr + todayLiveRz);
                    var pctNum = todayLivePct.toFixed(2);
                    html += '<div class="cal-cell cal-cell-today" style="background:' + tBg + ';cursor:pointer" onclick="showCalDaySnapshot(' + escJs(dStr) + ')" title="點看當日快照">' +
                        '<div class="cal-cell-day">' + dayNum + ' <span class="cal-cell-today-label">今</span></div>' +
                        '<div class="cal-cell-main" style="color:' + signColor(todayLiveUnr) + '">' + signedFmt(todayLiveUnr) + ' <span class="cal-cell-pct">(' + pctNum + '%)</span></div>';
                    if (todayLiveRz !== 0) {
                        html += '<div class="cal-cell-sub" style="color:' + signColor(todayLiveRz) + '">已實現 ' + signedFmt(todayLiveRz) + '</div>';
                    }
                    html += '</div>';
                } else {
                    html += '<div class="cal-cell cal-cell-today cal-cell-today-empty" style="cursor:pointer" onclick="showCalDaySnapshot(' + escJs(dStr) + ')" title="點看當日快照">' + dayNum + ' <span class="cal-cell-today-label">今</span></div>';
                }
                continue;
            }

            if (entry) {
                weekUnr += entry.unrealized;
                weekRz  += entry.realized;
                weekHasData = true;
                var bg = _cellBg(entry.unrealized + entry.realized);
                var pctNumStr = entry.pct.toFixed(2);
                html += '<div class="cal-cell" style="background:' + bg + ';cursor:pointer" onclick="showCalDaySnapshot(' + escJs(dStr) + ')" title="點看當日快照">' +
                    '<div class="cal-cell-day">' + dayNum + '</div>';
                if (entry.unrealized !== 0 || entry.realized === 0) {
                    html += '<div class="cal-cell-main" style="color:' + signColor(entry.unrealized) + '">' + signedFmt(entry.unrealized) + ' <span class="cal-cell-pct">(' + pctNumStr + '%)</span></div>';
                }
                if (entry.realized !== 0) {
                    html += '<div class="cal-cell-sub" style="color:' + signColor(entry.realized) + '">已實現 ' + signedFmt(entry.realized) + '</div>';
                }
                html += '</div>';
            } else {
                html += '<div class="cal-cell cal-cell-blank">' + dayNum + '</div>';
            }
        }
        // 週合計（未實現 + 已實現 合計）
        if (weekHasData) {
            var weekTotal = weekUnr + weekRz;
            html += '<div class="cal-cell cal-cell-week-total">' +
                '<div class="cal-cell-main" style="color:' + signColor(weekTotal) + '">' + signedFmt(weekTotal) + '</div>' +
                '</div>';
        } else {
            html += '<div class="cal-cell cal-cell-empty"></div>';
        }
    });
    html += '</div>';

    html += '<div style="font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4">※ 上方數字為「未實現」（純股價漲跌）含 %；下方「已實現」為當日賣出實際入袋。今日格：昨天就有的部位×今日漲跌 + 今天買進的部位×(現價−買價)。台灣時間 15:00 自動抓盤後最終價並寫入當日快照。</div>';
    html += '</div>';
    return html;
}

// 已實現損益紀錄：列出所有 sell trades，依日期由新到舊
// 預設只顯示 15 筆；可用搜尋框（代號或股名）過濾；過濾後不限筆數
var _realizedSearchKw = '';
var _realizedShowAll = false;
var _realizedYearFilter = 'all'; // 'all' | 'YYYY'
function _buildRealizedTradesHtml() {
    var sells = (stockData.trades || [])
        .map(function(t, i){ return { t: t, i: i }; })
        .filter(function(x){ return x.t.type === 'sell'; })
        .sort(function(a, b){ return (b.t.date || '').localeCompare(a.t.date || ''); });

    // 蒐集年份清單（由新到舊）
    var yearSet = {};
    sells.forEach(function(x){
        var y = (x.t.date || '').slice(0, 4);
        if (y) yearSet[y] = true;
    });
    var years = Object.keys(yearSet).sort().reverse();
    // 若選中的年份已不存在，退回 all
    if (_realizedYearFilter !== 'all' && !yearSet[_realizedYearFilter]) _realizedYearFilter = 'all';

    // 套用年份篩選
    var yearFiltered = (_realizedYearFilter === 'all')
        ? sells
        : sells.filter(function(x){ return (x.t.date || '').slice(0, 4) === _realizedYearFilter; });

    // 摘要：累積 = 所有 sells；當選中年份 = 該年小計
    var totalAll = 0, yearTotal = 0;
    sells.forEach(function(x){ totalAll += (x.t.realized || 0); });
    yearFiltered.forEach(function(x){ yearTotal += (x.t.realized || 0); });

    // 套用搜尋過濾（在年份篩選之後）
    var kw = (_realizedSearchKw || '').trim().toLowerCase();
    var filtered = kw
        ? yearFiltered.filter(function(x){
            return (x.t.id || '').toLowerCase().indexOf(kw) >= 0
                || (x.t.name || '').toLowerCase().indexOf(kw) >= 0;
        })
        : yearFiltered;

    // 年份 select
    var yearOpts = '<option value="all"' + (_realizedYearFilter === 'all' ? ' selected' : '') + '>全部年份</option>';
    years.forEach(function(y){
        yearOpts += '<option value="' + y + '"' + (_realizedYearFilter === y ? ' selected' : '') + '>' + y + ' 年</option>';
    });

    // 外層卡片：永遠包住搜尋框，避免 input 被重建中斷輸入法
    var html = '<div id="realized-trades-slot" style="background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-top:12px">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
    html += '<div style="font-size:14px;font-weight:600">已實現損益紀錄</div>';
    html += '<select id="realized-year-filter" onchange="onRealizedYearFilterChange(this.value)" ' +
        'style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);cursor:pointer">' + yearOpts + '</select>';
    html += '<input type="text" id="realized-search" placeholder="搜尋代號或股名" value="' + esc(_realizedSearchKw) + '" ' +
        'style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);width:160px">';
    html += '<span id="realized-count-label" style="margin-left:auto;font-size:12px;color:var(--muted)">共 ' + yearFiltered.length + ' 筆' + (kw ? '（過濾後 ' + filtered.length + '）' : '') + '</span>';
    html += '</div>';
    // 內層 slot：只有列表本身會被重畫，搜尋框永遠不動
    html += '<div id="realized-trades-body">' + _buildRealizedBodyHtml(yearFiltered, filtered, kw, totalAll, yearTotal, _realizedYearFilter) + '</div>';
    html += '</div>';
    return html;
}

function onRealizedYearFilterChange(y) {
    _realizedYearFilter = y;
    _realizedShowAll = false; // 切年份重置「顯示全部」
    _refreshRealizedTradesOnly();
}

// 內層 body：摘要 + 列表（會被搜尋觸發重畫；不含搜尋框本身）
// sells 在此函式裡其實是「年份篩選後」的清單；filtered 是再經搜尋過濾的清單
function _buildRealizedBodyHtml(sells, filtered, kw, totalAll, yearTotal, yearFilter) {
    var html = '';

    if (sells.length === 0) {
        html += '<div style="color:var(--muted);font-size:12px;line-height:1.6;padding:8px 0">' +
            (yearFilter && yearFilter !== 'all' ? yearFilter + ' 年無賣出紀錄。' : '尚無賣出紀錄。買入歷程請到單股「漲跌日曆」的「交易紀錄」分頁看。') +
            '</div>';
        return html;
    }

    // 摘要：累積 = 全部年份；右側 = 當前選中年份的小計（若選「全部」則顯示「全部年份」）
    var tCls = totalAll >= 0 ? 'pos' : 'neg';
    var yCls = yearTotal >= 0 ? 'pos' : 'neg';
    var yLabel = (yearFilter && yearFilter !== 'all') ? (yearFilter + ' 年') : '全部年份';
    html += '<div style="display:flex;gap:16px;font-size:13px;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:6px;flex-wrap:wrap">';
    html += '<span style="color:var(--muted)">累積 <b class="' + tCls + '">' + (totalAll >= 0 ? '+' : '') + fmt(totalAll) + '</b></span>';
    html += '<span style="color:var(--muted)">' + yLabel + ' <b class="' + yCls + '">' + (yearTotal >= 0 ? '+' : '') + fmt(yearTotal) + '</b></span>';
    html += '</div>';

    if (filtered.length === 0) {
        html += '<div style="color:var(--muted);font-size:12px;padding:14px 0;text-align:center">沒有符合「' + esc(_realizedSearchKw) + '」的紀錄</div>';
        return html;
    }

    // 列表：有搜尋時不限筆數，沒搜尋預設 15 筆（可展開全部）
    var defaultLimit = 15;
    var hasFilter = !!kw;
    var showAll = hasFilter || _realizedShowAll;
    var showList = showAll ? filtered : filtered.slice(0, defaultLimit);

    // 計算持有天數：找該股票「此 sell 之前最早一筆 buy」
    function _holdDays(t) {
        if (!t.date || !t.id) return null;
        var earliest = null;
        (stockData.trades || []).forEach(function(b){
            if (b.type !== 'buy' || b.id !== t.id || !b.date) return;
            if (b.date > t.date) return; // 只看此次賣出之前的買入
            if (!earliest || b.date < earliest) earliest = b.date;
        });
        if (!earliest) return null;
        var d1 = new Date(earliest);
        var d2 = new Date(t.date);
        if (isNaN(d1) || isNaN(d2)) return null;
        return Math.max(0, Math.round((d2 - d1) / MS_PER_DAY));
    }

    html += '<div style="max-height:520px;overflow-y:auto"><table class="realized-table" style="width:100%;font-size:13px;border-collapse:collapse"><thead><tr style="border-bottom:1px solid var(--border)">' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center">日期</th>' +
        '<th style="padding:8px 4px;text-align:center"><span style="display:inline-block;min-width:120px;text-align:left">代號／名稱</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:50px;text-align:right">股數</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center" title="平均買入價＝賣出部分對應的成本÷股數"><span style="display:inline-block;min-width:60px;text-align:center">均價</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:60px;text-align:center">賣價</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:70px;text-align:center">已實現損益</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center" title="報酬率＝已實現損益÷成本"><span style="display:inline-block;min-width:60px;text-align:center">損益 %</span></th>' +
        '<th style="padding:8px 4px;white-space:nowrap;text-align:center" title="從此股最早一筆買入到此次賣出"><span style="display:inline-block;min-width:40px;text-align:center">天數</span></th>' +
        '<th style="width:60px"></th>' +
        '</tr></thead><tbody>';
    showList.forEach(function(x){
        var t = x.t;
        var realized = t.realized || 0;
        var sellPrice = (t.price != null) ? t.price.toFixed(2) : '-';
        var avgBuyPrice = (t.shares && t.cost != null && t.shares > 0) ? (t.cost / t.shares).toFixed(2) : '-';
        var ratePct = (t.cost && t.cost > 0) ? (realized / t.cost * 100) : null;
        var rateStr = ratePct !== null ? signPrefix(ratePct) + ratePct.toFixed(2) + '%' : '-';
        var days = _holdDays(t);
        var daysStr = days !== null ? days + ' 天' : '-';
        var plColor = signColor(realized);
        html += '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="padding:8px 4px;text-align:center;white-space:nowrap;color:var(--muted);font-size:12px">' + esc(t.date || '') + '</td>' +
            '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:left;min-width:120px"><b style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;color:var(--lux-navy)" onclick="showStockCalendarModal(' + escJs(t.id || '') + ');setTimeout(function(){switchStockCalTab(\'trades\')},0)" title="看此股完整交易歷程">' + esc(t.id || '') + '</b>' +
                ' <span style="color:var(--muted);font-size:12px">' + esc(t.name || '') + '</span></span></td>' +
            '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:50px">' + fmt(t.shares || 0) + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center;color:var(--muted)"><span style="display:inline-block;text-align:right;min-width:60px">' + avgBuyPrice + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:60px">' + sellPrice + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center;font-weight:600;color:' + plColor + '"><span style="display:inline-block;text-align:right;min-width:70px">' + signedFmt(realized) + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center;font-weight:600;color:' + plColor + '"><span style="display:inline-block;text-align:right;min-width:60px">' + rateStr + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center;color:var(--muted);font-size:12px;white-space:nowrap"><span style="display:inline-block;text-align:right;min-width:40px">' + daysStr + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center;white-space:nowrap">' +
                '<button onclick="editTrade(' + x.i + ')" title="編輯" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 4px;font-size:13px"><i class="ti ti-pencil"></i></button>' +
                '<button onclick="deleteTrade(' + x.i + ')" title="刪除" style="background:none;border:none;cursor:pointer;color:var(--red);padding:2px 4px;font-size:13px"><i class="ti ti-trash"></i></button>' +
            '</td>' +
            '</tr>';
    });
    html += '</tbody></table></div>';
    // 「顯示全部」按鈕（無搜尋時、且有超過 15 筆才顯示）
    if (!hasFilter && filtered.length > defaultLimit) {
        if (_realizedShowAll) {
            html += '<div style="text-align:center;margin-top:8px"><button onclick="toggleRealizedShowAll()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted)">收合，只顯示最近 ' + defaultLimit + ' 筆</button></div>';
        } else {
            html += '<div style="text-align:center;margin-top:8px"><button onclick="toggleRealizedShowAll()" style="padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-family:inherit;font-size:12px;color:var(--lux-navy)">顯示全部 ' + filtered.length + ' 筆</button></div>';
        }
    }
    return html;
}

function toggleRealizedShowAll() {
    _realizedShowAll = !_realizedShowAll;
    _refreshRealizedTradesOnly();
}
// 只重畫「已實現紀錄」的 body（不動搜尋 input，保持輸入法狀態）
function _refreshRealizedTradesOnly() {
    var body = document.getElementById('realized-trades-body');
    var countLabel = document.getElementById('realized-count-label');
    if (!body) return;
    // 重新計算
    var sells = (stockData.trades || [])
        .map(function(t, i){ return { t: t, i: i }; })
        .filter(function(x){ return x.t.type === 'sell'; })
        .sort(function(a, b){ return (b.t.date || '').localeCompare(a.t.date || ''); });
    // 年份篩選
    var yearFiltered = (_realizedYearFilter === 'all')
        ? sells
        : sells.filter(function(x){ return (x.t.date || '').slice(0, 4) === _realizedYearFilter; });
    // 摘要
    var totalAll = 0, yearTotal = 0;
    sells.forEach(function(x){ totalAll += (x.t.realized || 0); });
    yearFiltered.forEach(function(x){ yearTotal += (x.t.realized || 0); });
    // 搜尋過濾
    var kw = (_realizedSearchKw || '').trim().toLowerCase();
    var filtered = kw
        ? yearFiltered.filter(function(x){
            return (x.t.id || '').toLowerCase().indexOf(kw) >= 0
                || (x.t.name || '').toLowerCase().indexOf(kw) >= 0;
        })
        : yearFiltered;
    body.innerHTML = _buildRealizedBodyHtml(yearFiltered, filtered, kw, totalAll, yearTotal, _realizedYearFilter);
    if (countLabel) countLabel.textContent = '共 ' + yearFiltered.length + ' 筆' + (kw ? '（過濾後 ' + filtered.length + '）' : '');
}

// 綁定搜尋框事件（首次渲染後呼叫一次，之後 input 永遠不重建）
// 用 _isBound 旗標避免重複綁
function _bindRealizedSearchEvents() {
    var $s = document.getElementById('realized-search');
    if (!$s || $s.dataset.bound === '1') return;
    $s.dataset.bound = '1';
    var composing = false;
    $s.addEventListener('compositionstart', function(){ composing = true; });
    $s.addEventListener('compositionend', function(){
        composing = false;
        _realizedSearchKw = $s.value;
        _refreshRealizedTradesOnly();
    });
    $s.addEventListener('input', function(){
        if (composing) return; // 組字中不重畫，避免輸入法被中斷
        _realizedSearchKw = $s.value;
        _refreshRealizedTradesOnly();
    });
}

// ── 報酬日曆某一天的快照 modal ──
// 從 priceHistory[id] 找該日股價、trades 找該日交易、用 holdings 推算當時部位
// 注意：股數是用「目前股數 + 該日之後的賣出 − 該日之後的買入」反推（最簡單近似）
function showCalDaySnapshot(dateStr) {
    if (!dateStr) return;

    // 反推該日收盤後的持股股數：目前 + 之後 sell − 之後 buy
    function _sharesAtDate(stockId, atDate) {
        var h = (stockData.holdings || []).find(function(x){ return x.id === stockId; });
        var cur = h ? (h.shares || 0) : 0;
        var afterBuys = 0, afterSells = 0;
        (stockData.trades || []).forEach(function(t){
            if (t.id !== stockId || !t.date) return;
            if (t.date > atDate) {
                if (t.type === 'buy') afterBuys += (t.shares || 0);
                else if (t.type === 'sell') afterSells += (t.shares || 0);
            }
        });
        // 反推：今天的部位 = atDate 收盤的部位 + 之後 buy − 之後 sell
        // 所以 atDate 收盤部位 = 今天 − 之後 buy + 之後 sell
        return cur - afterBuys + afterSells;
    }
    // 台灣今天日期
    var _twTodayStr = _localDateStr(new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' })));
    // 取某日的股價：
    //   若查的是「今天」且有 Yahoo 即時價 → 用即時價（與持股總覽一致，避免收盤前後不同步）
    //   否則用 priceHistory（找該日之前最近一筆）
    function _priceAtDate(stockId, atDate) {
        if (atDate === _twTodayStr) {
            var live = stockData.prices && stockData.prices[stockId];
            if (live && typeof live.price === 'number') {
                return { price: live.price, date: atDate, exact: true };
            }
        }
        var arr = (stockData.priceHistory && stockData.priceHistory[stockId]) || [];
        if (!arr.length) return null;
        var best = null;
        for (var i = arr.length - 1; i >= 0; i--) {
            if (arr[i].date <= atDate) { best = arr[i]; break; }
        }
        if (best) return { price: best.price, date: best.date, exact: best.date === atDate };
        return null;
    }

    // 收集所有「該日有過部位」的股票
    var rows = [];
    var allStockIds = {};
    (stockData.holdings || []).forEach(function(h){ allStockIds[h.id] = h; });
    (stockData.trades || []).forEach(function(t){
        if (t.id && t.date && t.date <= dateStr) allStockIds[t.id] = allStockIds[t.id] || { id: t.id, name: t.name || t.id };
    });
    Object.keys(allStockIds).forEach(function(id){
        var h = allStockIds[id];
        var shares = _sharesAtDate(id, dateStr);
        // 收集當日交易（即使 shares=0 也要保留：可能當天買又當天賣完、或當天全部賣完）
        var todayBuys = [], todaySellShares = 0;
        (stockData.trades || []).forEach(function(t){
            if (t.id !== id || t.date !== dateStr) return;
            if (t.type === 'buy') todayBuys.push({ shares: t.shares || 0, price: t.price || 0 });
            else if (t.type === 'sell') todaySellShares += (t.shares || 0);
        });
        var hasTodayBuy = todayBuys.length > 0;
        var hasTodaySell = todaySellShares > 0;
        if (shares <= 0 && !hasTodayBuy && !hasTodaySell) return; // 該日完全沒部位也沒當日交易就跳過
        var pInfo = _priceAtDate(id, dateStr);
        var price = pInfo ? pInfo.price : null;
        var market = price !== null ? shares * price : null;
        var costBasis = (h && typeof h.cost === 'number') ? shares * h.cost : null;
        var pl = (market !== null && costBasis !== null) ? market - costBasis : null;
        // 當日損益（與報酬日曆一致的算法）：
        //   = 昨天就有的部位 × (今收 − 昨收) + 今天買進的部位 × (今收 − 買進價)
        // shares 是「該日收盤」股數；今天買的、賣的另外處理。
        var dayPL = null;
        var arr = (stockData.priceHistory && stockData.priceHistory[id]) || [];
        if (pInfo && pInfo.exact && typeof pInfo.price === 'number') {
            var prevEntry = null;
            for (var i = arr.length - 1; i >= 0; i--) {
                if (arr[i].date < dateStr) { prevEntry = arr[i]; break; }
            }
            var todayBuyShares = todayBuys.reduce(function(a, b){ return a + b.shares; }, 0);
            // 昨天就有的股數 = 該日收盤股數 − 今天買 + 今天賣
            var yShares = shares - todayBuyShares + todaySellShares;
            if (yShares < 0) yShares = 0;
            var part1 = 0;
            if (prevEntry && typeof prevEntry.price === 'number' && yShares > 0) {
                part1 = yShares * (pInfo.price - prevEntry.price);
            }
            var part2 = todayBuys.reduce(function(sum, b){ return sum + b.shares * (pInfo.price - b.price); }, 0);
            if (part1 !== 0 || part2 !== 0) dayPL = part1 + part2;
        }
        rows.push({
            id: id,
            name: h.name || id,
            shares: shares,
            price: price,
            priceDate: pInfo ? pInfo.date : null,
            priceExact: pInfo ? pInfo.exact : false,
            market: market,
            costBasis: costBasis,
            pl: pl,
            dayPL: dayPL
        });
    });
    // 排序：依代號由小到大
    rows.sort(function(a, b){ return String(a.id || '').localeCompare(String(b.id || '')); });

    // 當日交易
    var todayTrades = (stockData.trades || []).filter(function(t){ return t.date === dateStr; });

    // 總計
    var totalMarket = 0, totalCost = 0, totalPL = 0, totalDayPL = 0, hasDayPL = false;
    rows.forEach(function(r){
        if (r.market !== null) totalMarket += r.market;
        if (r.costBasis !== null) totalCost += r.costBasis;
        if (r.pl !== null) totalPL += r.pl;
        if (r.dayPL !== null) { totalDayPL += r.dayPL; hasDayPL = true; }
    });
    // 當日已實現：今天賣出單的 realized 加總（與下方「當日交易」表的已實現欄同源）
    var dayRealized = 0, hasDayRealized = false;
    (stockData.trades || []).forEach(function(t){
        if (t.date === dateStr && t.type === 'sell' && typeof t.realized === 'number') {
            dayRealized += t.realized; hasDayRealized = true;
        }
    });

    var ov = document.createElement('div');
    ov.className = 'overlay';
    // flex 直排：標題＋可捲動內容＋固定底部按鈕。讓「關閉」永遠釘在底部不被內容推出可視範圍
    var html = '<div class="modal" style="width:760px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column">' +
        '<h3 style="margin:0 0 10px;flex:0 0 auto"><i class="ti ti-calendar"></i> ' + esc(dateStr) + ' 持股快照</h3>' +
        '<div style="flex:1 1 auto;overflow-y:auto;min-height:0">';

    if (rows.length === 0) {
        html += '<div style="padding:30px;text-align:center;color:var(--muted)">該日無持股紀錄。</div>';
    } else {
        // 總計列
        var plColor = signColor(totalPL);
        html += '<div style="display:flex;gap:18px;font-size:13px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px;flex-wrap:wrap">';
        html += '<span style="color:var(--muted)">市值 <b style="color:var(--lux-gold)">' + fmt(totalMarket) + '</b></span>';
        html += '<span style="color:var(--muted)">成本 <b>' + fmt(totalCost) + '</b></span>';
        html += '<span style="color:var(--muted)">總損益 <b style="color:' + plColor + '">' + signedFmt(totalPL) + '</b></span>';
        if (totalCost > 0) {
            var rate = totalPL / totalCost * 100;
            html += '<span style="color:var(--muted)">報酬率 <b style="color:' + plColor + '">' + signPrefix(rate) + rate.toFixed(2) + '%</b></span>';
        }
        if (hasDayPL) {
            html += '<span style="color:var(--muted)">當日損益 <b style="color:' + signColor(totalDayPL) + '">' + signedFmt(totalDayPL) + '</b></span>';
        }
        if (hasDayRealized) {
            html += '<span style="color:var(--muted)">當日已實現 <b style="color:' + signColor(dayRealized) + '">' + signedFmt(dayRealized) + '</b></span>';
        }
        // 當日整體損益 = 未實現波動(當日損益) + 已實現。只在「當天有賣出(已實現)」時才顯示，
        // 否則整體就等於當日損益、多一列反而冗餘
        if (hasDayRealized) {
            var dayTotal = (hasDayPL ? totalDayPL : 0) + dayRealized;
            html += '<span style="color:var(--muted)">當日整體 <b style="color:' + signColor(dayTotal) + '">' + signedFmt(dayTotal) +
                '</b> <span style="font-size:11px">(波動' + signedFmt(hasDayPL ? totalDayPL : 0) + ' + 已實現' + signedFmt(dayRealized) + ')</span></span>';
        }
        html += '</div>';

        // 持股表
        html += '<div class="table-wrap"><table class="stock-table"><thead><tr>' +
            '<th style="text-align:left">代號／名稱</th>' +
            '<th style="text-align:right">股數</th>' +
            '<th style="text-align:right">當日股價</th>' +
            '<th style="text-align:right">當日損益</th>' +
            '<th style="text-align:right">市值</th>' +
            '<th style="text-align:right">總損益</th>' +
            '</tr></thead><tbody>';
        rows.forEach(function(r){
            var priceCell;
            if (r.price === null) priceCell = '<span style="color:var(--muted)">無紀錄</span>';
            else if (!r.priceExact) priceCell = r.price.toFixed(2) + ' <span style="font-size:10px;color:var(--muted)">(' + r.priceDate + ')</span>';
            else priceCell = r.price.toFixed(2);
            var dayPLCell = (r.dayPL !== null) ?
                '<span style="color:' + signColor(r.dayPL) + ';font-weight:600">' + signedFmt(r.dayPL) + '</span>' :
                '<span style="color:var(--muted)">-</span>';
            html += '<tr>' +
                '<td><b>' + esc(r.id) + '</b> <span style="font-size:12px;color:var(--muted)">' + esc(r.name) + '</span></td>' +
                '<td style="text-align:right">' + fmt(r.shares) + '</td>' +
                '<td style="text-align:right">' + priceCell + '</td>' +
                '<td style="text-align:right">' + dayPLCell + '</td>' +
                '<td style="text-align:right;font-weight:600">' + (r.market !== null ? fmt(r.market) : '-') + '</td>' +
                '<td style="text-align:right;font-weight:600;color:' + signColor(r.pl) + '">' + (r.pl !== null ? signedFmt(r.pl) : '-') + '</td>' +
                '</tr>';
        });
        html += '</tbody></table></div>';
    }

    // 當日交易紀錄（表格樣式）
    if (todayTrades.length > 0) {
        html += '<h4 style="margin:16px 0 8px;font-size:14px">當日交易（' + todayTrades.length + ' 筆）</h4>';
        html += '<table class="realized-table" style="width:100%;font-size:13px;border-collapse:collapse"><thead><tr style="border-bottom:1px solid var(--border)">' +
            '<th style="padding:8px 4px;white-space:nowrap;text-align:center">類型</th>' +
            '<th style="padding:8px 4px;text-align:center"><span style="display:inline-block;min-width:120px;text-align:left">代號／名稱</span></th>' +
            '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:60px;text-align:right">股數</span></th>' +
            '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:70px;text-align:right">價格</span></th>' +
            '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:80px;text-align:right">成交金額</span></th>' +
            '<th style="padding:8px 4px;white-space:nowrap;text-align:center"><span style="display:inline-block;min-width:80px;text-align:right">已實現</span></th>' +
            '</tr></thead><tbody>';
        var sumBuy = 0, sumSell = 0, sumRz = 0, hasRz = false;
        todayTrades.forEach(function(t){
            var isBuy = t.type === 'buy';
            var label = isBuy
                ? '<span style="display:inline-block;background:rgba(22,163,74,0.12);color:var(--green);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">買</span>'
                : '<span style="display:inline-block;background:rgba(239,68,68,0.12);color:var(--red);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">賣</span>';
            var amt = (typeof t.amount === 'number') ? t.amount : (t.shares || 0) * (t.price || 0);
            if (isBuy) sumBuy += amt; else sumSell += amt;
            // 成交金額依買賣上色：買綠、賣紅（與左側買/賣標籤一致），一眼分辨方向
            var amtCell = '<span style="color:' + (isBuy ? 'var(--green)' : 'var(--red)') + ';font-weight:600">' + fmt(amt) + '</span>';
            var rzCell;
            if (isBuy) {
                rzCell = '<span style="color:var(--muted)">—</span>';
            } else {
                var realized = t.realized || 0;
                sumRz += realized; hasRz = true;
                rzCell = '<span style="color:' + signColor(realized) + ';font-weight:600">' + signedFmt(realized) + '</span>';
            }
            html += '<tr style="border-bottom:1px solid var(--border)">' +
                '<td style="padding:8px 4px;text-align:center">' + label + '</td>' +
                '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:left;min-width:120px"><b>' + esc(t.id || '') + '</b> <span style="color:var(--muted);font-size:12px">' + esc(t.name || '') + '</span></span></td>' +
                '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:60px">' + fmt(t.shares || 0) + '</span></td>' +
                '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:70px">' + (typeof t.price === 'number' ? t.price.toFixed(2) : '-') + '</span></td>' +
                '<td style="padding:8px 4px;text-align:center;font-weight:600"><span style="display:inline-block;text-align:right;min-width:80px">' + amtCell + '</span></td>' +
                '<td style="padding:8px 4px;text-align:center;font-weight:600"><span style="display:inline-block;text-align:right;min-width:80px">' + rzCell + '</span></td>' +
                '</tr>';
        });
        // 成交金額合計：淨額＝賣−買（正＝淨流入現金，紅；負＝淨流出，綠，符合台股紅漲綠跌）
        var netAmt = sumSell - sumBuy;
        var amtTotalHtml = '<span style="color:' + signColor(netAmt) + '">' + signedFmt(netAmt) + '</span>';
        html += '</tbody><tfoot><tr style="border-top:2px solid var(--border);font-weight:700">' +
            '<td style="padding:8px 4px;text-align:center" colspan="4"><span style="display:inline-block;text-align:left">合計</span></td>' +
            '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:80px">' + amtTotalHtml + '</span></td>' +
            '<td style="padding:8px 4px;text-align:center"><span style="display:inline-block;text-align:right;min-width:80px;color:' + (hasRz ? signColor(sumRz) : 'var(--muted)') + '">' + (hasRz ? signedFmt(sumRz) : '—') + '</span></td>' +
            '</tr></tfoot></table>';
    }

    html += '<div style="font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6">※ 股數是從目前部位反推（之後的買賣紀錄回算），股價來自 priceHistory（若該日無快照則用前一筆，標註日期）。成本以目前均價估算，僅供參考。</div>';
    html += '</div>'; // 結束可捲動內容區
    html += '<div class="modal-btns" style="margin-top:12px;flex:0 0 auto"><button onclick="this.closest(\'.overlay\').remove()" style="flex:1">關閉</button></div>';
    html += '</div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);
    var _md = false;
    ov.addEventListener('mousedown', function(e){ _md = (e.target === ov); });
    ov.addEventListener('click', function(e){ if (e.target === ov && _md) ov.remove(); _md = false; });
}

// 清空某檔的所有 buy/sell 交易紀錄，並把該檔持股股數/均價歸零
// 注意：不動「收入/支出」（不呼叫 _syncTradesToCashflow）
function clearStockTrades(stockId) {
    if (!stockData || !Array.isArray(stockData.trades)) return;
    var h = (stockData.holdings || []).find(function(x){ return x.id === stockId; });
    var name = h ? (h.name || stockId) : stockId;
    var cnt = stockData.trades.filter(function(t){ return t && t.id === stockId && (t.type === 'buy' || t.type === 'sell'); }).length;
    if (cnt === 0) { toast('此檔已無交易紀錄'); return; }
    showConfirm2('確定清空「' + name + '」全部 ' + cnt + ' 筆交易紀錄？\n\n持股股數與均價會一併歸零。\n（收入/支出的紀錄不會動）', function() {
        stockData.trades = stockData.trades.filter(function(t){
            return !(t && t.id === stockId && (t.type === 'buy' || t.type === 'sell'));
        });
        if (h) { h.shares = 0; h.cost = 0; }
        saveStockData();
        _refreshTradesList();
        renderStock();
        toast('已清空 ' + cnt + ' 筆交易紀錄');
    });
}

// 用某檔的所有 trades 重算 holdings[id] 的 shares 與 cost（均價）
// 邏輯：按日期+原順序 replay 全部 buy/sell。買入用 amount 加總成本；賣出只扣股數，均價不變。
function _rebuildHoldingFromTrades(stockId) {
    if (!stockData || !Array.isArray(stockData.holdings) || !Array.isArray(stockData.trades)) return;
    var h = stockData.holdings.find(function(x){ return x.id === stockId; });
    if (!h) return;
    var list = stockData.trades
        .map(function(t, i){ return { t: t, i: i }; })
        .filter(function(x){ return x.t && x.t.id === stockId && (x.t.type === 'buy' || x.t.type === 'sell'); })
        .sort(function(a, b){
            var ad = a.t.date || '', bd = b.t.date || '';
            if (ad !== bd) return ad < bd ? -1 : 1;
            return a.i - b.i;
        });
    var shares = 0, totalCost = 0;
    list.forEach(function(x){
        var t = x.t;
        if (t.type === 'buy') {
            var amt = (typeof t.amount === 'number') ? t.amount : (t.shares || 0) * (t.price || 0);
            shares += (t.shares || 0);
            totalCost += amt;
        } else {
            // sell：股數扣，總成本按比例扣（維持均價）
            var sShares = t.shares || 0;
            if (shares > 0) {
                var portion = Math.min(sShares, shares);
                var avgBefore = totalCost / shares;
                totalCost -= avgBefore * portion;
                shares -= portion;
                if (shares < 0) shares = 0;
                if (totalCost < 0) totalCost = 0;
            }
        }
    });
    h.shares = shares;
    h.cost = shares > 0 ? totalCost / shares : 0;
}

function editTrade(idx) {
    var t = stockData.trades && stockData.trades[idx];
    if (!t) return;
    var isBuy = t.type === 'buy';
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var title = isBuy ? '編輯買入 - ' : '編輯賣出 - ';
    var html = '<div class="modal"><h3>' + title + esc(t.id || '') + '</h3>' +
        '<label style="font-size:12px;color:var(--muted)">日期</label>' +
        '<input type="date" id="et-date" value="' + esc(t.date || '') + '">' +
        '<label style="font-size:12px;color:var(--muted)">股數</label>' +
        '<input type="number" id="et-shares" value="' + (t.shares || 0) + '" step="1">';
    if (!isBuy) {
        html += '<label style="font-size:12px;color:var(--muted)">賣出股價</label>' +
                '<input type="number" id="et-price" value="' + (t.price != null ? t.price : '') + '" step="0.01">' +
                '<label style="font-size:12px;color:var(--muted)">成本</label>' +
                '<input type="number" id="et-cost" value="' + (t.cost != null ? Math.round(t.cost) : '') + '" step="1">' +
                '<label style="font-size:12px;color:var(--muted)">已實現損益（可手動編輯填扣完手續費／證交稅的實際數）</label>' +
                '<input type="number" id="et-realized" value="' + (t.realized != null ? Math.round(t.realized) : '') + '" step="1">';
    } else {
        // 預設帶入原本的 amount（含手續費）；如果沒有就退回 shares × price
        var defaultBuyAmount = (typeof t.amount === 'number') ? Math.round(t.amount) : Math.round((t.shares || 0) * (t.price || 0));
        html += '<label style="font-size:12px;color:var(--muted)">買入成本（總額，含手續費）</label>' +
                '<input type="number" id="et-amount" value="' + defaultBuyAmount + '" step="1">' +
                '<div id="et-pl-preview" style="margin-top:10px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--muted)">本次均價（自動）：<b id="et-pl-num">-</b></div>' +
                '<div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">※ 儲存後會用所有交易紀錄重算該檔的持股股數與均價。</div>';
    }
    html += '<div class="modal-btns" style="margin-top:12px">' +
                '<button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
                '<button class="btn-primary" id="et-save">儲存</button>' +
            '</div></div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);
    var realizedEdited = false;
    if (!isBuy) {
        document.getElementById('et-realized').addEventListener('input', function(){ realizedEdited = true; });
    }
    function update() {
        var sh = parseInt(document.getElementById('et-shares').value) || 0;
        if (isBuy) {
            // 顯示本次均價（總成本 / 股數），不用 et-price 欄位（買入不需要單獨股價）
            var amt = parseFloat(document.getElementById('et-amount').value);
            var $n = document.getElementById('et-pl-num');
            if (sh > 0 && !isNaN(amt) && amt > 0) {
                $n.textContent = (amt / sh).toFixed(2);
                $n.style.color = 'var(--text)';
            } else {
                $n.textContent = '-';
                $n.style.color = 'var(--muted)';
            }
            return;
        }
        // sell：已實現未手動編輯時自動跟著「股數×價 − 成本」算
        var pr = parseFloat(document.getElementById('et-price').value);
        var c = parseFloat(document.getElementById('et-cost').value);
        var $r = document.getElementById('et-realized');
        if (!realizedEdited && sh > 0 && !isNaN(pr) && !isNaN(c)) {
            var auto = Math.round(sh * pr - c);
            if (String(auto) !== $r.value) $r.value = auto;
        }
    }
    var ids = isBuy ? ['et-shares','et-amount'] : ['et-shares','et-price','et-cost'];
    ids.forEach(function(id){ document.getElementById(id).addEventListener('input', update); });
    update();
    document.getElementById('et-save').onclick = function() {
        var sh = parseInt(document.getElementById('et-shares').value) || 0;
        var d = document.getElementById('et-date').value;
        if (sh <= 0 || !d) { toast('請填完整資訊'); return; }
        if (isBuy) {
            // 買入：amount 是主要資料、price 從 amount/shares 反推
            var amt = parseFloat(document.getElementById('et-amount').value);
            if (isNaN(amt) || amt <= 0) { toast('請填買入成本'); return; }
            t.date = d;
            t.shares = sh;
            t.price = amt / sh;
            t.amount = amt;
        } else {
            var pr = parseFloat(document.getElementById('et-price').value);
            if (isNaN(pr) || pr <= 0) { toast('請填賣出股價'); return; }
            var c = parseFloat(document.getElementById('et-cost').value);
            var rz = parseFloat(document.getElementById('et-realized').value);
            if (isNaN(c)) { toast('請填成本'); return; }
            if (isNaN(rz)) { toast('請填已實現損益'); return; }
            t.date = d;
            t.shares = sh;
            t.price = pr;
            t.cost = c;
            t.realized = rz;
            try { _syncTradesToCashflow(); saveData(true); } catch(e){ console.error('[syncTrades]', e); }
        }
        // 用全部 trades 回算該檔持股 shares / cost
        _rebuildHoldingFromTrades(t.id);
        saveStockData();
        ov.remove();
        _refreshTradesList();
        renderStock();
        toast('已更新交易紀錄並同步持股');
    };
}

function deleteTrade(idx) {
    var t = stockData.trades && stockData.trades[idx];
    if (!t) return;
    var isBuy = t.type === 'buy';
    var summary;
    if (isBuy) {
        var amt = (typeof t.amount === 'number') ? t.amount : (t.shares || 0) * (t.price || 0);
        summary = '買 ' + esc(t.id || '') + ' ' + esc(t.date || '') + '　金額 ' + fmt(amt);
    } else {
        summary = '賣 ' + esc(t.id || '') + ' ' + esc(t.date || '') + '　' + (t.realized >= 0 ? '+' : '') + fmt(t.realized || 0);
    }
    // 預先算出回算後的持股結果，讓使用者在確認對話框就能看到影響
    var h = (stockData.holdings || []).find(function(x){ return x.id === t.id; });
    var hChangeInfo = '';
    if (h) {
        if (isBuy) {
            var newShares = h.shares - (t.shares || 0);
            if (newShares < 0) {
                hChangeInfo = '\n⚠ 刪除後持股股數會變負（' + fmt(newShares) + '），可能是交易紀錄與持股不同步。刪除時會自動修正為 0。';
                newShares = 0;
            }
            var origCost = h.shares * h.cost;
            var thisBuyAmount = (typeof t.amount === 'number') ? t.amount : (t.shares || 0) * (t.price || 0);
            var newAvg = newShares > 0 ? (origCost - thisBuyAmount) / newShares : 0;
            if (newAvg < 0) newAvg = 0;
            hChangeInfo = '\n\n持股將自動回算：\n' +
                '股數 ' + fmt(h.shares) + ' → ' + fmt(newShares) + '\n' +
                '均價 ' + h.cost.toFixed(2) + ' → ' + newAvg.toFixed(2) + (hChangeInfo ? hChangeInfo : '');
        } else {
            // sell：股數加回
            hChangeInfo = '\n\n持股將自動回算：\n' +
                '股數 ' + fmt(h.shares) + ' → ' + fmt(h.shares + (t.shares || 0)) + '（均價不變）';
        }
    }
    showConfirm2('確定刪除這筆交易紀錄？\n\n' + summary + hChangeInfo, function() {
        // 在 splice 前先抓 trade 內容
        var trade = stockData.trades[idx];
        stockData.trades.splice(idx, 1);
        // 自動回算 holdings
        var holding = (stockData.holdings || []).find(function(x){ return x.id === trade.id; });
        if (holding) {
            if (isBuy) {
                var newShares = holding.shares - (trade.shares || 0);
                var origCost = holding.shares * holding.cost;
                var thisBuyAmount = (typeof trade.amount === 'number') ? trade.amount : (trade.shares || 0) * (trade.price || 0);
                if (newShares <= 0) {
                    holding.shares = 0;
                    // 均價保留（之後若加碼會用 holding.shares * holding.cost = 0 重新計算）
                } else {
                    var newAvg = (origCost - thisBuyAmount) / newShares;
                    holding.shares = newShares;
                    holding.cost = newAvg > 0 ? newAvg : 0;
                }
            } else {
                // sell：股數加回（均價不變）
                holding.shares += (trade.shares || 0);
            }
        }
        if (!isBuy) {
            try { _syncTradesToCashflow(); saveData(true); } catch(e){ console.error('[syncTrades]', e); }
        }
        saveStockData();
        _refreshTradesList();
        renderStock();
        toast('已刪除交易紀錄並回算持股');
    });
}

var _pieMode = 'asset'; // 'asset' | 'region' | 'holding'
function onPieModeChange(mode) {
    _pieMode = mode;
    drawStockAnalysisCharts();
}

function drawStockAnalysisCharts() {
    if (!stockData.holdings || stockData.holdings.length === 0) return;

    var assetSum = { stock: 0, bond: 0 };
    var regionSum = {};
    STOCK_REGIONS.forEach(function(r){ regionSum[r] = 0; });

    stockData.holdings.forEach(function(h) {
        var p = stockData.prices[h.id];
        var price = p ? p.price : null;
        var market = price ? h.shares * price : h.shares * h.cost;
        assetSum[getHoldingAssetType(h)] += market;
        var rg = getHoldingRegion(h);
        if (regionSum[rg] === undefined) regionSum[rg] = 0;
        regionSum[rg] += market;
    });

    // 在每塊扇形上畫百分比
    var pctLabelPlugin = {
        id: 'pctLabel',
        afterDatasetsDraw: function(chart) {
            var ctx = chart.ctx;
            var ds = chart.data.datasets[0];
            var total = ds.data.reduce(function(a, b){ return a + b; }, 0);
            if (total <= 0) return;
            var meta = chart.getDatasetMeta(0);
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.font = '600 13px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,.35)';
            ctx.shadowBlur = 2;
            meta.data.forEach(function(arc, i) {
                var v = ds.data[i];
                var pct = (v / total) * 100;
                if (pct < 4) return; // 太小的扇形不畫，避免重疊
                var pos = arc.tooltipPosition();
                ctx.fillText(pct.toFixed(1) + '%', pos.x, pos.y);
            });
            ctx.restore();
        }
    };

    // 自訂 HTML 圖例：每行「色塊 名稱 金額 (%)」，整體置中、項目左對齊
    function renderHtmlLegend(boxId, labels, data, colors) {
        var box = document.getElementById(boxId);
        if (!box) return;
        var total = data.reduce(function(a, b){ return a + b; }, 0);
        box.innerHTML = labels.map(function(lbl, i) {
            var color = colors[i % colors.length];
            var v = data[i];
            var pct = total > 0 ? (v / total * 100).toFixed(1) : '0.0';
            return '<div style="display:flex;align-items:center;gap:8px;margin-top:' + (i === 0 ? 0 : 6) + 'px">' +
                '<span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:' + color + ';flex:none"></span>' +
                '<span style="color:var(--text)">' + esc(lbl) + '　<b>' + fmt(v) + '</b> <span style="color:var(--muted)">(' + pct + '%)</span></span>' +
                '</div>';
        }).join('');
    }

    // 共用 canvas：只畫 _pieMode 選中的那張
    var canvas = document.getElementById('chart-pie');
    if (!canvas) return;
    if (_stockPieChart) { try { _stockPieChart.destroy(); } catch(_){} _stockPieChart = null; }

    var labels, data, colors;
    if (_pieMode === 'region') {
        var regionPairs = [];
        STOCK_REGIONS.forEach(function(r){
            if (regionSum[r] > 0) regionPairs.push({ label: r, value: Math.round(regionSum[r]) });
        });
        regionPairs.sort(function(a, b){ return b.value - a.value; });
        labels = regionPairs.map(function(p){ return p.label; });
        data   = regionPairs.map(function(p){ return p.value; });
        var palette = ['#1a3a5c', '#c8a45a', '#dc2626', '#16a34a', '#7c3aed', '#0891b2', '#ea580c'];
        colors = labels.map(function(_, i){ return palette[i % palette.length]; });
    } else {
        // asset (預設)
        labels = ['股票', '債券'];
        data = [Math.round(assetSum.stock), Math.round(assetSum.bond)];
        colors = ['#c8a45a', '#1a3a5c'];
    }

    _stockPieChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
        },
        plugins: [pctLabelPlugin],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            var total = ctx.dataset.data.reduce(function(a, b){ return a + b; }, 0);
                            var pct = total > 0 ? (ctx.parsed / total * 100).toFixed(1) : 0;
                            return ctx.label + '：' + fmt(ctx.parsed) + ' (' + pct + '%)';
                        }
                    }
                }
            }
        }
    });
    renderHtmlLegend('chart-pie-legend', labels, data, colors);
}

// 取得個股 modal 的「上一檔／下一檔」代號（按 id 排序，循環）
// 只含目前仍持有（股數>0）的，與持股總覽一致；已賣完的不出現在切換序列。
function _stockModalNav(stockId) {
    var ids = (stockData.holdings || [])
        .filter(function(h){ return (h.shares || 0) > 0; })
        .map(function(h){ return h.id; })
        .sort(function(a, b){ return String(a).localeCompare(String(b)); });
    if (ids.length < 2) return { prev: '', next: '' };
    var idx = ids.indexOf(stockId);
    if (idx < 0) return { prev: '', next: '' };
    var prev = ids[(idx - 1 + ids.length) % ids.length];
    var next = ids[(idx + 1) % ids.length];
    return { prev: prev, next: next };
}

// 個股 modal 的左右切換列（置中、放大）
// 一律導向 showStockCalendarModal，並保留當前分頁
function _stockModalNavBar(stockId, kind) {
    var nav = _stockModalNav(stockId);
    if (!nav.prev && !nav.next) return '';
    var btnStyle = 'flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--text)';
    var disabledStyle = btnStyle + ';opacity:0.3;cursor:not-allowed';
    var goPrev = "closeStockCalModal();showStockCalendarModal('" + esc(nav.prev) + "', _stockCalModalState.tab)";
    var goNext = "closeStockCalModal();showStockCalendarModal('" + esc(nav.next) + "', _stockCalModalState.tab)";
    var html = '<div style="display:flex;gap:10px;margin-bottom:12px;flex:none">';
    if (nav.prev) {
        html += '<button type="button" onclick="' + goPrev + '" style="' + btnStyle + '">' +
            '<i class="ti ti-chevron-left" style="font-size:18px"></i> 上一檔</button>';
    } else {
        html += '<button type="button" disabled style="' + disabledStyle + '"><i class="ti ti-chevron-left"></i> 上一檔</button>';
    }
    if (nav.next) {
        html += '<button type="button" onclick="' + goNext + '" style="' + btnStyle + '">' +
            '下一檔 <i class="ti ti-chevron-right" style="font-size:18px"></i></button>';
    } else {
        html += '<button type="button" disabled style="' + disabledStyle + '">下一檔 <i class="ti ti-chevron-right"></i></button>';
    }
    html += '</div>';
    return html;
}

// 走勢預設區間：最後一日往前 30 天（不早於 priceHistory 首筆）
function _trendDefaultRange(arr) {
    if (!arr || arr.length < 1) return null;
    var first = arr[0], last = arr[arr.length - 1];
    var lp = last.date.split('-');
    var d = new Date(+lp[0], +lp[1]-1, +lp[2]);
    d.setDate(d.getDate() - 30);
    var startDate = _localDateStr(d);
    if (startDate < first.date) startDate = first.date;
    return { start: startDate, end: last.date, first: first, last: last };
}

// 走勢分頁的 HTML
function _buildStockTrendHtml(stockId) {
    var arr = (stockData.priceHistory && stockData.priceHistory[stockId]) || [];
    if (arr.length < 2) {
        return '<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">' +
               '此股票目前累積 ' + arr.length + ' 筆價格紀錄，<br>每天自動快照一次，至少需要 2 天才能繪製走勢圖。' +
               '</div>';

    var first = arr[0], last = arr[arr.length - 1];
    var totalChg = first.price > 0 ? (last.price - first.price) / first.price * 100 : 0;
    var rng = _trendDefaultRange(arr);
    var defaultStartDate = rng.start;
    var c7   = getStockPriceChange(stockId, 7);
    var c30  = getStockPriceChange(stockId, 30);
    var c90  = getStockPriceChange(stockId, 90);
    var c365 = getStockPriceChange(stockId, 365);
    function _kpiCard(label, days, chg) {
        var hasData = chg && typeof chg.pct === 'number';

            ? ' class="section-kpi trend-kpi" data-days="' + days + '" style="cursor:pointer" title="點擊查看近 ' + label + '走勢"'

    }
    return '<div class="section-kpi-row" style="margin-bottom:14px">' +
        _kpiCard('7 日', 7, c7) +
        _kpiCard('30 日', 30, c30) +
        _kpiCard('90 日', 90, c90) +

        '<div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-bottom:8px;font-size:12px;color:var(--muted)">' +
            '<span style="display:inline-flex;align-items:center;height:28px;line-height:1">區間</span>' +
            '<input type="text" id="trend-range-start" value="' + defaultStartDate + '" placeholder="YYYY-MM-DD" readonly style="width:120px;height:28px;box-sizing:border-box;padding:0 8px;margin:0;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;line-height:28px;vertical-align:middle;background:var(--card);cursor:pointer">' +
