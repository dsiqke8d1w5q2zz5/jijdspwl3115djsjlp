// ── 除權息通知 ──
var _dividendAlerts = [];
var _dividendAlertChecked = false;

function getDividendAlertRange() {
    var raw = localStorage.getItem('dividendAlertRange');
    if (raw) {
        try {
            var o = JSON.parse(raw);
            var before = Math.max(0, Math.min(180, +o.before || 30));
            return { before: before };
        } catch (e) {}
    }
    return { before: 30 };
}

function setDividendAlertRange(before) {
    localStorage.setItem('dividendAlertRange', JSON.stringify({ before: before }));
    _dividendAlertChecked = false;
    checkDividendAlerts();
}

function checkDividendAlerts(onReady) {
    _dividendNeedsRefresh = false; // 已開始這次背景更新
    _dividendAlerts = [];
    _dividendCacheUpdatedAt = null;
    if (stockData.holdings.length === 0) {
        _dividendAlertChecked = true;
        if (typeof onReady === 'function') onReady();
        return;
    }
    var pending = stockData.holdings.length;
    var today = new Date();
    today.setHours(0,0,0,0);
    var startDate = today.getFullYear() + '-01-01';
    var range = getDividendAlertRange();
    var seen = {}; // 去重：stockId + exDate
    var holdingIds = {};
    stockData.holdings.forEach(function(h) { holdingIds[h.id] = h; });

    function _nextEventDiff(a) {
        // 選兩個日期中最近未來的（diff>=0）；若都過了，選較晚（距今負值較小者）
        var ex = a.diff, pay = a.payDiff;
        var futureCandidates = [ex, pay].filter(function(v){ return v !== null && v >= 0; });
        if (futureCandidates.length) return Math.min.apply(null, futureCandidates);
        var pastCandidates = [ex, pay].filter(function(v){ return v !== null; });
        return Math.max.apply(null, pastCandidates);
    }
    function _sortByNextEvent(a, b) { return _nextEventDiff(a) - _nextEventDiff(b); }
    function _diffDays(dateStr) {
        var norm = String(dateStr || '').slice(0, 10);
        if (!norm) return null;
        var parts = norm.split('-');
        if (parts.length !== 3) return null;
        var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        return Math.round((d - today) / MS_PER_DAY);
    }
    // 把任何日期字串歸一成 YYYY-MM-DD（兼容 2026-4-20 / 2026/4/20 / 2026-04-20T00:00 等格式）
    function _normDate(s) {
        s = String(s || '').replace(/[\/.]/g, '-').slice(0, 10);
        var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (!m) return '';
        return m[1] + '-' + (+m[2] < 10 ? '0' + +m[2] : m[2]) + '-' + (+m[3] < 10 ? '0' + +m[3] : m[3]);
    }
    function pushAlert(h, exDate, cash, stockDiv, payDate) {
        var exDateNorm = _normDate(exDate);
        if (!exDateNorm) return;
        // 去重 key：id 歸一（trim+大寫）+ 日期歸一，避免不同來源/格式造成的重複
        var idKey = String(h.id || '').trim().toUpperCase();
        var key = idKey + '|' + exDateNorm;
        // 歷史事件持久化：不論是否在未來範圍內，都先存到 dividendHistory 用於還原權息計算
        // （已賣完的持股也要存歷史：過去除息日若有持股，會影響還原權息計算，故記錄在過濾之前）
        recordDividendHistory(h.id, exDateNorm, Number(cash) || 0, Number(stockDiv) || 0);
        // 已賣完（shares<=0）的持股不顯示在「除權息提醒」清單（與持股總覽一致），但上面的歷史仍保留
        if (!(Number(h.shares) > 0)) return;
        if (seen[key]) return;
        var exDiff = _diffDays(exDateNorm);
        if (exDiff === null) return;
        var payDateNorm = _normDate(payDate);
        var payDiff = payDateNorm ? _diffDays(payDateNorm) : null;
        // 顯示規則：除息日/配息日任一在未來 before 天內，且尚未全部過完 → 顯示
        var inRangeEx = (exDiff >= 0 && exDiff <= range.before);
        var inRangePay = (payDiff !== null && payDiff >= 0 && payDiff <= range.before);
        var bothPast = (exDiff < 0 && (payDiff === null || payDiff < 0));
        if (bothPast) return;
        if (!inRangeEx && !inRangePay) return;
        seen[key] = true;
        _dividendAlerts.push({
            stockId: h.id, stockName: h.name,
            exDate: exDateNorm, payDate: payDateNorm,
            cash: cash || 0, stockDiv: stockDiv || 0,
            diff: exDiff, payDiff: payDiff
        });
    }

    // 民國年日期 → 西元 YYYY-MM-DD（"1150519" → "2026-05-19"；"115/05/19" → "2026-05-19"；"115年05月19日" → "2026-05-19"）
    function _rocToYmd(s) {
        s = String(s == null ? '' : s);
        // 抽出所有數字
        var digits = s.replace(/[^0-9]/g, '');
        if (digits.length !== 7) return '';
        var y = parseInt(digits.slice(0, 3), 10);
        if (!y) return '';
        return (y + 1911) + '-' + digits.slice(3, 5) + '-' + digits.slice(5, 7);
    }
    // 解析現金股利欄位（TWSE 有時帶 HTML 「待公告...」等字串）
    function _parseCash(v) {
        if (v == null) return 0;
        var s = String(v);
        var m = s.match(/-?\d+(\.\d+)?/);
        if (!m) return 0;
        var n = parseFloat(m[0]);
        return isNaN(n) ? 0 : n;
    }

    // (0) Apps Script 快取（含 MoneyDJ + FinMind 合併，每日 04 點自動更新）
    var cacheP = fetchWithTimeout(CLOUD_URL + '?action=dividends&format=json&t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(cache){
            if (cache && cache.updatedAt) _dividendCacheUpdatedAt = cache.updatedAt;
            var items = (cache && Array.isArray(cache.items)) ? cache.items : [];
            return items.map(function(d){
                return { stockId: d.stockId, exDate: d.exDate, cash: d.cash || 0, stockDiv: d.stockDiv || 0, payDate: d.payDate || '' };
            });
        })
        .catch(function(){ return []; });

    // (A) 從前端直連 TWSE 抓上市股 + 上市 ETF 除權息預告
    var twseP = fetchWithTimeout('https://www.twse.com.tw/exchangeReport/TWT48U?response=json&t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(j){
            var items = [];
            if (!j || j.stat !== 'OK' || !Array.isArray(j.data)) return items;
            j.data.forEach(function(row){
                // [除權除息日期, 股票代號, 名稱, 除權息, 無償配股率, ..., 現金股利, ...]
                var exDate = _rocToYmd(row[0]);
                if (!exDate) return;
                var stockId = String(row[1] || '').trim();
                var cash = _parseCash(row[7]);
                var stockDiv = _parseCash(row[4]); // 無償配股率 (每股配 N 股的 N)
                items.push({ stockId: stockId, exDate: exDate, cash: cash, stockDiv: stockDiv, payDate: '' });
            });
            return items;
        })
        .catch(function(){ return []; });

    // (B) 透過 Apps Script proxy 抓 TPEX 上櫃股 + 上櫃 ETF
    var tpexP = fetchWithTimeout(CLOUD_URL + '?action=tpex_div&t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(arr){
            var items = [];
            if (!Array.isArray(arr)) return items;
            arr.forEach(function(d){
                var exDate = _rocToYmd(d.ExRrightsExDividendDate);
                if (!exDate) return;
                var stockId = String(d.SecuritiesCompanyCode || '').trim();
                var cash = _parseCash(d.CashDividend);
                var stockDiv = _parseCash(d.StockDividendRatio); // 每股配 N 股
                items.push({ stockId: stockId, exDate: exDate, cash: cash, stockDiv: stockDiv, payDate: '' });
            });
            return items;
        })
        .catch(function(){ return []; });

    var cachePromise = Promise.all([cacheP, twseP, tpexP]).then(function(all){
        var allItems = all[0].concat(all[1]).concat(all[2]);
        _dividendCacheItems = allItems.slice();
        _saveDividendCacheLS(); // 存快取供下次立即顯示
        allItems.forEach(function(d) {
            var h = holdingIds[d.stockId];
            if (!h) return;
            pushAlert(h, d.exDate, d.cash, d.stockDiv, d.payDate);
        });
        _dividendAlerts.sort(_sortByNextEvent);
        _dividendAlertChecked = true;
        renderStock();
        _maybeAutoPopDividendModal();
        if (typeof onReady === 'function') onReady();
    }).catch(function() { if (typeof onReady === 'function') onReady(); });

    cachePromise.then(function() {
        stockData.holdings.forEach(function(h) {
            var urlPreview = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockDividend&data_id=' + h.id + '&start_date=' + startDate);
            var urlResult = _withFinMindToken('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockDividendResult&data_id=' + h.id + '&start_date=' + startDate);
            Promise.all([
                fetchWithTimeout(urlPreview).then(function(r){return r.json();}).catch(function(){return {data:[]};}),
                fetchWithTimeout(urlResult).then(function(r){return r.json();}).catch(function(){return {data:[]};})
            ])
                .then(function(results) {
                    var preview = results[0];
                    var result = results[1];
                    if (preview.status === 200 && preview.data) {
                        preview.data.forEach(function(d) {
                            var exDate = d.CashExDividendTradingDate || d.StockExDividendTradingDate || '';
                            if (!exDate) return;
                            pushAlert(h, exDate, d.CashEarningsDistribution, d.StockEarningsDistribution, d.CashDividendPaymentDate);
                        });
                    }
                    if (result.status === 200 && result.data) {
                        result.data.forEach(function(d) {
                            if (!d.date) return;
                            pushAlert(h, d.date, d.stock_and_cache_dividend, 0, '');
                        });
                    }
                    pending--;
                    if (pending <= 0) {
                        _dividendAlerts.sort(_sortByNextEvent);
                        _dividendAlertChecked = true;
                        renderStock();
                        _maybeAutoPopDividendModal();
                    }
                })
                .catch(function() {
                    pending--;
                    if (pending <= 0) { _dividendAlertChecked = true; renderStock(); }
                });
        });
    });
}

var _dividendCacheUpdatedAt = null;
var _dividendCacheItems = []; // 全部 cache 條目（per-share），用於殖利率計算

// ── 除權息快取 localStorage（讓「全年配息預估」能用上次資料立即顯示完整版面，背景再更新）──
var _DIV_CACHE_LS_KEY = 'dividendCacheItems';
function _saveDividendCacheLS() {
    try {
        localStorage.setItem(_DIV_CACHE_LS_KEY, JSON.stringify({
            items: _dividendCacheItems,
            updatedAt: _dividendCacheUpdatedAt || null,
            savedAt: Date.now()
        }));
    } catch (e) {}
}
function _loadDividendCacheLS() {
    try {
        var raw = localStorage.getItem(_DIV_CACHE_LS_KEY);
        if (!raw) return false;
        var o = JSON.parse(raw);
        if (o && Array.isArray(o.items) && o.items.length) {
            _dividendCacheItems = o.items.slice();
            if (o.updatedAt) _dividendCacheUpdatedAt = o.updatedAt;
            return true;
        }
    } catch (e) {}
    return false;
}
// 初始化：有上次快取就先灌入，並視為「已有可用資料」→ 面板直接顯示完整版（網路仍會背景更新）
var _dividendNeedsRefresh = false; // 用快取先顯示時，標記仍需背景更新一次
if (_loadDividendCacheLS()) { _dividendAlertChecked = true; _dividendNeedsRefresh = true; }

function renderDividendAlerts() {
    var settingsBtn = '<button onclick="event.stopPropagation();openDividendAlertSettings()" title="提醒天數設定" style="background:none;border:none;cursor:pointer;color:var(--lux-navy);padding:0 4px;font-size:14px;"><i class="ti ti-settings"></i></button>';
    if (!_dividendAlertChecked) {
        return '<div class="dividend-alert-compact" style="opacity:0.8;">' +
            '<span class="alert-title-compact"><i class="ti ti-speakerphone"></i> 除權息</span>' +
            '<span class="alert-summary" style="color:var(--text-light);font-size:12px;"><i class="ti ti-loader-2" style="animation:div-spin 1s linear infinite;display:inline-block;"></i> 載入中…</span>' +
            settingsBtn +
            '</div>';
    }
    var range = getDividendAlertRange();
    var count = _dividendAlerts.length;
    var summary;
    if (count === 0) {
        summary = '<span style="color:var(--text-light);font-size:12px;">未來 ' + range.before + ' 天內無除權息</span>';
    } else {
        var first = _dividendAlerts[0];
        // 摘要顯示下一個還沒到的事件（除息或配息）
        var showDate, showLabel;
        if (first.diff >= 0) {
            showDate = first.exDate;
            showLabel = first.diff === 0 ? '（今天除息）' : '除息（' + first.diff + ' 天後）';
        } else if (first.payDiff !== null && first.payDiff >= 0) {
            showDate = first.payDate;
            showLabel = first.payDiff === 0 ? '（今天配息）' : '配息（' + first.payDiff + ' 天後）';
        } else {
            showDate = first.exDate;
            showLabel = '（已除息）';
        }
        // 日期：桌機顯示完整 YYYY-MM-DD；手機在同一年時簡化為 M/D，跨年才保留年份
        var nowY = new Date().getFullYear();
        var dParts = String(showDate).split('-'); // ['YYYY','MM','DD']
        var shortDate = (Number(dParts[0]) === nowY)
            ? (Number(dParts[1]) + '/' + Number(dParts[2]))
            : (dParts[0] + '/' + Number(dParts[1]) + '/' + Number(dParts[2]));
        summary = '<b>' + esc(first.stockId) + ' ' + esc(first.stockName) + '</b> ' +
                  '<span class="alert-date-full">' + esc(shortDate) + '</span>' +
                  '<span class="alert-date-short">' + esc(shortDate) + '</span> ' + showLabel;
        if (count > 1) summary += ' <span style="color:var(--text-light);">+' + (count-1) + ' 筆</span>';
    }
    var onclick = count > 0 ? ' onclick="showDividendAlertModal()"' : '';
    var cursor = count > 0 ? 'cursor:pointer;' : '';
    return '<div class="dividend-alert-compact"' + onclick + ' style="' + cursor + '">' +
        '<span class="alert-title-compact"><i class="ti ti-speakerphone"></i> 除權息</span>' +
        '<span class="alert-summary">' + summary + '</span>' +
        settingsBtn +
        '</div>';
}

// 計算過去 12 個月（從今天往前）的每股現金股利加總，用來估年化殖利率
// 資料來源：dividend cache（每筆 cash 是 per-share，與 stockData.dividends 的總額不同）
function _trailing12mCashPerShare(stockId) {
    var now = new Date();
    var oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
    var seen = {}, sum = 0;
    (_dividendCacheItems || []).forEach(function(item) {
        if (item.stockId !== stockId) return;
        if (!item.cash || item.cash <= 0) return;
        var dateStr = item.exDate;
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return;
        if (d < oneYearAgo || d > now) return;
        var key = stockId + '|' + dateStr;
        if (seen[key]) return;
        seen[key] = true;
        sum += item.cash;
    });
    return sum;
}

// 近一年配息「次數」（去重，cash>0）
function _trailing12mDivCount(stockId) {
    var now = new Date();
    var oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
    var seen = {}, cnt = 0;
    (_dividendCacheItems || []).forEach(function(item) {
        if (item.stockId !== stockId || !item.cash || item.cash <= 0) return;
        var d = new Date(item.exDate);
        if (isNaN(d.getTime())) return;
        if (d < oneYearAgo || d > now) return;
        var key = stockId + '|' + item.exDate;
        if (seen[key]) return;
        seen[key] = true;
        cnt++;
    });
    return cnt;
}

// 最近一次現金配息額（依除息日最新者，cash>0）；無則回 0
function _latestCashPerShare(stockId) {
    var latest = null;
    (_dividendCacheItems || []).forEach(function(item) {
        if (item.stockId !== stockId || !item.cash || item.cash <= 0) return;
        if (!item.exDate) return;
        if (!latest || item.exDate > latest.exDate) latest = item;
    });
    return latest ? latest.cash : 0;
}

// 年化每股配息：配滿一年用近一年實配加總；新標的(近一年次數<官方頻率應有次數)用「最新一次配息×頻率次數」推估
// 回傳 { annualCps, isEstimate, count, freqCount, ttmCps, unitCps }
function _annualizedCashPerShare(stockId) {
    var ttmCps = _trailing12mCashPerShare(stockId);
    var cnt = _trailing12mDivCount(stockId);
    var officialFreq = (_etfInfoCache[stockId] && _etfInfoCache[stockId].data && _etfInfoCache[stockId].data.dividendFreq) || '';
    var freqCount = { '月配': 12, '季配': 4, '半年配': 2, '年配': 1 }[officialFreq] || 0;
    var annualCps = ttmCps, isEstimate = false, unitCps = 0;
    if (freqCount > 0 && cnt > 0 && cnt < freqCount) {
        // 還沒配滿一年：用「最新一次配息額」×頻率次數推估（反映目前配息水準，不被舊的較低配息拉低）
        unitCps = _latestCashPerShare(stockId);
        annualCps = unitCps * freqCount;
        isEstimate = true;
    }
    return { annualCps: annualCps, isEstimate: isEstimate, count: cnt, freqCount: freqCount, ttmCps: ttmCps, unitCps: unitCps };
}

// 配息/除息「當天」自動彈出提醒視窗：每天最多彈一次（localStorage 記當日字串去重）
function _maybeAutoPopDividendModal() {
    if (!_dividendAlertChecked || !_dividendAlerts || _dividendAlerts.length === 0) return;
    // 今天有「除息日」或「配息日」的標的才彈
    var hasToday = _dividendAlerts.some(function(a) {
        return a.diff === 0 || a.payDiff === 0;
    });
    if (!hasToday) return;
    var t = new Date();
    var todayKey = t.getFullYear() + '-' +
        ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
    try {
        if (localStorage.getItem('dividendAutoPopShown') === todayKey) return; // 今天已彈過
        localStorage.setItem('dividendAutoPopShown', todayKey);
    } catch (e) {}
    showDividendAlertModal();
}

function showDividendAlertModal() {
    if (_dividendAlerts.length === 0) return;
    var ov = document.createElement('div');

        var price = _currentPriceFor(a.stockId);

        var ids = (stockData.holdings || []).map(function(h){ return h.id; }).filter(Boolean).join(',');

            .then(function(r){ return r.json(); })

                ov.remove();

                // 重抓三路（含剛更新的後端快取），抓完才重開提醒視窗顯示最新

                toast('重新抓取失敗，請稍後再試');
            });
    };

    // 持股中的 ETF 若還沒拿到官方配息頻率，背景抓 etfinfo（用於殖利率年化推估），抓完重畫一次
    var etfNeedFreq = (stockData.holdings || []).filter(function(h){
        if (!/^00/.test(String(h.id))) return false;
        var ec = _etfInfoCache[h.id];
        return !(ec && ec.data && ec.data.dividendFreq);
    });
    if (etfNeedFreq.length && !showDividendAlertModal._freqFetching) {
        showDividendAlertModal._freqFetching = true;
        var pend = etfNeedFreq.length;
        etfNeedFreq.forEach(function(h){
            var ec = _etfInfoCache[h.id];
            if (ec && ec.data && !ec.data.dividendFreq) ec.fetchedAt = 0; // 繞過 TTL 重抓舊快取

        });

}

// 上個月的民國年月字串，例如 "115/3"
function _lastMonthKey() {
    var now = new Date();
    var y = now.getFullYear();
    var lastMonthIdx = now.getMonth() - 1; // 0-11；-1 代表去年 12 月
    if (lastMonthIdx < 0) { lastMonthIdx = 11; y -= 1; }
    return (y - 1911) + '/' + (lastMonthIdx + 1);
}

// 把 "115/3" 轉成排序 key（字串比較時 "115/3" < "115/12"，所以要 pad）
function _monthSortKey(mk) {
    var parts = String(mk || '').split('/');
    if (parts.length !== 2) return '0000/00';
    var y = parts[0];
    var m = parts[1];
    if (m.length < 2) m = '0' + m;
    return y + '/' + m;
}

function _sortedMonthly() {
    var list = (DATA.monthly || []).slice();
    list.sort(function(a, b) {
        var ka = _monthSortKey(a.month);
        var kb = _monthSortKey(b.month);
        return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    return list;
}

var _trendChart = null;
var _trendRange = 12; // 近 N 個月；0 = 全部；-1 = 自訂
var _trendCustom = { start: null, end: null }; // 自訂範圍，民國年月字串

var _trendYearOpen = {}; // 歷史表格年份展開狀態 { '115': true, '114': false }
var _trendYearSel = null; // 歷史表格目前顯示的年份（左右切換），null = 自動取最新

        customLabel = _trendCustom.start + ' ~ ' + _trendCustom.end;
    }

    html += '</div>';

    if (all.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:var(--muted)">尚未新增任何月記錄。<br>點上方「＋ 新增上個月」開始記錄。</div>';

    ].forEach(function(s) {

        html += '<button class="trend-toggle-btn" onclick="toggleTrendLine(\'' + s[0] + '\')" style="padding:6px 14px;border:2px solid ' + s[2] + ';border-radius:6px;background:' + (on ? s[2] : 'var(--card)') + ';color:' + (on ? 'white' : s[2]) + ';font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">' + s[1] + '</button>';
    });
    html += '</div>';
    html += '<canvas id="trend-chart" style="max-height:280px;display:block"></canvas>';
    html += '</div>';
    html += '</div>'; // trend-grid-left

    // 右：年度表格列
    html += '<div class="trend-grid-right">';

    // 歷史表格：按年分組、可收合

    var byYear = {};
    all.forEach(function(r) {

        byYear[y].push(r);

    var curY = _trendYearSel;
    if (!curY || years.indexOf(curY) < 0) curY = latestYear;
    _trendYearSel = curY;

    var idx = years.indexOf(curY);
    var prevY = idx > 0 ? years[idx - 1] : null;            // 較舊年份
    var nextY = idx < years.length - 1 ? years[idx + 1] : null; // 較新年份

    var rows = byYear[curY] || [];
    var yIncome = 0, yExpense = 0;
    rows.forEach(function(r) { yIncome += (r.income || 0); yExpense += (r.expense || 0); });

    var aOn = aBase + ';cursor:pointer', aOff = aBase + ';opacity:0.3;cursor:not-allowed';
    // 把年份清單暫存到全域，讓中間框點下去可叫出年份選單直接挑年
    window._yearPickerData = window._yearPickerData || {};
    window._yearPickerData['setTrendYear'] = years.slice();

    html += '<div class="trend-year-card" style="background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden">';

    html += '<div style="padding:12px 16px;background:#F1EDE8;border-bottom:1px solid var(--border)">';

    html += nextY ? '<button type="button" onclick="setTrendYear(\'' + esc(nextY) + '\')" title="下一年" style="' + aOn + '"><i class="ti ti-chevron-right"></i></button>'

    html += '</div>';
    html += '<div class="trend-year-summary" style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px">';
    html += '<span><span style="color:var(--muted)">收入 </span><b style="color:var(--green)">' + fmt(yIncome) + '</b></span>';
    html += '<span><span style="color:var(--muted)">支出 </span><b style="color:var(--red)">' + fmt(yExpense) + '</b></span>';
    html += '<span><span style="color:var(--muted)">結餘 </span><b style="color:' + yBalColor + '">' + (yBalance >= 0 ? '+' : '') + fmt(yBalance) + '</b></span>';
    html += '</div></div>';

    // 月份明細表
    html += '<div class="table-wrap"><table class="stock-table monthly-table" style="margin:0"><thead><tr>';
    html += '<th>月份</th><th>收入</th><th>支出</th><th>結餘</th><th></th>';
    html += '</tr></thead><tbody>';
    var rowsDesc = rows.slice().reverse();
    rowsDesc.forEach(function(r) {
        var balance = (r.income || 0) - (r.expense || 0);
        var balColor = balance >= 0 ? 'var(--green)' : 'var(--red)';

        html += '<td style="cursor:pointer;font-weight:600" onclick="editMonthly(\'' + esc(r.month) + '\')">' + esc(r.month) + '</td>';

    html += '</div>'; // trend-grid

function setTrendRange(n) {
    _trendRange = n;
    _trendByYear = false; // 點範圍鈕 → 離開「依年」模式，回到跨年範圍
    renderTrend();
}

function openTrendCustomRange() {
    var all = _sortedMonthly();
    if (all.length === 0) { toast('目前沒有任何月記錄', true); return; }
    var defaultStart = _trendCustom.start || all[0].month;
    var defaultEnd = _trendCustom.end || all[all.length-1].month;
    var options = all.map(function(r) {
        return '<option value="' + esc(r.month) + '">' + esc(r.month) + '</option>';
    }).join('');
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var html = '<div class="modal"><h3>自訂範圍</h3>';
    html += '<label style="font-size:12px;color:var(--muted)">起始月份</label>';
    html += '<select id="tc-start">' + options + '</select>';
    html += '<label style="font-size:12px;color:var(--muted)">結束月份</label>';
    html += '<select id="tc-end">' + options + '</select>';
    html += '<div class="modal-btns"><button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
            '<button class="btn-primary" id="tc-save">套用</button></div></div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);
    document.getElementById('tc-start').value = defaultStart;
    document.getElementById('tc-end').value = defaultEnd;
    document.getElementById('tc-save').onclick = function() {
        var s = document.getElementById('tc-start').value;
        var e = document.getElementById('tc-end').value;
        if (_monthSortKey(s) > _monthSortKey(e)) { toast('起始不可晚於結束', true); return; }
        _trendCustom.start = s;
        _trendCustom.end = e;
        _trendRange = -1;
        ov.remove();
        renderTrend();
    };
}

function toggleOverview(section) {
    _overviewOpen[section] = !_overviewOpen[section];

function toggleTrendYear(y) {
    _trendYearOpen[y] = !_trendYearOpen[y];
    renderTrend();

function setTrendYear(y) {
    _trendYearSel = y;
    _trendByYear = true; // 切年 → 左圖只顯示該年（直到使用者點上方範圍鈕才回跨年）
    renderTrend();

function toggleTrendLine(key) {
    _trendShow[key] = !_trendShow[key];
    // 至少要留一條，避免空圖
    if (!_trendShow.income && !_trendShow.expense && !_trendShow.balance) {
        _trendShow[key] = true;
        return;
    }
    renderTrend();
}

function _drawTrendChart(all) {
    var canvas = document.getElementById('trend-chart');
    if (!canvas || typeof Chart === 'undefined') return;

    // 根據模式切片：依年（跟右表同年）優先，否則照 _trendRange
    var data;
    if (_trendByYear && _trendYearSel) {
        // 左圖只顯示右表選的那一年（民國年），與右表連動
        data = all.filter(function(r){ return String(r.month).split('/')[0] === String(_trendYearSel); });
    } else if (_trendRange > 0) {
        data = all.slice(-_trendRange);
    } else if (_trendRange === -1 && _trendCustom.start && _trendCustom.end) {
        var s = _monthSortKey(_trendCustom.start);
        var e = _monthSortKey(_trendCustom.end);
        data = all.filter(function(r) {
            var k = _monthSortKey(r.month);
            return k >= s && k <= e;
        });
    } else {
        data = all;
    }

    var labels = data.map(function(r){ return r.month; });
    var incomes = data.map(function(r){ return r.income || 0; });
    var expenses = data.map(function(r){ return r.expense || 0; });
    var balances = data.map(function(r){ return (r.income || 0) - (r.expense || 0); });

    // 銷毀舊圖
    if (_trendChart) { _trendChart.destroy(); _trendChart = null; }

    _trendChart = new Chart(canvas, {

// 新增或編輯的共用表單
// forceCustom: true 時預設不帶「上個月」而讓使用者填
function _monthlyForm(existing, forceCustom) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var defaultMonth = existing ? existing.month : (forceCustom ? '' : _lastMonthKey());
    var title = existing ? '編輯月記錄' : '新增月記錄';
    var html = '<div class="modal"><h3>' + title + '</h3>';
    html += '<label style="font-size:12px;color:var(--muted)">月份（民國年/月，例如 115/3）</label>';
    html += '<input type="text" id="mo-month" placeholder="115/3" value="' + esc(defaultMonth) + '"' + (existing ? ' readonly style="background:#f5f5f5"' : '') + '>';
    html += '<label style="font-size:12px;color:var(--muted)">當月收入</label>';
    html += '<input type="number" id="mo-income" placeholder="0" step="1" value="' + (existing ? existing.income : '') + '">';
    html += '<label style="font-size:12px;color:var(--muted)">當月支出</label>';
    html += '<input type="number" id="mo-expense" placeholder="0" step="1" value="' + (existing ? existing.expense : '') + '">';
    html += '<label style="font-size:12px;color:var(--muted)">備註（選填）</label>';
    html += '<input type="text" id="mo-note" placeholder="" value="' + esc(existing ? (existing.note || '') : '') + '">';
    html += '<div class="modal-btns"><button onclick="this.closest(\'.overlay\').remove()">取消</button>' +
            '<button class="btn-primary" id="mo-save">' + (existing ? '儲存' : '新增') + '</button></div></div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);
    document.getElementById('mo-save').onclick = function() {
        var month = document.getElementById('mo-month').value.trim();
        var income = parseInt(document.getElementById('mo-income').value) || 0;
        var expense = parseInt(document.getElementById('mo-expense').value) || 0;
        var note = document.getElementById('mo-note').value.trim();
        if (!/^\d{2,3}\/([1-9]|1[0-2])$/.test(month)) { toast('月份格式錯誤（例：115/3）', true); return; }
        if (income < 0 || expense < 0) { toast('金額不可為負', true); return; }
        if (!DATA.monthly) DATA.monthly = [];
        // 新增時檢查重複
        if (!existing) {
            var dup = DATA.monthly.find(function(r){ return r.month === month; });
            if (dup) { toast('該月份已存在，請改為編輯', true); return; }
            DATA.monthly.push({ month: month, income: income, expense: expense, note: note });
        } else {
            existing.income = income;
            existing.expense = expense;
            existing.note = note;
        }
        saveData();
        ov.remove();
        renderTrend();
        toast(existing ? '已更新 ' + month : '已新增 ' + month);
    };
}

function addMonthly(forceCustom) { _monthlyForm(null, forceCustom === true); }

function editMonthly(month) {
    var r = (DATA.monthly || []).find(function(x){ return x.month === month; });
    if (!r) return;
    _monthlyForm(r, false);
}

    showConfirm('確定刪除 ' + month + ' 的月記錄？', function() {
        DATA.monthly = (DATA.monthly || []).filter(function(x){ return x.month !== month; });

}

function renderStockHoldings() {
    var html = '';

    // 更新按鈕列
    html += '<div class="stock-refresh-bar">';
    html += '<button class="btn-refresh" onclick="buyHolding(null)" title="新增持股（可選擇是否記入交易紀錄）"><i class="ti ti-plus"></i> <span class="lbl-full">新增持股</span><span class="lbl-short">新增</span></button>';
    html += '<button class="btn-refresh" id="btn-fetch-price" onclick="refreshPrices()"><i class="ti ti-antenna-bars-5"></i> <span class="lbl-full">更新股價</span><span class="lbl-short">更新</span></button>';
    html += '<button class="btn-refresh" onclick="showStockSearchModal()" title="輸入股票代號，查任意個股的漲跌日曆"><i class="ti ti-search"></i> <span class="lbl-full">搜尋個股</span><span class="lbl-short">搜尋</span></button>';
    html += '<span class="last-update" style="color:var(--muted)">' + _stockPriceFreshnessLabel() + '</span>';
    html += '<button class="btn-refresh btn-drop-calc" onclick="showDropCalcModal()" title="跌幅分批試算"><i class="ti ti-calculator"></i> <span class="lbl-full">跌幅試算</span><span class="lbl-short">試算</span></button>';
    // 標準/緊湊 行高切換（移到此按鈕列，跟跌幅試算同排）
    html += '<button class="btn-refresh" onclick="toggleStockCompact()" title="切換表格行高鬆緊" style="' + (_stockCompact?'background:var(--lux-navy);color:#fff':'') + '"><i class="ti ti-' + (_stockCompact?'baseline-density-medium':'baseline-density-small') + '"></i> <span class="lbl-full">' + (_stockCompact?'緊湊':'標準') + '</span><span class="lbl-short">' + (_stockCompact?'緊湊':'標準') + '</span></button>';
    html += '</div>';

    // 券商過濾後的持股清單（保留原 stockData.holdings 索引以便 editHolding 對應）
    // 並過濾掉 shares <= 0 的持股（已賣完，但 trades 仍保留）
    var visibleHoldings = (currentBroker
        ? stockData.holdings.filter(function(h){ return (h.broker || '') === currentBroker; })
        : stockData.holdings
    ).filter(function(h){ return (h.shares || 0) > 0; });

    // 計算總覽（用過濾後的範圍）
    var totalCost = 0, totalMarket = 0, todayPL = 0, totalCumDiv = 0;
    visibleHoldings.forEach(function(h) {
        var cost = h.shares * h.cost;
        var p = stockData.prices[h.id];
        var market = p ? h.shares * p.price : cost;
        totalCost += cost;
        totalMarket += market;
        totalCumDiv += _cumCashDividend(h.id); // 累積已領現金股利（摘要列「含息損益」用）
        // 今日損益：優先用 Yahoo 即時 change（相對前一交易日官方收盤、最即時也最準）；
        // 沒抓到才退回 priceHistory 最後兩筆相減
        var ch = null;
        if (p && typeof p.change === 'number') ch = p.change;
        if (ch === null) {
            var phArr = (stockData.priceHistory && stockData.priceHistory[h.id]) || [];
            if (phArr.length >= 2) {
                var l = phArr[phArr.length - 1], pv = phArr[phArr.length - 2];
                if (typeof l.price === 'number' && typeof pv.price === 'number') ch = l.price - pv.price;
            }
        }
        if (ch !== null) todayPL += h.shares * ch;
    });
    var totalPL = totalMarket - totalCost;
    var totalRate = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;
    // 含息損益＝價差損益 + 全部累積已領現金股利；含息報酬率＝含息損益 / 成本
    var totalPLwithDiv = totalPL + totalCumDiv;
    var totalRateWithDiv = totalCost > 0 ? (totalPLwithDiv / totalCost) * 100 : 0;

    // 加權指數內容（併入下方摘要列同一卡片，省一行空間）
    var _idxHtml = '';
    if (_twseIndex && typeof _twseIndex.price === 'number') {
        var twNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
        var twToday = twNow.getFullYear() + '-' + ('0'+(twNow.getMonth()+1)).slice(-2) + '-' + ('0'+twNow.getDate()).slice(-2);
        function _twDateFromUnix(sec) {
            if (!sec) return '';
            var d = new Date(new Date(sec * 1000).toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
            return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
        }
        var idxChg = _twseIndex.change || 0;
        var idxPct = _twseIndex.pct || 0;
        var idxColor = signColor(idxChg);
        var arrow = idxChg > 0 ? '▲' : (idxChg < 0 ? '▼' : '');
        var idxDate = _twDateFromUnix(_twseIndex.time);
        _idxHtml = '<span style="color:var(--muted)">加權 <b style="color:var(--text)">' + _twseIndex.price.toFixed(2) + '</b> ' +
            '<span style="color:' + idxColor + ';font-weight:600">' + arrow + (idxChg>=0?'+':'') + idxChg.toFixed(2) + '（' + (idxPct>=0?'+':'') + idxPct.toFixed(2) + '%）</span>' +
            ((idxDate && idxDate !== twToday) ? ' <span style="font-size:11px">(' + idxDate.slice(5).replace('-', '/') + ')</span>' : '') +
            '</span>' +
            '<span style="color:var(--border)">｜</span>'; // 與持股摘要之間的分隔線
    }

    // 摘要列：加權指數 ｜ 成本→市值→損益→含息損益→今日損益（合併成同一卡片一行）
    html += '<div class="stock-summary-bar" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;font-size:14px;margin-bottom:10px;padding:8px 12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)">';
    html += _idxHtml;
    html += '<span style="color:var(--muted)">成本 <b style="color:var(--text)">' + fmt(totalCost) + '</b></span>';
    html += '<span style="color:var(--muted)">市值 <b style="color:var(--lux-gold)">' + fmt(totalMarket) + '</b></span>';
    html += '<span style="color:var(--muted)"><span class="lbl-full">損益</span><span class="lbl-short">累積損益</span> <b class="' + (totalPL>=0?'pos':'neg') + '">' + (totalPL>=0?'+':'') + fmt(totalPL) + ' (' + fmtRate(totalRate) + ')</b></span>';
    // 含息損益：價差損益 + 累積已領現金股利（只在實際有股利時顯示，否則與損益相同無意義）
    if (totalCumDiv > 0) {
        html += '<span style="color:var(--muted)">含息損益 <b class="' + (totalPLwithDiv>=0?'pos':'neg') + '">' + (totalPLwithDiv>=0?'+':'') + fmt(totalPLwithDiv) + ' (' + fmtRate(totalRateWithDiv) + ')</b></span>';
    }
    html += '<span style="color:var(--muted)">今日損益 <b class="' + (todayPL>=0?'pos':'neg') + '">' + (todayPL>=0?'+':'') + fmt(todayPL) + '</b></span>';
    html += '</div>';

    // 持股明細表
    if (stockData.holdings.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:var(--muted)">尚未新增持股，請點擊上方「＋ 新增持股」開始</div>';
        return html;
    }
    if (visibleHoldings.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:var(--muted)">「' + esc(currentBroker) + '」目前沒有持股</div>';
        return html;
    }

    var vis = getStockColVisible();

    // 排序狀態
    if (!window._stockSort) window._stockSort = { col: null, dir: 'desc' };
    var ss = window._stockSort;
    function _sArr(col) {
        if (ss.col !== col) return ' <span style="color:#bbb;font-size:11px">⇅</span>';
        return ' <span style="color:var(--lux-gold);font-size:11px">' + (ss.dir === 'desc' ? '▼' : '▲') + '</span>';
    }

    // 每列預先計算（保留原索引讓 editHolding 仍能對應到 stockData.holdings）
    var rows = stockData.holdings.map(function(h, idx) {
        var p = stockData.prices[h.id];
        var curPrice = p ? p.price : null;
        // change：優先用 Yahoo 即時 change（相對前一交易日官方收盤、最即時也最準）；
        // 沒抓到才退回 priceHistory 最後兩筆相減
        var change = null;
        if (p && typeof p.change === 'number') change = p.change;
        if (change === null) {
            var phArr = (stockData.priceHistory && stockData.priceHistory[h.id]) || [];
            if (phArr.length >= 2) {
                var last = phArr[phArr.length - 1];
                var prev = phArr[phArr.length - 2];
                if (typeof last.price === 'number' && typeof prev.price === 'number') {
                    change = last.price - prev.price;
                }
            }
        }
        var changePct = (change !== null && curPrice !== null && curPrice - change !== 0) ? (change / (curPrice - change)) * 100 : null;
        var cost = h.shares * h.cost;
        var market = curPrice ? h.shares * curPrice : null;
        var pl = market !== null ? market - cost : null;
        var rate = (pl !== null && cost > 0) ? (pl / cost) * 100 : null;
        var weight = totalMarket > 0 && market !== null ? (market / totalMarket) * 100 : null;
        var dayPL = change !== null ? h.shares * change : null;
        var pledgedShares = 0;
        var lentShares = 0;
        if (stockData.pledges) stockData.pledges.forEach(function(pp){
            if (pp.stockId !== h.id) return;
            if (_pledgeType(pp) === 'lend') lentShares += pp.shares;
            else pledgedShares += pp.shares;
        });
        var chg7d   = getStockPriceChange(h.id, 7);
        var chg30d  = getStockPriceChange(h.id, 30);
        // 累積現金股利：股利紀錄(stockData.dividends)中該股 cash 加總（已領現金股利，與被動收入/收入股利同源）
        var cumDiv = _cumCashDividend(h.id);
        // 含息總損益 = 價差損益(pl) + 累積已領現金股利；含息報酬率 = 含息總損益 / 成本
        var plWithDiv = pl !== null ? pl + cumDiv : (cumDiv > 0 ? cumDiv : null);
        var rateWithDiv = (plWithDiv !== null && cost > 0) ? (plWithDiv / cost) * 100 : null;
        return { h:h, idx:idx, curPrice:curPrice, change:change, changePct:changePct, cost:cost, market:market, pl:pl, rate:rate, weight:weight, dayPL:dayPL, pledgedShares:pledgedShares, lentShares:lentShares, chg7d:chg7d, chg30d:chg30d, cumDiv:cumDiv, plWithDiv:plWithDiv, rateWithDiv:rateWithDiv };
    });
    // 套用券商過濾
    if (currentBroker) {
        rows = rows.filter(function(r){ return (r.h.broker || '') === currentBroker; });
    }
    // 過濾已賣完的持股（shares <= 0），但 trades 紀錄仍保留在報酬日曆
    rows = rows.filter(function(r){ return (r.h.shares || 0) > 0; });

    // 預設排序（使用者未手動指定欄位時）：盤中依「今日損益」由大到小，收盤後依代號由小到大。
    if (!ss.col) {
        if (_isMarketHours()) {
            var _nl = -Infinity;
            rows.sort(function(a, b){
                var va = a.dayPL !== null ? a.dayPL : _nl;
                var vb = b.dayPL !== null ? b.dayPL : _nl;
                if (va !== vb) return vb - va; // 大到小
                return String(a.h.id || '').localeCompare(String(b.h.id || '')); // 同值再依代號
            });
        } else {
            rows.sort(function(a, b){ return String(a.h.id || '').localeCompare(String(b.h.id || '')); });
        }
    } else {
        // 先依代號排，作為手動排序的同值穩定基準
        rows.sort(function(a, b){ return String(a.h.id || '').localeCompare(String(b.h.id || '')); });
    }

    // 排序（使用者手動點欄位）
    if (ss.col) {
        var dir = ss.dir === 'desc' ? -1 : 1;
        var nullLow = -Infinity;
        rows.sort(function(a, b) {
            var va, vb;
            switch (ss.col) {
                case 'name':    return (a.h.id || '').localeCompare(b.h.id || '') * dir;
                case 'dayPL':   va = a.dayPL !== null ? a.dayPL : nullLow; vb = b.dayPL !== null ? b.dayPL : nullLow; break;
                case 'price':   va = a.curPrice !== null ? a.curPrice : nullLow; vb = b.curPrice !== null ? b.curPrice : nullLow; break;
                case 'pl':      va = a.pl !== null ? a.pl : nullLow; vb = b.pl !== null ? b.pl : nullLow; break;
                case 'cumDiv':  va = a.cumDiv || 0; vb = b.cumDiv || 0; break;
                case 'plWithDiv': va = a.plWithDiv !== null ? a.plWithDiv : nullLow; vb = b.plWithDiv !== null ? b.plWithDiv : nullLow; break;
                case 'shares':  va = a.h.shares || 0; vb = b.h.shares || 0; break;
                case 'cost':    va = a.h.cost || 0; vb = b.h.cost || 0; break;
                case 'market':  va = a.market !== null ? a.market : nullLow; vb = b.market !== null ? b.market : nullLow; break;
                case 'chg7d':   va = (a.chg7d   && typeof a.chg7d.pct   === 'number') ? a.chg7d.pct   : nullLow; vb = (b.chg7d   && typeof b.chg7d.pct   === 'number') ? b.chg7d.pct   : nullLow; break;
                case 'chg30d':  va = (a.chg30d  && typeof a.chg30d.pct  === 'number') ? a.chg30d.pct  : nullLow; vb = (b.chg30d  && typeof b.chg30d.pct  === 'number') ? b.chg30d.pct  : nullLow; break;
                default: return 0;
            }
            return (va - vb) * dir;

                    : '';
                // 股利提示：滑過顯示累積股利金額

    html += '</tbody></table></div>';

}

// 顯示單檔歷史股利紀錄 modal（按年份分組）
function showStockDividendHistory(stockId) {
    var holding = (stockData.holdings || []).find(function(h){ return h.id === stockId; });
    var label = holding ? (holding.id + ' ' + (holding.name || '')) : stockId;
    var records = (stockData.dividends || []).filter(function(d){ return d.stockId === stockId; });
    // 按日期由新到舊
    records.sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });

    // 按年份分組（用西元年 key 排序，顯示時轉民國年）
    var byYear = {};
    var grandCash = 0, grandStock = 0;
    records.forEach(function(d) {
        var y = d.date ? d.date.substring(0,4) : '未知';
        if (!byYear[y]) byYear[y] = { items: [], cash: 0, stock: 0 };
        byYear[y].items.push(d);
        byYear[y].cash += (d.cash || 0);
        byYear[y].stock += (d.stockShares || 0);
        grandCash += (d.cash || 0);
        grandStock += (d.stockShares || 0);
    });
    var years = Object.keys(byYear).sort(function(a, b){ return b.localeCompare(a); });
    function _yearToROC(y) {
        var n = parseInt(y, 10);
        return isNaN(n) ? y : String(n - 1911);
    }

    var ov = document.createElement('div');
    ov.className = 'overlay';
    var html = '<div class="modal" style="width:560px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column">';
    html += '<h3><i class="ti ti-history"></i> ' + esc(label) + ' 歷史股利</h3>';
    if (records.length === 0) {
        html += '<div style="padding:30px;text-align:center;color:var(--muted)">尚無股利紀錄</div>';
    } else {
        html += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">累積：現金 <b style="color:var(--lux-navy)">$' + fmt(grandCash) + '</b>';
        if (grandStock > 0) html += '　股票 <b style="color:var(--lux-navy)">' + grandStock.toFixed(2) + ' 股</b>';
        html += '　共 ' + records.length + ' 筆</div>';
        html += '<div style="flex:1;overflow-y:auto;border-top:1px solid var(--border)">';
        years.forEach(function(y, yi) {
            var g = byYear[y];
            // 年份標題列：可點擊開合，預設收合
            html += '<div onclick="toggleDivHistYear(this)" style="display:flex;align-items:center;gap:6px;padding:8px 4px;font-weight:700;color:var(--lux-navy);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none">';
            html += '<i class="ti ti-chevron-right" style="font-size:14px;color:var(--muted);transition:transform .15s"></i>';
            html += '<span>' + _yearToROC(y) + ' 年</span>';
            html += '<span style="font-size:12px;font-weight:400;color:var(--muted)">$' + fmt(g.cash);
            if (g.stock > 0) html += '　' + g.stock.toFixed(2) + ' 股';
            html += '　(' + g.items.length + ' 筆)</span></div>';
            // 該年明細：預設隱藏
            html += '<div class="div-hist-items" style="display:none">';
            g.items.forEach(function(d) {
                html += '<div style="display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--border);font-size:13px">';
                html += '<span>' + esc(_toROCDate(d.date) || '—') + '</span>';
                var amts = [];
                if (d.cashPerShare > 0) amts.push('每股 <b style="color:var(--lux-navy)">' + d.cashPerShare.toFixed(3) + '</b>');
                if (d.cash > 0) amts.push('現金 <b style="color:var(--green)">' + fmt(d.cash) + '</b>');
                if (d.stockShares > 0) amts.push('股票 <b style="color:var(--green)">' + d.stockShares.toFixed(2) + ' 股</b>');
                html += '<span>' + (amts.join('　') || '—') + '</span>';
                html += '</div>';
            });
            html += '</div>';
        });
        html += '</div>';
    }
    html += '<div class="modal-btns" style="margin-top:12px"><button class="btn-primary" onclick="this.closest(\'.overlay\').remove()">關閉</button></div>';
    html += '</div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);
}

// 配息預估：各月逐檔明細（key 'YYYY-M' → [{id,name,amt,cpsPerTime,shares}]），供月份點擊視窗用
var _divForecastDetail = {};
// 把 'YYYY-M' 轉成可比較的數值（年*12+月），供月份排序/前後切換
function _ymNum(ym) {
    var p = String(ym).split('-');
    return (parseInt(p[0], 10) || 0) * 12 + (parseInt(p[1], 10) || 0);
}

function showDivMonthDetail(ym, label) {
    var ov = document.createElement('div');
    ov.className = 'overlay';
    // 頂端對齊（覆蓋 .overlay 的置中），讓切換月份檔數變動時視窗頂端位置固定、不跳動
    ov.style.alignItems = 'flex-start';
    ov.style.paddingTop = '8vh';
    ov.style.overflowY = 'auto';
    document.body.appendChild(ov);
    var _md = false;
    ov.addEventListener('mousedown', function(e){ _md = (e.target === ov); });
    ov.addEventListener('click', function(e){ if (e.target === ov && _md) ov.remove(); _md = false; });
    _renderDivMonthDetail(ov, ym, label);
}

// 在既有 overlay 內重畫某月明細（供左右切換月份用，不重建 overlay）
function _renderDivMonthDetail(ov, ym, label) {
    var list = (_divForecastDetail && _divForecastDetail[ym]) || [];
    var total = list.reduce(function(s, x){ return s + x.amt; }, 0);
    var totalStock = list.reduce(function(s, x){ return s + (x.stockShares || 0); }, 0);
    var u = function(t){ return '<span style="color:var(--muted);font-weight:400">' + t + '</span>'; }; // 淡色小單位

    // 可切換月份：所有有資料的月份，依時間排序；找出目前位置與前後月
    var ymList = Object.keys(_divForecastDetail || {})
        .filter(function(k){ return (_divForecastDetail[k] || []).length > 0; })
        .sort(function(a, b){ return _ymNum(a) - _ymNum(b); });
    var ci = ymList.indexOf(ym);
    var prevYm = ci > 0 ? ymList[ci - 1] : '';
    var nextYm = (ci >= 0 && ci < ymList.length - 1) ? ymList[ci + 1] : '';
    var _label = function(y){ var m = String(y).split('-')[1]; return m + '月'; };

    var rows = list.map(function(x){
        // 已公告：金額原色(navy)＋標「已公告」；純推估：金額紅色＋標「預估」
        var amtColor = x.announced ? 'var(--lux-navy)' : '#DC2626';
        var tag = x.announced
            ? '<span style="font-size:11px;color:var(--green);margin-left:6px">已公告</span>'
            : '<span style="font-size:11px;color:#DC2626;margin-left:6px">預估</span>';
        var perShareCell = (x.cpsPerTime > 0)
            ? x.cpsPerTime.toFixed(3) + u('元') + ' × ' + fmt(x.shares) + u('股')
            : '—';
        var cashCell = (x.amt > 0) ? '$' + fmt(Math.round(x.amt)) : '<span style="color:var(--muted)">—</span>';
        var stockCell = (x.stockShares > 0)
            ? '<span style="color:#7C3AED">≈ ' + fmt(Math.round(x.stockShares)) + u('股') + '</span>'
            : '<span style="color:var(--muted)">—</span>';
        return '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="text-align:left;padding:8px 4px"><b>' + esc(x.id) + '</b> <span style="color:var(--muted);font-size:12px">' + esc(x.name) + '</span>' + tag + '</td>' +
            '<td style="text-align:right;padding:8px 4px;color:var(--muted);font-size:12px">' + perShareCell + '</td>' +
            '<td style="text-align:right;padding:8px 4px;font-weight:600;color:' + amtColor + '">' + cashCell + '</td>' +
            '<td style="text-align:right;padding:8px 4px;font-weight:600;font-size:12px">' + stockCell + '</td>' +
            '</tr>';
    }).join('');
    // 月份左右切換鈕
    var navBase = 'flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:14px;color:var(--text)';
    var navOn = navBase + ';cursor:pointer', navOff = navBase + ';opacity:0.3;cursor:not-allowed';
    var navHtml = '<div style="display:flex;align-items:center;gap:6px;margin:0 0 8px">' +
        (prevYm ? '<button type="button" class="div-month-prev" title="上一月" style="' + navOn + '"><i class="ti ti-chevron-left"></i></button>'
                : '<button type="button" disabled style="' + navOff + '"><i class="ti ti-chevron-left"></i></button>') +
        '<h3 style="margin:0;display:inline-flex;align-items:center;gap:6px;font-size:17px"><i class="ti ti-calendar-dollar"></i> ' + esc(label) + '預估配息</h3>' +
        (nextYm ? '<button type="button" class="div-month-next" title="下一月" style="' + navOn + '"><i class="ti ti-chevron-right"></i></button>'
                : '<button type="button" disabled style="' + navOff + '"><i class="ti ti-chevron-right"></i></button>') +
        '</div>';

    ov.innerHTML = '<div class="modal" style="width:600px;max-width:92vw">' +
        navHtml +
        '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">合計 現金 <b style="color:var(--lux-navy);font-size:15px">$' + fmt(Math.round(total)) + '</b>' +
            (totalStock > 0 ? '　配股 <b style="color:#7C3AED">≈ ' + fmt(Math.round(totalStock)) + ' 股</b>' : '') +
            '　共 ' + list.length + ' 檔</div>' +
        (list.length ? '<table class="stock-table" style="width:100%;font-size:13px"><thead><tr>' +
            '<th style="text-align:left;padding:6px 4px">股票</th>' +
            '<th style="text-align:right;padding:6px 4px">每股 × 股數</th>' +
            '<th style="text-align:right;padding:6px 4px">現金</th>' +
            '<th style="text-align:right;padding:6px 4px">配股</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div style="padding:20px;text-align:center;color:var(--muted)">此月無預估配息</div>') +
        '<div style="font-size:11px;color:var(--muted);margin-top:8px">※ <span style="color:var(--green)">已公告</span>＝官方已定除息／配息；<span style="color:#DC2626">預估</span>＝以最近一次配息推估（未公告，僅供參考）。</div>' +
        '<div class="modal-btns" style="margin-top:12px"><button class="btn-primary" onclick="this.closest(\'.overlay\').remove()">關閉</button></div>' +
        '</div>';

    var pb = ov.querySelector('.div-month-prev');
    if (pb) pb.onclick = function(){ _renderDivMonthDetail(ov, prevYm, _label(prevYm)); };
    var nb = ov.querySelector('.div-month-next');
    if (nb) nb.onclick = function(){ _renderDivMonthDetail(ov, nextYm, _label(nextYm)); };
}

// 全年配息預估卡片：以「過去 12 個月每股實配 × 現股數」逐檔推估未來一年領息（參考值）
function _buildDividendForecastHtml() {
    var holdings = (stockData.holdings || []).filter(function(h){ return (h.shares || 0) > 0; });
    if (holdings.length === 0) return '';

    // 除權息快取尚未載入完成時，先顯示「計算中」占位，避免用不完整資料算出偏低/閃動的數字。
    // 快取載入完成後 checkDividendAlerts 會觸發 renderStock 重畫，屆時才顯示正確值。
    if (typeof _dividendAlertChecked !== 'undefined' && !_dividendAlertChecked) {
        return '<div style="position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f2847 0%,#1a3a5c 100%);color:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px">' +
            '<i class="ti ti-loader-2" style="animation:div-spin 1s linear infinite;display:inline-block;font-size:18px;color:var(--lux-gold)"></i>' +
            '<span style="font-size:14px;opacity:.9">全年配息預估計算中…（等除權息資料載入）</span>' +
            '</div>';
    }

    var now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    var oneYearAgo = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate());
    var thisYear = String(now.getFullYear());

    // 各檔：過去 12 個月「最近一次每股配息」(用最新公告值推估) + 年配次數 + 發放月份分布。
    //   payMonths 用「配息日(發放)月份」歸月，反映現金何時入帳；無配息日才退回除息月。
    var lastCps = {};      // id → 最近一次每股現金配息
    var lastStockDiv = {}; // id → 最近一次每股配股(元/股；配股率 = /10)
    var lastEx = {};       // id → 最近一次的除息日(判斷誰較新)
    var freq = {};         // id → 過去12月配息次數
    var payMonths = {};    // id → { 月(1-12): true }（發放月）
    (_dividendCacheItems || []).forEach(function(it){
        if (!it || !it.stockId || !it.exDate) return;
        var c = Number(it.cash) || 0;
        var sd = Number(it.stockDiv) || 0;
        if (c <= 0 && sd <= 0) return; // 現金與配股都 0 才跳過
        var p = it.exDate.split('-');
        if (p.length !== 3) return;
        var d = new Date(+p[0], +p[1]-1, +p[2]);
        // 太舊的（超過一年前）一律不要
        if (d < oneYearAgo) return;
        var id = it.stockId;
        // 最近一次（除息日最新者）的現金與配股：含「未來但已公告」的最新一筆（才能用最新配息推估，不被舊值卡住）
        if (!lastEx[id] || it.exDate > lastEx[id]) { lastEx[id] = it.exDate; lastCps[id] = c; lastStockDiv[id] = sd; }
        // 發放月份：優先 payDate，否則除息月（含未來已公告，讓未來月份能據此推估）
        var payP = (it.payDate || '').split('-');
        var payMon = (payP.length === 3) ? +payP[1] : +p[1];
        if (!payMonths[id]) payMonths[id] = {};
        payMonths[id][payMon] = true;
        // 年配次數 freq：只計過去 12 個月內、已發生（除息日 ≤ 今天）的，反映實際配息頻率
        if (d <= now) freq[id] = (freq[id] || 0) + 1;
    });

    // 逐檔預估年配息（最近一次每股 × 年配次數 × 股數）+ 總市值
    var estTotal = 0, totalMarket = 0;
    holdings.forEach(function(h){
        var est = (lastCps[h.id] || 0) * (freq[h.id] || 0) * (h.shares || 0);
        estTotal += est;
        var pr = stockData.prices && stockData.prices[h.id];
        if (pr && typeof pr.price === 'number') totalMarket += (h.shares || 0) * pr.price;
    });
    if (estTotal <= 0) return ''; // 沒有任何配息資料就不顯示

    var yieldPct = totalMarket > 0 ? (estTotal / totalMarket * 100) : 0;

    // 今年已領（用手記的實際金額最準）
    var receivedThisYear = 0;
    (stockData.dividends || []).forEach(function(d){
        if (d.date && d.date.substring(0,4) === thisYear) receivedThisYear += (d.cash || 0);
    });
    var progPct = estTotal > 0 ? Math.min(100, receivedThisYear / estTotal * 100) : 0;

    // 已公告的未來配息（逐檔逐月）：快取中「尚未入帳」的持股紀錄（配息日≥今天；無配息日則除息日≥今天），
    // 其發放年月標為已公告。涵蓋「已除息、待發放」的情況（如月配 ETF 除息已過、配息日未到）。
    // key = 'id|YYYY-M'，供明細視窗判斷該檔該月是「已公告」還是「純推估」。
    var todayStr = _localDateStr(now);
    var announcedKey = {};
    (_dividendCacheItems || []).forEach(function(it){
        if (!it || !it.stockId || !it.exDate) return;
        var refDate = it.payDate || it.exDate; // 以「實際入帳日」為準，沒配息日才退回除息日
        if (refDate < todayStr) return;        // 已入帳/過期的不算「未來已公告」
        var payP = refDate.split('-');
        if (payP.length === 3) announcedKey[it.stockId + '|' + (+payP[0]) + '-' + (+payP[1])] = true;
    });

    // 未來 6 個月各月預估（用各檔「發放月份」推算該月會配，每次金額 = 最近一次每股 × 股數）
    var monthEst = {};    // 'YYYY-M' → 金額
    var monthDetail = {}; // 'YYYY-M' → [{ id, name, amt, cpsPerTime, shares, announced }]  逐檔明細
    var monthNames = [];
    for (var k = 1; k <= 6; k++) {
        var dt = new Date(now.getFullYear(), now.getMonth() + k, 1);
        var ym = dt.getFullYear() + '-' + (dt.getMonth() + 1);
        monthNames.push({ ym: ym, mon: dt.getMonth() + 1, label: (dt.getMonth() + 1) + '月' });
        monthEst[ym] = 0;
        monthDetail[ym] = [];
    }
    holdings.forEach(function(h){
        var months = payMonths[h.id];
        if (!months) return;
        var cpsPerTime = lastCps[h.id] || 0;            // 最近一次每股現金配息
        var sdPerShare = lastStockDiv[h.id] || 0;       // 最近一次每股配股(元/股)
        var perTime = cpsPerTime * (h.shares || 0);     // 每次現金配息估值（金額）
        var stockSharesEst = (sdPerShare / 10) * (h.shares || 0); // 配股率(=元/10) × 股數 = 預估配股股數
        if (perTime <= 0 && stockSharesEst <= 0) return;
        monthNames.forEach(function(mn){
            if (months[mn.mon]) {
                monthEst[mn.ym] += perTime;
                monthDetail[mn.ym].push({ id: h.id, name: h.name || h.id, amt: perTime, cpsPerTime: cpsPerTime, shares: h.shares || 0, stockShares: stockSharesEst, announced: !!announcedKey[h.id + '|' + mn.ym] });
            }
        });
    });
    // 存到全域供月份明細視窗使用（金額由大到小）
    Object.keys(monthDetail).forEach(function(ym){
        monthDetail[ym].sort(function(a,b){ return b.amt - a.amt; });
    });
    _divForecastDetail = monthDetail;

    var html = '<div style="position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0f2847 0%,#1a3a5c 100%);color:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)">';
    html += '<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px">';
    html += '<span style="font-size:13px;opacity:.85">預估全年配息</span>';
    html += '<span style="font-size:24px;font-weight:700;color:var(--lux-gold)">$' + fmt(Math.round(estTotal)) + '</span>';
    html += '<span style="font-size:13px;opacity:.85">組合殖利率 <b style="color:var(--lux-gold);font-size:15px">' + yieldPct.toFixed(2) + '%</b></span>';
    html += '<span style="margin-left:auto;font-size:12px;opacity:.8">今年已領 $' + fmt(Math.round(receivedThisYear)) + ' ／ 預估 $' + fmt(Math.round(estTotal)) + '（' + progPct.toFixed(0) + '%）</span>';
    html += '</div>';
    // 進度條
    html += '<div style="height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-bottom:10px"><div style="height:100%;width:' + progPct.toFixed(1) + '%;background:var(--lux-gold)"></div></div>';
    // 未來 6 個月
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
    monthNames.forEach(function(mn){
        var amt = Math.round(monthEst[mn.ym]);
        var clickable = amt > 0;
        var cellStyle = 'flex:1 1 90px;min-width:80px;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 8px;text-align:center';
        if (clickable) cellStyle += ';cursor:pointer';
        var attr = clickable ? ' onclick="showDivMonthDetail(\'' + mn.ym + '\',\'' + mn.label + '\')" title="點看 ' + mn.label + '配息明細"' : '';
        html += '<div style="' + cellStyle + '"' + attr + '>' +
            '<div style="font-size:11px;opacity:.75">' + mn.label + (clickable ? ' <i class="ti ti-chevron-right" style="font-size:10px;opacity:.6"></i>' : '') + '</div>' +
            '<div style="font-size:14px;font-weight:600;color:' + (amt > 0 ? 'var(--lux-gold)' : 'rgba(255,255,255,.4)') + '">' + (amt > 0 ? '$' + fmt(amt) : '—') + '</div>' +
            '</div>';
    });
    html += '</div>';
    html += '<div style="font-size:11px;opacity:.6;margin-top:8px">※ 以最近一次配息 × 目前股數推估，僅供參考；實際配息每年可能不同。</div>';
    html += '</div>';
    return html;
}

function renderStockDividend() {
    var html = '';

    // 卡片切換模式：'thisYear'（本年，預設）或 'cumulative'（累積）
    if (!window._divCardMode) window._divCardMode = 'thisYear';
    var mode = window._divCardMode;
    var thisYear = String(new Date().getFullYear());

    // 全年配息預估卡片（放分頁頂部）
    html += _buildDividendForecastHtml();

    html += '<div class="div-summary-wrap" style="margin-bottom:12px">';
    html += '<div class="div-add-row">';
    html += '<button class="btn-refresh" style="background:var(--lux-navy)" onclick="addDividend()">＋ 新增股利</button>';
    html += '</div>';
    // 切換按鈕：本年 / 累積（與「+ 新增股利」按鈕同高度/字體；segmented control 樣式）
    html += '<div class="div-mode-tabs" style="display:inline-flex;border:1px solid var(--lux-navy);border-radius:var(--radius-xs);overflow:hidden">';
    html += '<button onclick="setDivCardMode(\'thisYear\')" style="padding:9px 18px;border:none;background:' + (mode==='thisYear'?'var(--lux-navy)':'white') + ';color:' + (mode==='thisYear'?'white':'var(--lux-navy)') + ';font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:inherit;border-right:1px solid var(--lux-navy)">本年</button>';
    html += '<button onclick="setDivCardMode(\'cumulative\')" style="padding:9px 18px;border:none;background:' + (mode==='cumulative'?'var(--lux-navy)':'white') + ';color:' + (mode==='cumulative'?'white':'var(--lux-navy)') + ';font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:inherit">累積</button>';
    html += '</div>';
    html += '</div>';

    if (stockData.dividends.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:var(--muted)">尚未新增股利紀錄</div>';
        return html;
    }

    // 按年份分組（保留原 idx 給編輯/刪除）
    var byYear = {};
    stockData.dividends.forEach(function(d, idx) {
        var y = d.date ? d.date.substring(0,4) : '未知';
        if (!byYear[y]) byYear[y] = [];
        byYear[y].push({ d: d, idx: idx });
    });

    var years = Object.keys(byYear).sort().reverse(); // 新→舊
    var currentYear = String(new Date().getFullYear());
    var isCum = (mode === 'cumulative');

    var items, curY = '';
    if (isCum) {
        // 累積：列出全部年度的股利（不分年、不顯示年份切換）
        items = [];
        years.forEach(function(y){ items = items.concat(byYear[y]); });
    } else {
        // 本年：選定年份（使用者切換的 > 今年 > 最新有資料的年），保留年份切換列
        curY = window._divListYear;
        if (!curY || years.indexOf(curY) < 0) curY = (years.indexOf(currentYear) >= 0) ? currentYear : years[0];
        items = byYear[curY] || [];
    }
    var listTotal = 0; items.forEach(function(it){ listTotal += (it.d.cash || 0); });

    if (isCum) {
        // 累積：只顯示合計列，無年份切換
        html += '<div style="display:flex;align-items:center;margin-bottom:10px">';
        html += '<span style="font-size:15px;font-weight:600;color:var(--text)">累積股利（全部年度）</span>';
        html += '<span style="margin-left:auto;font-size:13px;color:var(--muted)">合計 <b style="color:var(--lux-navy);font-size:15px">$' + fmt(listTotal) + '</b>　' + items.length + ' 筆</span>';
        html += '</div>';
    } else {
        // 本年：年份左右切換（years 新→舊：上一年=較舊=index+1、下一年=較新=index-1）
        var ci = years.indexOf(curY);
        var prevY = (ci >= 0 && ci < years.length - 1) ? years[ci + 1] : '';
        var nextY = (ci > 0) ? years[ci - 1] : '';
        var aBase = 'flex:0 0 auto;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:16px;color:var(--text)';
        var aOn = aBase + ';cursor:pointer', aOff = aBase + ';opacity:0.3;cursor:not-allowed';
        // 把年份清單（西元年，舊→新）暫存到全域，讓中間框點下去可叫出年份選單直接挑年；顯示用民國
        window._yearPickerData = window._yearPickerData || {};
        window._yearPickerData['onDivListYearChange'] = years.slice().reverse();
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
        html += prevY ? '<button type="button" onclick="onDivListYearChange(\'' + esc(prevY) + '\')" title="上一年" style="' + aOn + '"><i class="ti ti-chevron-left"></i></button>'
                      : '<button type="button" disabled style="' + aOff + '"><i class="ti ti-chevron-left"></i></button>';
        html += '<button type="button" onclick="openYearPicker(\'onDivListYearChange\',\'' + esc(curY) + '\',\'_yearLabelROC\')" title="點選年份" style="min-width:120px;height:34px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit"><span>' + (parseInt(curY,10) ? (parseInt(curY,10)-1911) : curY) + ' 年</span><i class="ti ti-chevron-down" style="font-size:12px;color:var(--muted)"></i></button>';
        html += nextY ? '<button type="button" onclick="onDivListYearChange(\'' + esc(nextY) + '\')" title="下一年" style="' + aOn + '"><i class="ti ti-chevron-right"></i></button>'
                      : '<button type="button" disabled style="' + aOff + '"><i class="ti ti-chevron-right"></i></button>';
        html += '<span style="margin-left:auto;font-size:13px;color:var(--muted)">合計 <b style="color:var(--lux-navy);font-size:15px">$' + fmt(listTotal) + '</b>　' + items.length + ' 筆</span>';
        html += '</div>';
    }

    // 該年依「股票」分組，每檔一行（年合計＋筆數），點開看逐筆明細
    var byStock = {};
    items.forEach(function(it){
        var sid = it.d.stockId;
        if (!byStock[sid]) byStock[sid] = { id: sid, name: it.d.stockName || sid, list: [], cash: 0, stockShares: 0 };
        byStock[sid].list.push(it);
        byStock[sid].cash += (it.d.cash || 0);
        byStock[sid].stockShares += (it.d.stockShares || 0);
    });

        // 展開的逐筆明細
        if (open) {

                    '<td style="text-align:right;padding:6px 8px;color:var(--green);font-weight:600">' + (d.cash > 0 ? fmt(d.cash) : '-') + '</td>' +
                    '<td style="text-align:right;padding:6px 8px">' + (d.stockShares > 0 ? d.stockShares + ' 股' : '-') + '</td>' +
                    '<td style="width:56px;white-space:nowrap">' +
                        '<button onclick="event.stopPropagation();editDividend(' + item.idx + ')" title="編輯" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;font-size:14px;line-height:1"><i class="ti ti-pencil"></i></button>' +
                        '<button class="btn-del" onclick="event.stopPropagation();deleteDividend(' + item.idx + ')"><i class="ti ti-x" style="font-size:14px"></i></button>' +
                    '</td></tr>';
            };
            var thead = '<thead><tr>' +
                '<th style="text-align:left;padding:6px 8px">日期</th>' +
                '<th style="text-align:right;padding:6px 8px">每股配息</th>' +
                '<th style="text-align:right;padding:6px 8px">現金股利</th>' +
                '<th style="text-align:right;padding:6px 8px">股票股利</th>' +
                '<th style="width:56px"></th>' +
                '</tr></thead>';
            if (isCum) {
                // 累積：該檔逐筆「依年份分組」呈現（每年一個小標＋該年明細＋年合計）
                var byY = {};
                g.list.forEach(function(item){
                    var y = item.d.date ? item.d.date.substring(0,4) : '未知';
                    if (!byY[y]) byY[y] = [];
                    byY[y].push(item);
                });
                Object.keys(byY).sort().reverse().forEach(function(y){
                    var yItems = byY[y].slice().sort(function(a,b){ return (b.d.date||'').localeCompare(a.d.date||''); });
                    var yCash = 0; yItems.forEach(function(it){ yCash += (it.d.cash || 0); });
                    var yLabel = (parseInt(y,10) ? (parseInt(y,10)-1911) + ' 年' : y);
                    // 年份小標可點收合，預設收合（只看年合計，點了才展開該年逐筆）
                    var yKey = key + '|Y|' + y;
                    var yOpen = !!window._divExpandStock[yKey];
                    html += '<div onclick="toggleDivStock(\'' + esc(yKey) + '\')" style="display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--border);font-size:12px;cursor:pointer">' +
