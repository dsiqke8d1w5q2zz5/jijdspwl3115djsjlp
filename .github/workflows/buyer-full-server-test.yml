name: Complete encrypted server search test
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Diagnose source access without running the full workload'
        type: boolean
        default: false
      image_recheck:
        description: 'Recheck every prior image and repeated listing states'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: crm-full-server-test-${{ inputs.diagnostic && 'diagnostic' || 'full' }}
  cancel-in-progress: false
jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix 01-crm/tools/buyer-feed --ignore-scripts --no-audit --no-fund
      - run: node 01-crm/tests/server-full.test.cjs
      - name: Install isolated server browser
        run: |
          npm install --prefix "$RUNNER_TEMP/crm-full-test" playwright@1.62.1 --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/crm-full-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test complete encrypted scope
        env:
          CRM_FULL_TEST_KEY: ${{ secrets.CRM_FULL_TEST_KEY_20261126 }}
          IMAGES_ONLY: ${{ inputs.image_recheck && '1' || '0' }}
          IMAGE_INPUT: 01-crm/tools/server-test/images.encrypted.json
          DIAGNOSTIC: ${{ inputs.diagnostic && '1' || '0' }}
          SCOPE_FILE: 01-crm/tools/server-test/scope.encrypted.json
          TEST_OUTPUT: server-test-summary.json
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/crm-full-test/node_modules/playwright"
          node 01-crm/tools/server-test/full.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-server-test-results
          path: |
            server-test-summary.json
            server-test-summary.encrypted.json
          retention-days: 3
