name: Daily buyer listing feed
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buyer-listing-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01-crm/tools/buyer-feed/package-lock.json
      - run: npm ci --prefix 01-crm/tools/buyer-feed --ignore-scripts --no-audit --no-fund
      - run: node 01-crm/tests/buyer-feed.test.cjs
      - run: node 01-crm/tools/buyer-feed/collect.cjs
      - name: Save public listing digest
        if: always()
        run: |
          if [ ! -f 01-crm/data/buyer-feed.json ]; then exit 1; fi
          git config user.name 'buyer-feed-bot'
          git config user.email 'buyer-feed-bot@users.noreply.github.com'
          git add -- 01-crm/data/buyer-feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(crm): refresh public buyer listing feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
